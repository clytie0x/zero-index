name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ต้องมีประวัติครบ จึงจะบอกวันที่แก้ล่าสุดของแต่ละหน้าได้
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # GCC 14 รุ่นเดียวกับที่มากับ Code::Blocks 25.03
      - run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14
      - run: python3 tools/prepare_tests.py && python3 tools/check_code.py
        env:
          ZI_GCC: gcc-14
          ZI_GXX: g++-14
      - run: python3 tools/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
