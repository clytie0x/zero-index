title = "เพลย์ลิสต์ไม่ซ้ำ"
level = 3
time_limit = 1
source = "แนวเดียวกับโจทย์หาช่วงที่ยาวที่สุดที่ไม่มีค่าซ้ำ ซึ่งใช้ฝึกสองตัวชี้"
hint = '''<p>ถ้าช่วงหนึ่งไม่มีเพลงซ้ำ ช่วงที่อยู่ข้างในก็ไม่มีเพลงซ้ำด้วย จึงใช้สองตัวชี้แบบหน้า 18.5 ได้ ขยาย r ทีละเพลง ใช้อาเรย์นับว่าในช่วงตอนนี้มีเพลงแต่ละรหัสกี่ครั้ง ถ้าเพลงใหม่ทำให้มีเพลงซ้ำ ให้เลื่อน l ไปพร้อมลดตัวนับจนไม่ซ้ำ ทั้ง l และ r เดินไปทางเดียวรวมไม่เกิน 2N ก้าว เป็น O(N) อัปเดตคำตอบเฉพาะตอนได้ช่วงที่ยาวกว่าเดิมจริงๆ จะได้ช่วงที่เริ่มเร็วที่สุดเอง</p>'''
