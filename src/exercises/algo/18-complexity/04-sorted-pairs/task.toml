hint = '''<p>ข้อ 3 ใช้อาเรย์นับได้เพราะค่าไม่เกิน 10<sup>6</sup> ข้อนี้ราคาถึง 2 × 10<sup>9</sup> ใช้วิธีนั้นไม่ได้ แต่ราคาเรียงมาแล้วและไม่ซ้ำ ใช้สองตัวชี้ i เริ่มที่ชิ้นถูกสุด j เริ่มที่ชิ้นแพงสุด ถ้ารวมกันน้อยกว่า K ชิ้น i จับคู่กับชิ้นไหนที่เหลือก็ไม่พอ ให้เลื่อน i ไปทางขวา ถ้ามากกว่า K ให้เลื่อน j ไปทางซ้าย ถ้าพอดีให้นับแล้วเลื่อนทั้งคู่ ทำจน i กับ j มาเจอกัน เป็น O(N) ระวังราคาสองชิ้นรวมกันได้ถึงเกือบ 4 × 10<sup>9</sup> เกิน <code>int</code> และ K ก็เกิน <code>int</code> ได้</p>'''
