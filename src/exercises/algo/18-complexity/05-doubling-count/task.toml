hint = '''<p>ลูปในของรอบที่ i วนเท่ากับจำนวนหลักของ i เมื่อเขียนเป็นเลขฐานสอง i ที่ 2<sup>b−1</sup> ≤ i ≤ 2<sup>b</sup> − 1 วนลูปในเท่ากันคือ b รอบ และมี 2<sup>b−1</sup> ตัว แบ่ง 1 ถึง N เป็นกลุ่มตาม b แล้วบวก b × จำนวนตัวในกลุ่ม กลุ่มสุดท้ายถูก N ตัดกลางทาง ต้องนับแค่ถึง N มีไม่เกินราว 50 กลุ่ม จึงเป็น O(log N)</p>'''
