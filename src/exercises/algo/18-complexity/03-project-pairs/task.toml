title = "คู่คะแนนพอดี"
level = 1
time_limit = 1
hint = '''<p>ไล่นักเรียนทีละคนจากซ้ายไปขวา คนที่มีคะแนน x จับคู่กับคนก่อนหน้าที่มีคะแนน K − x ได้ทุกคน ถ้าเก็บอาเรย์นับว่าคะแนนแต่ละค่าเคยเห็นมาแล้วกี่คนแบบหน้า 5.3 ก็บวกจำนวนนั้นได้ทันที แล้วค่อยนับคนปัจจุบันเพิ่ม รวมเป็น O(N) ระวังสองเรื่อง K − x อาจน้อยกว่า 1 หรือเกิน 1000000 ซึ่งอยู่นอกอาเรย์ และจำนวนคู่ใหญ่ได้ถึงราว 2 × 10<sup>10</sup> ต้องใช้ <code>long long</code></p>'''
