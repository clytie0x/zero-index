hint = '''<p>ถ้าเก็บคิวใน vector แล้วลบหัวคิวด้วย <code>erase(v.begin())</code> ทุกครั้งที่ลบต้องเลื่อนคนที่เหลือทั้งแถว เมื่อคิวยาวหลายแสนคนจะไม่ทัน ใช้ <code>queue</code> จากบทที่ 17 ที่ <code>push</code> และ <code>pop</code> ได้ใน O(1) หรือเก็บใน vector แล้วจำตำแหน่งหัวคิวไว้ในตัวแปร แบบในหน้า 18.4</p>'''
