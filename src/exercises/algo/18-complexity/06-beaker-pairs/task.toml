title = "บีกเกอร์ตวงพอดี"
level = 2
time_limit = 1
hint = '''<p>ไล่ทุกคู่ต้องหาร N(N − 1) ครั้ง ราว 4 × 10<sup>10</sup> ไม่ทัน ความจุไม่เกิน 10<sup>6</sup> จึงนับด้วยอาเรย์ได้ว่าความจุแต่ละค่ามีกี่ใบ แล้วกลับด้านคำถาม แทนที่จะถามว่าใบที่รับหารด้วยอะไรลงตัว ให้ไล่ความจุของใบที่ตัก d แล้วกระโดดไปทุกพหุคูณ 2d 3d ... จนถึง 10<sup>6</sup> จำนวนรอบรวมคือ 10<sup>6</sup>/1 + 10<sup>6</sup>/2 + ... ซึ่งเป็น O(V log V) แบบลูป harmonic ในหน้า 18.3 คู่ที่ความจุเท่ากันต้องนับแยก เพราะห้ามใช้ใบเดียวกันทั้งตักและรับ คำตอบเกิน <code>int</code> ได้</p>'''
