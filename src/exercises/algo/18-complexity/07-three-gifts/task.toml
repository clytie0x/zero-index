source = "แนวเดียวกับโจทย์ 3SUM ที่ใช้ฝึกลดความซับซ้อน"
hint = '''<p>N ≤ 5000 ลูปสามชั้นทำงานราว N<sup>3</sup> / 6 ≈ 2 × 10<sup>10</sup> ครั้ง ไม่ทัน แต่ O(N<sup>2</sup>) ยังทัน ให้ตรึงชิ้นกลาง j แล้วไล่ชิ้นท้าย k ที่อยู่หลัง j ราคาของชิ้นแรกต้องเป็น K − p<sub>j</sub> − p<sub>k</sub> พอดี ถ้ามีอาเรย์นับว่าราคาแต่ละค่าปรากฏกี่ครั้งในชิ้นที่อยู่ก่อน j ก็บวกได้ทันที ไล่ k ครบแล้วค่อยนับ p<sub>j</sub> ลงอาเรย์ ก่อนขยับ j ไปตัวถัดไป ราคาที่ต้องการอาจน้อยกว่า 1 หรือเกิน 1000000 และคำตอบเกิน <code>int</code> ได้</p>'''
