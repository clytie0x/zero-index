hint = '''<p>ถ้าตอบแต่ละคำถามด้วยการไล่ k วันแรกใหม่ งานรวมคือ O(NQ) ซึ่งเป็น 4 × 10<sup>10</sup> ไม่ทัน ให้เตรียมคำตอบของทุก k ไว้ก่อนในรอบเดียว ไล่วันที่ 1 ถึง N ใช้อาเรย์จำว่าชนิดไหนเคยเห็นแล้วแบบหน้า 5.3 นับชนิดใหม่สะสมไป แล้วเก็บจำนวนชนิดหลังวันที่ k ไว้ในช่องที่ k จากนั้นตอบคำถามละ O(1) รวมเป็น O(N + Q)</p>'''
