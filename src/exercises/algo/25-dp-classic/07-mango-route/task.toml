title = "เส้นทางเก็บมะม่วง"
level = 2
time_limit = 1
hint = '''<p>ย้อนรอยจากช่องขวาล่างแบบโปรแกรม mango-path ในหน้า 25.4 ไม่พอ เพราะการเลือกตอนเสมอจากท้ายไม่ได้ให้ข้อความที่มาก่อนเมื่ออ่านจากหน้า ให้คิดตารางกลับทิศ <code>to_end[r][c]</code> คือคะแนนมากสุดจากช่องนี้ไปถึงช่องขวาล่าง (รวมช่องนี้) เติมจากแถวล่างขึ้นบน ขวาไปซ้าย แล้วเดินจากช่องซ้ายบนไปข้างหน้า ทุกก้าวเลือก <code>D</code> ถ้าเดินลงได้และ <code>to_end</code> ของช่องล่างไม่น้อยกว่าของช่องขวา ระวังขอบด้านล่างกับด้านขวาที่มีทางเดียว และค่าติดลบ คะแนนรวมเกิน <code>int</code></p>'''
