title = "รถส่งนมรอบเช้า"
level = 3
time_limit = 1
source = "แนวเดียวกับโจทย์ travelling salesman ที่มีเงื่อนไขลำดับการไป"
hint = '''<p>N ไม่เกิน 16 เป็นสัญญาณของ DP บน bitmask ให้ <code>best[mask][last]</code> คือระยะสั้นที่สุดที่ส่งครบจุดใน mask แล้วอยู่ที่ last ส่วนที่ต้องคิดเพิ่มคือเงื่อนไขร้านด่วน เก็บร้านด่วนทั้งหมดเป็น mask หนึ่งตัว ตอนจะต่อไปร้าน next ที่ไม่ใช่ร้านด่วน ต้องเช็กก่อนว่า mask ปัจจุบันมีร้านด่วนครบแล้ว ส่วนร้านด่วนต่อได้เสมอ ตอนจบต้องบวกระยะจาก last กลับจุด 0 ตามทิศ <code>dist[last][0]</code> และถ้า N เป็น 1 คำตอบคือ 0 ห้ามหาทางสั้นสุดระหว่างทุกคู่ก่อน เพราะโจทย์ไม่ให้อ้อม ลองทุกลำดับร้านมี 15! ราว 1.3 × 10<sup>12</sup> แบบ ส่วน bitmask มีไม่ถึง 2 × 10<sup>7</sup> ขั้น</p>'''
