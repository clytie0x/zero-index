hint = '''<p>N ไม่เกิน 16 เป็นสัญญาณของ DP บน bitmask ในหน้า 25.5 ใช้ <code>best[mask][last]</code> แบบโปรแกรม delivery-tsp ได้เกือบทั้งหมด ต่างกันสองจุด คำตอบไม่ต้องบวกระยะกลับจุด 0 ให้เอา <code>best[full][last]</code> ที่น้อยสุดมาตอบเลย และระยะไปกับกลับไม่เท่ากัน ต้องใช้ <code>dist[last][next]</code> ตามทิศที่เดินจริง ถ้า N เป็น 1 คำตอบคือ 0 ลองทุกลำดับร้านมี 15! ราว 1.3 × 10<sup>12</sup> แบบ ส่วน bitmask มีไม่ถึง 2 × 10<sup>7</sup> ขั้น</p>'''
