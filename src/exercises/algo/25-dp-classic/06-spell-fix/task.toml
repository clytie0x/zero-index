hint = '''<p>เป็น edit distance ในหน้า 25.3 <code>cost[i][j]</code> คือจำนวนครั้งน้อยสุดที่แก้ i ตัวแรกของคำแรกให้เป็น j ตัวแรกของคำที่สอง ตัวสุดท้ายตรงกันได้ช่องทแยง ไม่ตรงได้ 1 บวกค่าน้อยสุดของช่องทแยง (เปลี่ยน) ช่องบน (ลบ) และช่องซ้าย (แทรก) ขอบไม่ใช่ 0 แบบ LCS <code>cost[i][0] = i</code> และ <code>cost[0][j] = j</code> ถ้าใช้สองแถว ช่อง 0 ของแถวใหม่ต้องตั้งเป็น i ทุกแถว</p>'''
