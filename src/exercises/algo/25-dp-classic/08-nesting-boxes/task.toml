title = "ซ้อนกล่องของขวัญ"
level = 3
time_limit = 1
source = "แนวเดียวกับโจทย์ซ้อนซองจดหมาย (Russian doll envelopes)"
hint = '''<p>เรียงกล่องตามความกว้างจากน้อยไปมาก แล้วชุดที่ซ้อนกันได้ต้องเป็นลำดับย่อยที่ความยาวเพิ่มขึ้นจริงๆ จึงกลายเป็น LIS ในหน้า 25.2 ปัญหาอยู่ที่กล่องที่กว้างเท่ากัน ซึ่งซ้อนกันไม่ได้ แต่ LIS อาจเลือกหลายใบที่กว้างเท่ากันถ้าความยาวเรียงเพิ่มขึ้น วิธีแก้คือเมื่อกว้างเท่ากันให้เรียงความยาว <strong>จากมากไปน้อย</strong> กล่องที่กว้างเท่ากันจะเลือกได้ไม่เกินหนึ่งใบเพราะความยาวลดลง แล้วทำ LIS แบบเพิ่มขึ้นจริงๆ บนความยาวด้วย <code>lower_bound</code> วิธี O(N<sup>2</sup>) ต้องเทียบราว 5 × 10<sup>9</sup> คู่ ไม่ทัน</p>'''
