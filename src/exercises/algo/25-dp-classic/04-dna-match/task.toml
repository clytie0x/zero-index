hint = '''<p>เป็น LCS ในหน้า 25.3 ตรงๆ ถ้าตัวสุดท้ายตรงกันได้ช่องทแยงบวกหนึ่ง ถ้าไม่ตรงได้ค่ามากกว่าของช่องบนกับช่องซ้าย ระวังตารางเริ่มที่ 1 แต่สตริงเริ่มที่ 0 ต้องเทียบ <code>s[i - 1]</code> กับ <code>t[j - 1]</code> ตารางเต็ม 5001 × 5001 ช่องใช้ราว 100 MB โจทย์ถามแค่ความยาว จึงเก็บสองแถวพอ recursion ที่ไม่จดคำตอบยาวแค่ 16 ตัวก็เกินวินาทีแล้ว</p>'''
