source = "แนวเดียวกับโจทย์ unbounded knapsack และโจทย์ตัดแท่งเหล็กขาย"
hint = '''<p>แต่ละแบบตัดซ้ำได้ไม่จำกัด เป็น unbounded knapsack ในหน้า 25.1 ใช้ <code>best[c]</code> คือรายได้มากสุดจากผ้ายาว c เซนติเมตร แต่ละแบบวน c <strong>เดินหน้า</strong> จาก l<sub>i</sub> ถึง L เพื่อให้ตัดแบบเดิมซ้ำได้ เศษที่เหลือไม่ต้องคิดอะไรเพิ่ม เพราะ <code>best</code> เริ่มเป็น 0 ทุกช่องอยู่แล้ว รายได้ถึง 10<sup>11</sup> ใช้ <code>long long</code> ถ้าลองทุกจำนวนชิ้นของแต่ละแบบ แบบที่ยาว 1 เซนติเมตรแบบเดียวก็ต้องลองถึงราว 5 × 10<sup>9</sup> ครั้ง</p>'''
