source = "แนวเดียวกับโจทย์รวมกองหินที่อยู่ติดกัน (stone merging)"
hint = '''<p>เป็น DP ช่วงแบบหน้า 25.5 แต่แบ่งที่ "ครั้งสุดท้าย" แบบคูณเมทริกซ์ลูกโซ่ ให้ <code>cost[i][j]</code> คือค่าแก๊สน้อยสุดที่เชื่อมท่อนที่ i ถึง j ให้เป็นท่อนเดียว การเชื่อมครั้งสุดท้ายของช่วงนี้ต้องเชื่อมท่อนที่มาจาก i ถึง k กับท่อนที่มาจาก k + 1 ถึง j ครั้งนั้นเสียความยาวรวมของ i ถึง j เสมอ ไม่ว่า k คืออะไร หาความยาวรวมด้วย prefix sum เติมตามความยาวช่วงจากสั้นไปยาว เป็น O(N<sup>3</sup>) ระวังเชื่อมท่อนสั้นสุดก่อนเสมอแบบ greedy ไม่ถูก และค่ารวมเกิน <code>int</code> ถ้าลองทุกลำดับการเชื่อม N = 500 มีลำดับมากกว่า 10<sup>1000</sup> แบบ</p>'''
