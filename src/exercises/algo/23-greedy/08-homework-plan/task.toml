title = "จัดลำดับทำรายงาน"
level = 2
time_limit = 1
source = "แนวเดียวกับโจทย์ลดความสายมากสุด (minimize maximum lateness)"
hint = '''<p>วันสอบไม่ได้เปลี่ยนว่าควรทำชิ้นไหนก่อน ชิ้นใดจะเสร็จวันไหนขึ้นกับว่าทำงานสะสมไปแล้วกี่วันเท่านั้น และยิ่งทำสะสมมากก็ยิ่งเสร็จช้า เหตุผลการสลับสองชิ้นที่ติดกันจึงยังใช้ได้ ลำดับที่ดีที่สุดคือเรียงตามวันกำหนดส่งจากเร็วไปช้า ทำชิ้นที่สั้นที่สุดก่อนผิด ลองกับชิ้น 1 วันส่งวันที่ 100 และชิ้น 5 วันส่งวันที่ 5 เรียงตามเวลาที่เหลือ d<sub>i</sub> - t<sub>i</sub> ก็ผิด ลองกับชิ้น 1 วันส่งวันที่ 2 และชิ้น 10 วันส่งวันที่ 10 ส่วนที่ต้องคิดเพิ่มคือแปลงจำนวนวันทำงานสะสม W เป็นวันในปฏิทิน เรียงวันสอบก่อน วันที่เสร็จคือ W บวกจำนวนวันสอบที่ไม่เกินวันนั้น เพราะ W เพิ่มขึ้นเรื่อยๆ จึงใช้ตัวชี้ที่เดินไปข้างหน้าอย่างเดียวในรายการวันสอบได้ ไม่ต้องไล่ทีละวัน วันที่ทำเสร็จได้ถึงราว 2 × 10<sup>14</sup> ใช้ <code>long long</code> การลองทุกลำดับมี N! แบบ ใช้ได้แค่ N ไม่เกินราว 10</p>'''
