hint = '''<p>ถ้าบวกเวลาเดิน G เข้าไปท้ายทุกเรื่อง โจทย์จะกลายเป็นการเลือกกิจกรรมที่ไม่ซ้อนกันในหน้า 23.2 พอดี เรียงตามเวลาจบ แล้วรับเรื่องที่เริ่มไม่ก่อนเวลาจบของเรื่องล่าสุดบวก G กฎเริ่มเร็วสุดก่อนหรือสั้นสุดก่อนผิด ตัวอย่างในหน้า 23.2 ใช้ได้กับข้อนี้ด้วย วิธีไล่หาเรื่องที่จบเร็วที่สุดที่ยังดูทันทีละรอบเป็น O(N<sup>2</sup>) ไม่ทันเมื่อ N เป็นสองแสน</p>'''
