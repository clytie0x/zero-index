source = "แนวเดียวกับโจทย์หาจุดน้อยที่สุดที่แทงทุกช่วง"
hint = '''<p>ดูนักเรียนคนที่วันว่างวันสุดท้ายมาถึงเร็วที่สุด ต้องมีวันนัดสักวันในช่วงของเขา และนัดวันสุดท้ายที่เขาว่างดีที่สุด เพราะทุกคนที่ว่างวันที่เร็วกว่านั้นในช่วงของเขา ก็ยังว่างวันสุดท้ายนี้ด้วย คนที่ช่วงยังไม่จบจึงมีโอกาสถูกครอบคลุมมากที่สุด เรียงตาม b<sub>i</sub> แล้วไล่ไป คนไหนที่ a<sub>i</sub> อยู่หลังวันนัดล่าสุด ให้นัดเพิ่มที่ b<sub>i</sub> ของเขา คนที่ว่างวันแรกตรงกับวันนัดล่าสุดพอดีมาได้แล้ว ไม่ต้องนัดเพิ่ม</p>'''
