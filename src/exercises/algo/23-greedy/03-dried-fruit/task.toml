source = "แนวเดียวกับโจทย์ fractional knapsack"
hint = '''<p>ตักแบ่งได้ จึงเป็น knapsack แบบแบ่งได้ในหน้า 23.3 สิ่งที่ต้องดูคือราคาต่อกรัม ไม่ใช่ราคารวมหรือน้ำหนัก เรียงจากราคาต่อกรัมมากไปน้อยด้วยการคูณไขว้ <code>v[a] * w[b] &gt; v[b] * w[a]</code> ห้ามหารจำนวนเต็มเพราะเศษหาย ใส่ทั้งชนิดจนกว่าใส่ไม่ได้ แล้วตักชนิดถัดไปเท่าที่เหลือที่ว่าง ถ้า W มากกว่าน้ำหนักรวมของทุกชนิด ก็ใส่ได้ทั้งหมด ราคารวมถึง 10<sup>11</sup> บาท ต้องเก็บส่วนที่เป็นจำนวนเต็มด้วย <code>long long</code></p>'''
