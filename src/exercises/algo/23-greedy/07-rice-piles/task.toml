title = "รวมกองข้าวเปลือก"
level = 1
time_limit = 1
source = "แนวเดียวกับโจทย์รวมเชือกหรือรวมไฟล์ให้ต้นทุนน้อยสุด (Huffman)"
hint = '''<p>กองที่ถูกรวมก่อนจะถูกนับซ้ำในค่าน้ำมันทุกครั้งที่รวมต่อ จึงควรรวมสองกองที่เบาที่สุดที่มีอยู่ตอนนั้นทุกครั้ง กองใหม่อาจไม่ใช่กองที่เบาที่สุดในรอบถัดไป เรียงครั้งเดียวแล้วรวมเรียงแถวจึงผิด ใช้ <code>priority_queue</code> แบบน้อยสุดก่อน น้ำหนักรวมถึง 2 × 10<sup>14</sup> และค่าน้ำมันรวมมากกว่านั้นอีก ต้องใช้ <code>long long</code> ทั้งใน heap และตัวนับ วิธีไล่หาสองกองที่เบาที่สุดใหม่ทุกรอบเป็น O(N<sup>2</sup>) ไม่ทัน</p>'''
