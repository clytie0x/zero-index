title = "ร้านถ่ายรูปติดบัตร"
level = 2
time_limit = 1
hint = '''<p>ถ้ามีช่างคนเดียว คือโจทย์คิวในหน้า 23.3 ให้คนที่ใช้เวลาน้อยที่สุดก่อน เมื่อมีช่าง K คน ลองดูว่าเวลาถ่ายของแต่ละคนถูกนับซ้ำกี่ครั้ง คนที่ถ่ายกับช่างคนหนึ่ง ทำให้ทุกคนที่ต่อคิวหลังเขากับช่างคนเดียวกันต้องรอเพิ่ม ถ้าเรียงเวลาจากมากไปน้อย คน K คนแรกควรเป็นคนสุดท้ายของช่างแต่ละคน ไม่มีใครรอเพราะเขา K คนถัดไปถูกนับคนละหนึ่งครั้ง และต่อไปเรื่อยๆ คนลำดับที่ j (เริ่มนับ 0) จึงถูกนับ j / K ครั้ง ผลรวมถึงราว 10<sup>16</sup> ใช้ <code>long long</code> วิธีไล่หาคนที่ใช้เวลาน้อยสุดทีละคนเป็น O(N<sup>2</sup>) ไม่ทัน</p>'''
