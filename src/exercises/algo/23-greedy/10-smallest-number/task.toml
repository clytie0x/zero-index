source = "แนวเดียวกับโจทย์ลบ K หลักให้ได้ตัวเลขน้อยที่สุด"
hint = '''<p>ตัวเลขที่จำนวนหลักเท่ากัน ตัวที่หลักซ้ายสุดน้อยกว่าคือตัวที่น้อยกว่า จึงควรทำให้หลักซ้ายๆ เล็กที่สุดก่อน ไล่หลักจากซ้ายไปขวา เก็บหลักที่เลือกไว้ใน stack แบบหน้า 17.3 (ใช้ <code>string</code> ที่ <code>push_back</code> กับ <code>pop_back</code> ได้) ถ้าหลักใหม่น้อยกว่าหลักบนสุดของ stack และยังลบได้อีก ให้ลบหลักบนสุดทิ้ง ทำซ้ำจนลบไม่ได้แล้วค่อยใส่หลักใหม่ ไล่ครบแล้วถ้ายังลบไม่ครบ K หลัก ให้ลบจากท้าย เพราะหลักที่เหลือเรียงจากน้อยไปมากแล้ว สุดท้ายตัดเลข 0 นำหน้า ลบหลักที่มากที่สุด K หลักผิด ลองกับ 1432219 ส่วนการวนหาจุดที่หลักถัดไปน้อยกว่าแล้วลบทีละหลักเป็น O(NK) ไม่ทัน</p>'''
