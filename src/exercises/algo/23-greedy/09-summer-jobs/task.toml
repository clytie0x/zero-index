hint = '''<p>ไล่งานตามวันกำหนดจากเร็วไปช้า รับทุกงานใส่ heap แบบน้อยสุดก่อนตามหน้า 23.4 ถ้าจำนวนงานใน heap เกินวันกำหนดของงานที่เพิ่งใส่ ให้คืนงานค่าจ้างน้อยสุด d<sub>i</sub> ใหญ่ถึง 10<sup>9</sup> จึงสร้างอาเรย์ของวันไม่ได้ แต่วิธี heap ไม่ต้องใช้อาเรย์ของวันเลย (ถ้าจะใช้วิธีวันว่างวันสุดท้าย ให้สังเกตว่ามีงานไม่เกิน N งาน วันกำหนดที่เกิน N จึงเท่ากับ N) ลงวันว่างวันแรกผิด ดูหน้า 23.5 และเรียงตามวันกำหนดแล้วรับเมื่อยังมีวันว่างโดยไม่คืนงานก็ผิด ค่าจ้างรวมเกิน <code>int</code></p>'''
