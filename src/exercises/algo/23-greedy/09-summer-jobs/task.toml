hint = '''<p>มองจากวันกำหนดที่เร็วที่สุดก่อน งานที่วันกำหนดไม่เกิน d ทำได้รวมไม่เกิน C × d งาน ถ้ารับไว้เกินจำนวนนั้น ต้องทิ้งงานที่ค่าจ้างน้อยที่สุดในกลุ่มที่รับไว้ ซึ่ง heap แบบน้อยสุดก่อนหาให้ได้ทันที C × d ใหญ่ถึง 10<sup>18</sup> คูณใน <code>int</code> แล้วล้น ต้องใช้ <code>long long</code> d<sub>i</sub> ใหญ่ถึง 10<sup>9</sup> จึงสร้างอาเรย์ของวันไม่ได้ (ถ้าจะลงงานในวันที่ยังว่างวันสุดท้าย ให้สังเกตว่ามีงานไม่เกิน N งาน วันกำหนดที่เกิน N จึงเท่ากับ N) ลงวันแรกที่ว่างผิด และเรียงตามวันกำหนดแล้วรับเมื่อยังมีที่โดยไม่คืนงานก็ผิด ค่าจ้างรวมเกิน <code>int</code></p>'''
