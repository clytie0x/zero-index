title = "เรือยางสองที่นั่ง"
level = 1
time_limit = 1
source = "แนวเดียวกับโจทย์เรือชูชีพที่นั่งได้ลำละสองคน"
hint = '''<p>คนที่หนักที่สุดต้องลงเรือสักลำแน่ๆ คู่ที่ดีที่สุดของเขาคือคนที่เบาที่สุด เพราะถ้าคนเบาที่สุดยังนั่งด้วยไม่ได้ ก็ไม่มีใครนั่งด้วยได้ และถ้านั่งด้วยได้ การเอาคนเบาที่สุดไปแลกกับคู่ของเขาในคำตอบอื่นก็ไม่ทำให้ใช้เรือเพิ่ม เรียงน้ำหนัก แล้วใช้สองตัวชี้แบบหน้า 18.5 ตัวหนึ่งอยู่คนเบาสุด อีกตัวอยู่คนหนักสุด การจับคู่คนที่น้ำหนักติดกันหลังเรียงผิด ลองกับ L = 10 และน้ำหนัก 1 2 8 9</p>'''
