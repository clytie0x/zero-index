title = "เรือยางสองที่นั่ง"
level = 1
time_limit = 1
source = "แนวเดียวกับโจทย์เรือชูชีพที่นั่งได้ลำละสองคน"
hint = '''<p>คนที่หนักที่สุดต้องลงเรือสักลำแน่ๆ คู่ที่ดีที่สุดของเขาคือคนที่เบาที่สุด เพราะถ้าคนเบาที่สุดยังนั่งด้วยไม่ได้ ก็ไม่มีใครนั่งด้วยได้ และถ้านั่งด้วยได้ การเอาคนเบาที่สุดไปแลกกับคู่ของเขาในคำตอบอื่นก็ไม่ทำให้ใช้เรือเพิ่ม เรียงน้ำหนัก แล้วใช้สองตัวชี้ที่เดินเข้าหากัน ต่างจากสองตัวชี้ในหน้า 18.5 ที่เดินไปทางเดียวกัน ตัวชี้ light เริ่มที่คนเบาสุด heavy เริ่มที่คนหนักสุด ทุกรอบคน heavy ได้เรือหนึ่งลำแล้วเลื่อน heavy ไปทางซ้าย ถ้าคน light นั่งด้วยได้ก็ให้ลงลำเดียวกันแล้วเลื่อน light ไปทางขวา ทำจน light เลย heavy ระวังตอน light เท่ากับ heavy ซึ่งเหลือคนเดียว ห้ามนับเขาเป็นคู่กับตัวเอง ตัวชี้ทั้งสองเดินรวมกันไม่เกิน N ก้าว จึงเป็น O(N) หลังเรียง การจับคู่คนที่น้ำหนักติดกันหลังเรียงผิด ลองกับ L = 10 และน้ำหนัก 1 2 8 9</p>'''
