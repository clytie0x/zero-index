hint = '''<p>เมื่อเหรียญใหญ่เป็นจำนวนเท่าของเหรียญเล็กทุกชนิด เหรียญเล็กชนิดหนึ่งจะมีได้ไม่ถึงจำนวนที่รวมกันเท่าเหรียญถัดไป ไม่งั้นแลกเป็นเหรียญที่ใหญ่กว่าได้ เหตุผลแบบเดียวกับเหรียญ 1 2 5 10 ในหน้า 23.1 จึงใช้ greedy ได้ เหรียญมาไม่เรียง ต้องเรียงจากมากไปน้อยก่อน แล้วใช้การหารแทนการลบทีละเหรียญ เพราะ A ถึง 10<sup>18</sup> ถ้ามีแต่เหรียญ 1 บาท ต้องลบถึง 10<sup>18</sup> ครั้ง และคำตอบก็เกิน <code>int</code> ด้วย</p>'''
