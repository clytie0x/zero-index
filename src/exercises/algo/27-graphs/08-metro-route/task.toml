title = "เส้นทางรถไฟฟ้า"
level = 3
time_limit = 1
source = "แนวเดียวกับโจทย์หาเส้นทางสั้นสุดที่น้อยที่สุดตามพจนานุกรมบนกราฟไม่มีน้ำหนัก"
hint = '''<p>เก็บพ่อตอน BFS จาก s แบบหน้า 27.3 ได้เส้นทางสั้นสุดเส้นหนึ่ง แต่เส้นไหนขึ้นกับลำดับในรายการเพื่อนบ้าน ถ้า <code>sort</code> ทุกรายการก่อน BFS จะได้เส้นที่น้อยที่สุดตามพจนานุกรมพอดี เพราะจุดในชั้นเดียวกันออกจาก queue เรียงตามเส้นทางของพ่อ แล้วตามหมายเลขของตัวเอง อีกวิธีที่เห็นเหตุผลง่ายกว่าคือ BFS จาก <strong>t</strong> ได้ <code>to_goal[v]</code> คือระยะจาก v ถึง t แล้วเดินจาก s ทีละก้าว เลือกเพื่อนบ้านหมายเลขน้อยที่สุดที่ <code>to_goal</code> น้อยกว่าสถานีปัจจุบันหนึ่งพอดี เส้นทางทุกเส้นยาวเท่ากัน ตัวแรกที่ต่างกันจึงตัดสินผล ทั้งสองวิธีเป็น O(N + M) ไม่รวมเวลา sort ส่วนการ BFS ใหม่เพื่อตรวจทุกตัวเลือกทุกก้าวไม่ทันเมื่อเส้นทางยาวเป็นแสนช่วง</p>'''
