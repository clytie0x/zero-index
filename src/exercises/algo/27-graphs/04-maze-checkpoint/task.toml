hint = '''<p>เส้นทางที่ดีที่สุดแบ่งเป็นสองขาที่ไม่เกี่ยวกัน ขาแรกจาก <code>S</code> ไป <code>P</code> ให้สั้นที่สุด ขาที่สองจาก <code>P</code> ไป <code>E</code> ให้สั้นที่สุด เขียน BFS บนตารางแบบหน้า 27.4 เป็นฟังก์ชันที่รับจุดเริ่มกับจุดหมาย แล้วเรียกสองครั้ง ถ้าขาไหนไปไม่ถึงคำตอบคือ -1 การจำลองทีละนาทีแบบบทที่ 7 ต้องสแกนทั้งแผนที่ทุกนาที และทางงูเลื้อยในแผนที่ 1000 × 1000 ยาวได้ถึงห้าแสนก้าว</p>'''
