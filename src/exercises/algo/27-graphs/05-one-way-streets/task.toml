title = "ถนนเดินรถทางเดียว"
level = 2
time_limit = 1
hint = '''<p>ข้อแรกคือ BFS จากจุด 1 ตามทิศของถนนแบบกราฟมีทิศในหน้า 27.1 ข้อที่สองถ้าลอง BFS จากทุกจุดว่าถึงจุด 1 ไหม จะเป็น O(N(N + M)) ให้กลับคำถามแทน สร้างกราฟอีกชุดที่กลับทิศถนนทุกเส้น จุด v ขับไปถึงจุด 1 ได้ในกราฟเดิม ก็ต่อเมื่อจุด 1 ไปถึง v ได้ในกราฟที่กลับทิศ จึงใช้ BFS อีกครั้งเดียว ข้อที่สามคือจุดที่ผ่านทั้งสองรอบ</p>'''
