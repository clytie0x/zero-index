title = "สาขาที่ใกล้ที่สุด"
level = 2
time_limit = 1
hint = '''<p>ใช้ BFS หลายจุดเริ่มในหน้า 27.3 ใส่ทุกสาขาลง queue ตั้งแต่แรกด้วยระยะ 0 และเก็บ <code>owner</code> ว่าหมู่บ้านนี้เป็นของสาขาไหน ตอนเจอหมู่บ้านครั้งแรกให้รับ <code>owner</code> ของหมู่บ้านที่พามาถึง ส่วนตอนเจอหมู่บ้านที่ระยะเท่ากับ <code>dist[v] + 1</code> อยู่แล้ว แปลว่ามีอีกสาขาที่ใกล้เท่ากัน ให้เก็บ <code>owner</code> ที่น้อยกว่าไว้ วิธีนี้ถูกเพราะทุกหมู่บ้านที่ระยะ d ออกจาก queue ก่อนหมู่บ้านที่ระยะ d + 1 เสมอ การทำ BFS แยกจากทุกสาขาถูกเหมือนกัน แต่เป็น O(K(N + M)) ไม่ทันเมื่อมีสาขาเป็นหมื่น</p>'''
