source = "แนวเดียวกับปริศนา 8-puzzle ที่ใช้ฝึก BFS บนสถานะ"
hint = '''<p>สถานะคือสตริงยาว 9 ตัว มีได้ไม่เกิน 9! = 362880 แบบ จำระยะด้วย <code>map&lt;string, int&gt;</code> แบบหน้า 27.5 การเลื่อนย้อนกลับได้เสมอ จำนวนครั้งจากกระดานใดไปเป้าหมายจึงเท่ากับจากเป้าหมายมากระดานนั้น ให้ BFS <strong>ครั้งเดียวจากเป้าหมาย</strong> ตั้งแต่ก่อนอ่านคำถาม แล้วแต่ละคำถามแค่ค้นใน map กระดานที่ไม่อยู่ใน map คือไปไม่ถึง ถ้า BFS ใหม่จากทุกกระดาน กระดานที่ไปไม่ถึงต้องเดินครบเกือบสองแสนสถานะก่อนจะรู้ว่าไม่ถึง</p>'''
