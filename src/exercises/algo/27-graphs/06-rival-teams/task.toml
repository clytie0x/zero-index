hint = '''<p>นี่คือการตรวจกราฟสองฝั่งในหน้า 27.3 ระบายสีทีละกลุ่มที่เชื่อมกันด้วย BFS ถ้าเจอคู่ที่ได้สีเดียวกัน ตอบ -1 ทันที ในกลุ่มหนึ่ง พอเลือกสีของคนแรกแล้ว สีของทุกคนในกลุ่มถูกบังคับหมด จึงเหลือแค่สองแบบ คือฝั่งที่ระบายเป็น 0 เป็นสีแดง หรือฝั่งที่ระบายเป็น 1 เป็นสีแดง แต่ละกลุ่มเลือกได้อิสระ ให้เลือกฝั่งที่คนน้อยกว่าเป็นสีแดง แล้วบวกทุกกลุ่มเข้าด้วยกัน คนที่ไม่มีคู่แข่งเลยอยู่สีน้ำเงินได้เสมอ</p>'''
