hint = '''<p>ถ้าไม่มีนักกีฬาตัวแทน นี่คือการตรวจกราฟสองฝั่งในหน้า 27.3 แล้วคิดเพิ่มว่าในแต่ละกลุ่มที่เชื่อมกัน สีถูกบังคับไปมากแค่ไหน และเหลืออะไรให้เลือก จากนั้นดูว่านักกีฬาตัวแทนหนึ่งคนตัดทางเลือกของกลุ่มเขาไปอย่างไร ระวังกลุ่มที่มีนักกีฬาตัวแทนหลายคน</p>'''
