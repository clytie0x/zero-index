source = "แนวเดียวกับโจทย์หาจำนวนกำแพงที่ต้องทุบน้อยที่สุดด้วย 0-1 BFS"
hint = '''<p>ก้าวเข้าช่อง <code>.</code> หรือ <code>E</code> มีต้นทุน 0 ก้าวเข้าช่อง <code>T</code> มีต้นทุน 1 นี่คือ 0-1 BFS ในหน้า 27.5 บนตาราง ใช้ <code>deque</code> ก้าวต้นทุน 0 ใส่ด้านหน้า ก้าวต้นทุน 1 ใส่ด้านหลัง และอัปเดตเมื่อได้ค่าที่น้อยกว่าเดิมเท่านั้น BFS ธรรมดาที่จองช่องตั้งแต่เจอครั้งแรกให้คำตอบผิด เพราะช่องที่เจอก่อนอาจเจอผ่านต้นไม้ ส่วนการไล่ทีละจำนวนต้นแล้วสแกนทั้งแผนที่ทุกรอบช้าเกินไปเมื่อต้องตัดเป็นแสนต้น</p>'''
