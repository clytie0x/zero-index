source = "แนวเดียวกับโจทย์นับเกาะด้วย flood fill"
hint = '''<p>เริ่มจากการนับเกาะแบบหน้า 27.4 แล้วคิดว่าระหว่างเดินทั่วเกาะ จะรู้ได้อย่างไรว่าเกาะนั้นแตะขอบแผนที่ ระวังว่าช่องแรกที่เจอของเกาะอาจอยู่กลางแผนที่ ขณะที่ช่องอื่นของเกาะเดียวกันไปแตะแถวล่างสุดหรือคอลัมน์ขวาสุด และเกาะหนึ่งใหญ่ได้หลายแสนช่อง</p>'''
