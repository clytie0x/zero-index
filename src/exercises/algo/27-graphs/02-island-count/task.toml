source = "แนวเดียวกับโจทย์นับเกาะด้วย flood fill"
hint = '''<p>ไล่ทุกช่อง เจอแผ่นดินที่ยังไม่เคยไปเมื่อไร นับเกาะเพิ่มหนึ่ง แล้วเดินให้ทั่วทั้งเกาะด้วย BFS หรือ stack ของเราเอง จดทุกช่องที่ไปถึงไว้ จะได้ไม่นับซ้ำ และนับช่องไปพร้อมกัน แบบหน้า 27.4 ระวังเกาะรูปงูเลื้อยหรือแผ่นดินทั้งแผ่น ซึ่งทำให้ recursion ลึกเป็นแสนชั้นและพังเพราะ stack เต็ม</p>'''
