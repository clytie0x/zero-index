hint = '''<p>ส่วนแรกคือการหาส่วนเชื่อมต่อและตรวจวงจรแบบหน้า 27.2 ส่วนที่สองต้องคิดเพิ่ม เขตที่มีวงจรไม่ได้เป็นวงแหวนทุกเขต ลองวาดเขตที่มีวงจรพอดีหนึ่งวงแต่ยังไม่เป็นวงแหวน แล้วดูว่าหมู่บ้านในวงแหวนต่างจากหมู่บ้านในเขตนั้นตรงไหน เขตหนึ่งอาจยาวเป็นเส้นตรงหรือวงแหวนสองแสนหมู่บ้าน</p>'''
