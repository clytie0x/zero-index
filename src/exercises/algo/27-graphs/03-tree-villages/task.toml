hint = '''<p>เดินให้ทั่วแต่ละเขตแบบหาส่วนเชื่อมต่อในหน้า 27.2 แล้วนับว่าเขตนั้นมีกี่หมู่บ้าน กับผลรวมของจำนวนถนนที่ออกจากทุกหมู่บ้านในเขต ผลรวมนี้นับถนนทุกเส้นสองครั้ง หารสองได้จำนวนถนนในเขต เขต V หมู่บ้านที่ไม่มีวงมีถนนพอดี V - 1 เส้น ถ้ามากกว่านั้นมีวงแน่นอน ถนนเป็นเส้นตรงหรือวงใหญ่สองแสนหมู่บ้านทำให้ DFS แบบ recursion พัง ให้ใช้ stack ของเราเองหรือ BFS</p>'''
