title = "สมุดเยี่ยมงานเลี้ยงรุ่น"
level = 1
hint = '''<p>ใส่ทุกชื่อลงใน <code>set&lt;string&gt;</code> ชื่อที่ซ้ำจะถูกตัดทิ้งเอง และเวลาวนพิมพ์จะได้ชื่อเรียงตามตัวอักษรอยู่แล้ว ไม่ต้อง <code>sort</code> เพิ่ม จำนวนคนคือ <code>size()</code> ของ set ระวังว่า <code>ann</code> ต้องมาก่อน <code>anna</code> ซึ่ง set เรียงให้ถูกเองเหมือนเรียงคำในพจนานุกรม</p>'''
