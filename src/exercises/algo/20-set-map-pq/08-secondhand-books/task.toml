title = "ตลาดหนังสือมือสอง"
level = 3
source = "แนวเดียวกับโจทย์ขายตั๋วคอนเสิร์ตที่ใช้ฝึก multiset กับ upper_bound"
hint = '''<p>ราคาซ้ำกันได้ จึงใช้ <code>multiset&lt;int&gt;</code> หนังสือที่แพงที่สุดที่ไม่เกินงบ b คือตัวที่อยู่ก่อน <code>upper_bound(b)</code> หนึ่งตำแหน่ง ถ้า <code>upper_bound(b)</code> เป็น <code>begin()</code> แปลว่าทุกเล่มแพงเกินงบ ขายแล้วต้องลบออกแค่<strong>เล่มเดียว</strong>ด้วย <code>erase(it)</code> ถ้าเขียน <code>erase(ราคา)</code> หนังสือทุกเล่มที่ราคาเท่ากันจะหายไปด้วย ซึ่งเป็นกับดักในหน้า 20.2</p>'''
