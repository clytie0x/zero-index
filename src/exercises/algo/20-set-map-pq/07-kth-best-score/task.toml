title = "คะแนนอันดับที่ K"
level = 2
hint = '''<p>ไม่ต้องเก็บทุกคะแนนให้เรียง เก็บแค่ K คะแนนที่ดีที่สุดในตอนนั้นก็พอ ใส่ไว้ใน <code>priority_queue</code> แบบน้อยสุดก่อนด้วย <code>greater&lt;int&gt;</code> ตัวบนสุดจึงเป็นคะแนนที่แย่ที่สุดใน K ตัวนั้น ซึ่งก็คืออันดับที่ K พอดี คะแนนใหม่เข้ามาให้ <code>push</code> แล้วถ้าเกิน K ตัวก็ <code>pop</code> ตัวน้อยสุดทิ้ง ทุกครั้งใช้เวลา O(log K) ส่วนการแทรกคะแนนใหม่ลงในอาเรย์ที่เรียงไว้ต้องเลื่อนของทั้งแถว ไม่ทันเมื่อ N เป็นสามแสน</p>'''
