hint = '''<p>เก็บ<strong>ที่นั่งที่ยังว่าง</strong>ไว้ใน <code>set&lt;int&gt;</code> ตั้งแต่ 1 ถึง N ตอนเริ่ม คนที่ขอที่นั่ง x ได้ที่นั่งแรกที่ว่างและ ≥ x ซึ่งก็คือ <code>s.lower_bound(x)</code> พอดี ได้ที่นั่งแล้ว <code>erase</code> ออกจาก set พอมีคนลุกก็ <code>insert</code> กลับเข้าไป ถ้าใช้อาเรย์แล้วไล่หาทีละที่จาก x ไปข้างหน้า กรณีที่ทุกคนขอที่นั่ง 1 จะต้องไล่ยาวขึ้นเรื่อยๆ จนไม่ทัน</p>'''
