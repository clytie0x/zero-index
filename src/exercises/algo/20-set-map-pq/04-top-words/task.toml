hint = '''<p>นับด้วย <code>map&lt;string, int&gt;</code> แบบหน้า 20.3 แล้วย้ายทุกคู่ไปใส่ <code>vector</code> เพื่อเรียงใหม่ตามจำนวนครั้ง เคล็ดลับคือเก็บเป็น <code>pair&lt;int, string&gt;</code> โดยใส่จำนวนครั้งเป็นค่าติดลบ <code>sort</code> แบบปกติเรียงจากน้อยไปมาก จำนวนครั้งที่มากที่สุดจึงขึ้นก่อน และถ้าจำนวนเท่ากัน <code>pair</code> จะเทียบคำต่อให้เองตามตัวอักษร อย่าลืมกรณีที่มีคำต่างกันน้อยกว่า M คำ</p>'''
