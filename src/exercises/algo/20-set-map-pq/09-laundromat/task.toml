title = "ร้านสะดวกซัก"
level = 3
hint = '''<p>ใช้ <code>priority_queue</code> สองตัว ตัวแรกเก็บเครื่องที่กำลังซักเป็นคู่ (เวลาเสร็จ, หมายเลข) แบบน้อยสุดก่อน ตัวที่สองเก็บหมายเลขเครื่องที่ว่างแบบน้อยสุดก่อน ทุกครั้งที่มีลูกค้า ให้ย้ายเครื่องที่เสร็จแล้วจากตัวแรกไปตัวที่สอง ถ้าไม่มีเครื่องว่างเลย ต้องรอถึงเวลาเสร็จที่เร็วที่สุด แล้วย้ายทุกเครื่องที่เสร็จเวลานั้นพร้อมกัน ข้อควรระวังคือถ้าลูกค้าคนก่อนต้องรอ คนถัดไปจะเริ่มก่อนเวลานั้นไม่ได้ ให้จำเวลาเริ่มล่าสุดไว้ด้วย ใช้ heap ตัวเดียวที่เรียงตามเวลาเสร็จไม่พอ เพราะเครื่องที่ว่างอยู่ก่อนแล้วต้องเลือกตามหมายเลข ไม่ใช่ตามเวลาที่ว่าง เวลาเสร็จอาจเกิน <code>int</code></p>'''
