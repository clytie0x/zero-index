title = "ช่วงกำไรพอดีเป้าที่ยาวที่สุด"
level = 3
hint = '''<p>ใช้ผลรวมสะสมจากหน้า 19.5 ให้ P[0] = 0 และ P[i] คือกำไรรวมวันที่ 1 ถึง i ช่วงวันที่ l ถึง r มีกำไรรวม P[r] - P[l - 1] ช่วงที่จบวันที่ r จะยาวที่สุดเมื่อ l - 1 น้อยที่สุดที่ P[l - 1] = P[r] - K ไล่ r จากซ้ายไปขวา แล้วถาม map ว่าค่า P[r] - K เจอครั้งแรกที่วันไหน ใช้ <code>map&lt;long long, int&gt;</code> จำ<strong>วันแรก</strong>ที่ผลรวมสะสมแต่ละค่าปรากฏ ถ้าค่านั้นมีอยู่แล้วห้ามเขียนทับ เพราะวันหลังทำให้ช่วงสั้นลง ถามด้วย <code>find</code> หรือ <code>count</code> ตามหน้า 20.3 อย่าลืมใส่ P[0] = 0 คู่กับวันที่ 0 ไว้ก่อนเริ่ม ไม่งั้นช่วงที่เริ่มวันแรกจะหายไป ผลรวมสะสมถึง 2 × 10<sup>14</sup> และ K ก็เกิน <code>int</code> ลองทุกช่วงต้องดูราว 2 × 10<sup>10</sup> ช่วงเมื่อ N เป็นสองแสน ไม่ทัน</p>'''
