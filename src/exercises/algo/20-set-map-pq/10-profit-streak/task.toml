title = "ช่วงที่กำไรรวมพอดีเป้า"
level = 3
hint = '''<p>ใช้ผลรวมสะสมจากบทที่ 19 ให้ P[0] = 0 และ P[i] คือกำไรรวมวันที่ 1 ถึง i ช่วงวันที่ l ถึง r มีกำไรรวม P[r] - P[l - 1] โจทย์จึงถามว่ามีกี่คู่ที่ P[r] - P[l - 1] = K หรือ P[l - 1] = P[r] - K ไล่ r จากซ้ายไปขวา แล้วนับว่าก่อนหน้านี้มีผลรวมสะสมที่เท่ากับ P[r] - K กี่ตัว ใช้ <code>map&lt;long long, int&gt;</code> จำจำนวนของแต่ละค่า อย่าลืมใส่ P[0] = 0 ไว้ก่อนเริ่ม ผลรวมสะสมเกิน <code>int</code> และคำตอบอาจถึงราว 2 × 10<sup>10</sup> เมื่อทุกวันกำไรเป็นศูนย์และ K = 0</p>'''
