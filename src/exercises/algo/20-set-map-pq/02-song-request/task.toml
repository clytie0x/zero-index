hint = '''<p>รหัสเพลงถึง 10<sup>9</sup> อาเรย์นับแบบบทที่ 5 ต้องมีพันล้านช่อง ประกาศไม่ได้ ใช้ <code>map&lt;int, int&gt;</code> นับแทน แล้ววนหาเพลงที่นับได้มากที่สุด map วนจากรหัสน้อยไปมาก ถ้าเปลี่ยนคำตอบเฉพาะตอนที่นับได้ <strong>มากกว่า</strong> ของเดิม เพลงที่เสมอกันจะได้รหัสที่น้อยกว่าเอง ส่วนวิธีเก็บรหัสใน <code>vector</code> แล้วไล่หาทุกครั้งที่มีคนขอ ช้าเกินไปเมื่อมีรหัสต่างกันเป็นแสน</p>'''
