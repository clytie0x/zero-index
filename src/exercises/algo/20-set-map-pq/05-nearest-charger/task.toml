title = "หัวชาร์จที่ใกล้ที่สุด"
level = 2
hint = '''<p>การหาหัวที่ใกล้ที่สุดเหมือนโปรแกรม charger ในหน้า 20.2 ทุกอย่าง คือตัวแรกที่ ≥ x จาก <code>lower_bound(x)</code> กับตัวที่อยู่ก่อนหน้ามันจาก <code>prev</code> ส่วนที่เพิ่มมาคือจุดเดียวกันมีได้หลายหัว ถ้าเก็บใน <code>set</code> หัวที่ซ้ำจุดจะเหลือแค่ตัวเดียว ปิดหัวแรกแล้วจุดนั้นหายไปทั้งที่ยังมีหัวอื่นเปิดอยู่ ให้ใช้ <code>multiset&lt;int&gt;</code> และปิดทีละหัวด้วย <code>erase(find(x))</code> ตามหน้า 20.2 ห้ามใช้ <code>erase(x)</code> เพราะลบทุกหัวที่จุดนั้นทีเดียว การไล่ดูทุกหัวทุกคำถามไม่ทันเมื่อมีหัวชาร์จเป็นแสน</p>'''
