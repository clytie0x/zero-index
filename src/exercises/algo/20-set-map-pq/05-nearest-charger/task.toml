title = "สถานีชาร์จที่ใกล้ที่สุด"
level = 2
hint = '''<p>เก็บตำแหน่งสถานีที่เปิดอยู่ใน <code>set&lt;int&gt;</code> สถานีที่ใกล้ที่สุดมีแค่สองตัวที่เป็นไปได้ คือตัวแรกที่ ≥ x ซึ่งได้จาก <code>s.lower_bound(x)</code> กับตัวที่อยู่ก่อนหน้ามัน ซึ่งได้จาก <code>prev</code> ต้องเช็กว่าตัวแรกไม่ใช่ <code>end()</code> และต้องเช็กว่าไม่ใช่ <code>begin()</code> ก่อนเรียก <code>prev</code> แบบหน้า 20.2 สถานีที่ปิดแล้วลบด้วย <code>erase</code> การไล่ดูทุกสถานีทุกคำถามไม่ทันเมื่อมีสถานีเป็นแสน</p>'''
