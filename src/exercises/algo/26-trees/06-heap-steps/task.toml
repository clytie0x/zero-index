hint = '''<p>เขียน heap เองแบบหน้า 26.5 ใช้อาเรย์เริ่มที่ช่อง 1 สร้างด้วย sift down จากช่อง N / 2 ลงมาถึงช่อง 1 อย่าใส่ทีละตัว เพราะได้อาเรย์คนละแบบ ตอนจมลงให้เลือกลูกขวาเฉพาะเมื่อมากกว่าลูกซ้ายอย่างเคร่งครัด และสลับเฉพาะเมื่อพ่อน้อยกว่าลูกอย่างเคร่งครัด ใช้ priority_queue ไม่ได้ เพราะต้องพิมพ์อาเรย์ข้างใน ทดสอบกับค่าที่ซ้ำกันเยอะๆ ด้วย</p>'''
