title = "ความลึกตอนใส่ลงต้นไม้ค้นหา"
level = 3
time_limit = 1
source = "แนวคิดเดียวกับโจทย์ BST ของ COCI ที่หาความลึกจากตัวก่อนหน้าและตัวถัดไป"
hint = '''<p>จำลอง BST ตรงๆ ใช้ก้าวเท่าความลึก ถ้าคีย์มาเรียงกันจะเป็น O(N<sup>2</sup>) ตามหน้า 26.4 ไม่ทัน ให้สังเกตว่าตอนใส่ x โหนดใหม่จะไปแขวนอยู่ใต้ตัวก่อนหน้าหรือตัวถัดไปของ x ในบรรดาคีย์ที่ใส่ไปแล้ว คือคีย์ที่มากที่สุดที่น้อยกว่า x กับคีย์ที่น้อยที่สุดที่มากกว่า x ถ้ามีทั้งสองตัว ตัวหนึ่งต้องเป็นบรรพบุรุษของอีกตัว และ x ไปแขวนใต้ตัวที่ลึกกว่า ความลึกของ x จึงเป็นความลึกที่มากกว่าของสองตัวนั้นบวกหนึ่ง หาสองตัวนี้ด้วย <code>lower_bound</code> ของ set ตามหน้า 20.2 แล้วเก็บความลึกของแต่ละคีย์ไว้ใน map</p>'''
