hint = '''<p>สร้างรายชื่อลูกจากพ่อของแต่ละคนแบบหน้า 26.1 แล้วท่องทีละชั้นด้วย queue แบบหน้า 26.2 ได้ความลึกของทุกคนใน O(N) แล้วนับว่าแต่ละความลึกมีกี่คน การเดินขึ้นหาต้นตระกูลจากทุกคนเป็น O(N<sup>2</sup>) เมื่อแผนผังเป็นสายตรงยาว และ recursion ที่ลึกเท่าความสูงจะพังกับสายตรงสองแสนรุ่นตามหน้า 26.3</p>'''
