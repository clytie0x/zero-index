title = "เส้นทางเดินป่าที่ไกลที่สุด"
level = 3
time_limit = 1
source = "แนวเดียวกับโจทย์หาเส้นผ่านศูนย์กลางของต้นไม้ที่มีน้ำหนักบนเส้นเชื่อม"
hint = '''<p>ทำแบบเส้นผ่านศูนย์กลางในหน้า 26.2 แต่นับระยะทางแทนจำนวนเส้น ให้ <code>down[v]</code> คือระยะทางลงจาก v ไปจุดที่ไกลที่สุดในต้นไม้ย่อยของ v ทางที่มี v เป็นจุดสูงสุดยาวเท่ากับผลรวมของ "ระยะลงผ่านลูก c" สองค่าที่มากที่สุด เมื่อระยะลงผ่านลูก c คือ <code>down[c]</code> บวกความยาวทางจาก c ถึง v ต้องรู้ค่าของลูกก่อนพ่อ ให้ใช้ลำดับที่พ่อมาก่อนลูกแล้วเดินย้อนตามหน้า 26.3 เพราะทางเดินอาจต่อกันเป็นเส้นยาวสองแสนจุด ระยะทางรวมถึง 2 × 10<sup>14</sup> ต้องใช้ <code>long long</code> การหาระยะจากทุกจุดไปทุกจุดเป็น O(N<sup>2</sup>) ไม่ทัน</p>'''
