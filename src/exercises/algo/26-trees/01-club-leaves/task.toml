title = "สมาชิกที่ไม่มีลูกทีม"
level = 1
hint = '''<p>อ่านพ่อของทุกคนเก็บไว้ในอาเรย์ คนที่ไม่มีใครมีเขาเป็นพ่อคือใบ นับได้ด้วยอาเรย์ที่นับว่าแต่ละคนเป็นพ่อของกี่คน ความลึกของแต่ละคนหาได้ด้วยการเดินขึ้นหาประธานแบบหน้า 26.1 N ไม่เกินพัน จึงเดินขึ้นจากทุกคนได้สบาย ระวังกรณีชมรมมีคนเดียว ประธานเป็นใบด้วย และความสูงเป็น 0</p>'''
