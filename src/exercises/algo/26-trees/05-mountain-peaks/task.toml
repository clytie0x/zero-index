title = "จุดชมวิวที่สูงกว่าทุกจุดก่อนหน้า"
level = 2
time_limit = 1
hint = '''<p>จุดหนึ่งดีเด่นเมื่อสูงกว่าจุดที่สูงที่สุดบนทางจากทางเข้ามาถึงจุดก่อนหน้า ให้เก็บ <code>best[v]</code> คือความสูงมากสุดบนทางจากทางเข้ามาถึง v รวม v ด้วย แล้ว <code>best[v]</code> คือค่ามากกว่าระหว่าง <code>best[พ่อของ v]</code> กับความสูงของ v ต้องรู้ค่าของพ่อก่อนลูก จึงเดินตามลำดับที่พ่อมาก่อนลูก จะใช้ queue แบบหน้า 26.2 หรือ stack แบบหน้า 26.3 ก็ได้ การเดินย้อนขึ้นไปเทียบกับทุกจุดก่อนหน้าเป็น O(N<sup>2</sup>) เมื่อทางเดินยาวเป็นเส้นเดียว</p>'''
