source = "แนวเดียวกับโจทย์ Anniversary Party ที่เลือกเซตอิสระที่มีน้ำหนักมากสุดบนต้นไม้"
hint = '''<p>คิดแบบ dynamic programming ทีละต้นไม้ย่อย ให้ <code>take[v]</code> คือความสนุกมากที่สุดของต้นไม้ย่อย v เมื่อเชิญ v และ <code>skip[v]</code> คือเมื่อไม่เชิญ v ถ้าเชิญ v ห้ามเชิญลูกทีมโดยตรงทุกคน <code>take[v]</code> จึงเป็นความสนุกของ v บวก <code>skip[c]</code> ของลูกทุกตัว ถ้าไม่เชิญ v ลูกแต่ละตัวเลือกได้อิสระ <code>skip[v]</code> จึงเป็นผลรวมของค่าที่มากกว่าระหว่าง <code>take[c]</code> กับ <code>skip[c]</code> ต้องรู้ค่าของลูกก่อนพ่อ ใช้ลำดับที่พ่อมาก่อนลูกแล้วเดินย้อนตามหน้า 26.3 คำตอบคือค่าที่มากกว่าของสองค่าที่ราก ลองทุกแบบของการเชิญมี 2<sup>N</sup> แบบ ใช้ได้แค่ N ราวยี่สิบ</p>'''
