title = "รหัสหนังสือในต้นไม้ค้นหา"
level = 2
hint = '''<p>เขียน BST ด้วย node กับ pointer ตามหน้า 26.4 ใส่ด้วยลูปเดินลง ลบด้วยฟังก์ชันที่คืนรากใหม่ของต้นไม้ย่อย กรณีมีลูกสองตัวให้ลอกคีย์ที่น้อยที่สุดในต้นไม้ย่อยขวามาแล้วลบตัวเดิมทิ้ง หาความลึกด้วยการเดินลงจากรากแล้วนับก้าว ใช้ set ไม่ได้ เพราะความลึกขึ้นกับรูปร่างของต้นไม้ คำสั่งมีไม่เกินห้าพัน ต้นไม้เอียงสุดก็ลึกไม่เกินห้าพันชั้น ทำตรงๆ ทันแน่นอน ทดสอบการลบรากที่มีลูกสองตัวด้วย</p>'''
