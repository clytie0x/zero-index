hint = '''<p>ยอดของทีม v คือยอดของ v บวกยอดของทีมลูกทีมทุกคน ต้องรู้คำตอบของลูกก่อนพ่อ ใช้วิธีในหน้า 26.3 เก็บลำดับที่หัวหน้ามาก่อนลูกทีมด้วย stack แล้วเดินย้อนจากท้าย บวกยอดของ v ขึ้นไปที่หัวหน้าของ v ยอดรวมถึง 2 × 10<sup>14</sup> ต้องใช้ <code>long long</code> ถ้าบวกยอดของแต่ละคนขึ้นไปทุกชั้นจนถึงผู้จัดการ จะเป็น O(N<sup>2</sup>) เมื่อสายบังคับบัญชายาว และ recursion ที่ลึกเท่าสายบังคับบัญชาจะพัง</p>'''
