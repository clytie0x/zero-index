title = "ราคาทองร่วงหนัก"
level = 2
time_limit = 1
source = "แนวเดียวกับโจทย์นับคู่สลับแบบมีเงื่อนไข a[i] > 2a[j]"
hint = '''<p>ถ้า D = 0 ข้อนี้คือนับคู่สลับในหน้า 22.3 ทุกคู่แบ่งเป็นคู่ในครึ่งซ้าย คู่ในครึ่งขวา และคู่ข้ามครึ่ง เหมือนเดิม ต่างกันตรงที่ต้องนับคู่ข้ามครึ่ง <strong>ก่อน</strong> รวม เพราะเงื่อนไขไม่ใช่การเทียบที่ใช้ตอนรวม ทั้งสองครึ่งเรียงแล้ว ไล่ j ในครึ่งขวาจากน้อยไปมาก แล้วเลื่อนตัวชี้ i ในครึ่งซ้ายข้ามทุกตัวที่ไม่เกิน a<sub>j</sub> + D ตัวที่เหลือในครึ่งซ้ายคือตัวที่มากกว่า a<sub>j</sub> + D ทั้งหมด ตัวชี้ i เดินไปทางเดียว ชั้นละ O(N) จากนั้นค่อยรวมสองครึ่งตามปกติ จำนวนคู่ถึงราว 2 × 10<sup>10</sup></p>'''
