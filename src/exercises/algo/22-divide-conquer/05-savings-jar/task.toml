title = "กระปุกออมสินทวีคูณ"
level = 2
time_limit = 1
hint = '''<p>ให้ S(n) คือผลรวม n วันแรก ถ้า n เป็นคู่ ครึ่งหลังคือครึ่งแรกที่คูณด้วย a<sup>n/2</sup> ทุกพจน์ จึงได้ S(n) = S(n/2) × (1 + a<sup>n/2</sup>) ถ้า n เป็นคี่ S(n) = S(n - 1) + a<sup>n-1</sup> เป็นการแบ่งครึ่งแบบยกกำลังเร็วในหน้า 12.1 ให้ฟังก์ชันคืนทั้ง S(n) และ a<sup>n</sup> เป็น pair จะได้ไม่ต้องยกกำลังแยก เรียกตัวเองไม่เกินราว 120 ครั้ง สูตรอนุกรมเรขาคณิตที่หารด้วย a - 1 ใช้ไม่ได้ เพราะ m ไม่ใช่จำนวนเฉพาะ และ a - 1 อาจเป็น 0 ทุกครั้งที่คูณให้ mod ก่อน ค่าไม่เกิน 10<sup>9</sup> คูณกันจึงไม่เกิน 10<sup>18</sup> พอดีกับ <code>long long</code></p>'''
