source = "แนวเดียวกับโจทย์นับ subarray ที่ผลรวมอยู่ในช่วงที่กำหนด"
hint = '''<p>สร้าง prefix ตามหน้า 19.5 ช่วง l ถึง r ใช้ได้เมื่อ L ≤ prefix[r] - prefix[l - 1] ≤ R จึงต้องนับคู่ i &lt; j ใน <code>prefix[0..N]</code> ที่ prefix[j] - R ≤ prefix[i] ≤ prefix[j] - L เป็นช่วงของค่า ไม่ใช่ค่าเดียว วิธีเรียงแล้วค้นในหน้า 19.5 ใช้ตรงๆ ไม่ได้ ทำ merge sort บนอาเรย์ prefix ทั้งหมด N + 1 ช่อง ก่อนรวมสองครึ่ง ไล่ j ในครึ่งขวาจากน้อยไปมาก ใช้สองตัวชี้ในครึ่งซ้ายชี้ขอบล่างกับขอบบนของค่าที่นับได้ ทั้งสองตัวเดินไปทางเดียวเหมือนข้อราคาทอง ระวัง prefix เป็น <code>long long</code> อย่าลืม prefix[0] และคำตอบถึงราว 2 × 10<sup>10</sup></p>'''
