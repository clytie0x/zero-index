title = "ซื้อของ K ชิ้นที่ถูกที่สุด"
level = 1
time_limit = 1
hint = '''<p>ถ้าหาชิ้นที่ถูกที่สุดทีละรอบแบบ selection sort ในหน้า 13.2 ต้องไล่ทั้งร้าน K รอบ เป็น O(NK) ซึ่งถึงราว 10<sup>11</sup> เมื่อ K เป็นครึ่งหนึ่งของห้าแสน ใช้ <code>nth_element</code> ในหน้า 22.4 ให้ชิ้นที่ถูกเป็นอันดับ K ไปอยู่ช่อง K - 1 แล้ว K ช่องแรกจะเป็น K ชิ้นที่ถูกที่สุดพอดี แม้ข้างในยังไม่เรียง บวกได้เลย เป็น O(N) เฉลี่ย หรือจะ <code>sort</code> ทั้งร้านก่อนแบบ O(N log N) ก็ทันเหมือนกัน ราคารวมเกิน <code>int</code> ได้</p>'''
