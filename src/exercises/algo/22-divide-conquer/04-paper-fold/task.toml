hint = '''<p>ลายของการพับ k ครั้งยาว 2<sup>k</sup> - 1 ตัว รอยตรงกลางอยู่ที่ตำแหน่ง m = 2<sup>k-1</sup> ถ้า p = m ตอบ V ถ้า p &lt; m รอยนั้นอยู่ในลายของการพับ k - 1 ครั้งที่ตำแหน่ง p เดิม ถ้า p &gt; m รอยนั้นมาจากลายของการพับ k - 1 ครั้งที่กลับลำดับแล้ว ตำแหน่งในลายเดิมคือ 2<sup>k</sup> - p แล้วสลับ V กับ M ทุกกรณีเหลือปัญหาเดียวที่เล็กลง เป็น decrease and conquer แบบ binary search ในหน้า 22.1 ตอบหนึ่งคำถามไม่เกิน k ขั้น ใช้ <code>1LL &lt;&lt; k</code> เพราะ 2<sup>60</sup> เกิน <code>int</code></p>'''
