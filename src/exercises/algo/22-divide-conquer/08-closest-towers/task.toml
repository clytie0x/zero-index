hint = '''<p>ทำตามหน้า 22.5 เรียงตาม x แบ่งครึ่ง หาคำตอบของแต่ละครึ่งได้ d แล้วดูเฉพาะเสาในแถบที่ห่างจากเส้นแบ่งตามแนว x น้อยกว่า √d เรียงแถบตาม y แล้วเทียบแต่ละต้นกับต้นถัดไปเฉพาะเมื่อผลต่างของ y ยกกำลังสองยังน้อยกว่า d ข้อนี้พิกัดติดลบได้ ผลต่างของพิกัดถึง 2 × 10<sup>9</sup> เกิน <code>int</code> ตั้งแต่ตอนลบ ต้องเก็บพิกัดเป็น <code>long long</code> ก่อนลบ ระยะกำลังสองถึง 8 × 10<sup>18</sup> ยังพอดีกับ <code>long long</code> ลองทุกคู่ต้องคำนวณราว 2 × 10<sup>10</sup> คู่</p>'''
