hint = '''<p>นี่คือขั้นรวมของ merge sort ในหน้า 22.2 ใช้ตัวชี้สองตัว ตัวละห้อง เทียบคะแนนที่ตัวชี้ทั้งสองชี้อยู่ หยิบตัวที่น้อยกว่าใส่ผลลัพธ์แล้วเลื่อนตัวชี้นั้น พอห้องใดหมด อย่าลืมเทคะแนนที่เหลือของอีกห้องต่อท้ายให้ครบ ทั้งหมดเป็น O(N + M) ลองกับห้องที่คะแนนทุกคนมากกว่าทุกคนในอีกห้องด้วย</p>'''
