title = "วันที่แต่ละเมืองถึงศาลากลาง"
level = 2
time_limit = 1
source = "แนวเดียวกับโจทย์หาเส้นทางที่เส้นหนักที่สุดเบาที่สุด จากจุดหนึ่งไปทุกจุด ซึ่งใช้ฝึกเดินบน minimum spanning tree"
hint = '''<p>เมือง v ถึงเมือง 1 ในวัน d ได้เมื่อมีทางที่ทุกถนนเปิดภายในวัน d คำตอบของ v จึงเป็นค่าที่น้อยที่สุดของวันเปิดที่ช้าที่สุดบนทาง ถ้าเปิดถนนตามลำดับวันแล้วรวมกลุ่มแบบ Kruskal ถนนที่รวมกลุ่มได้จริงต่อกันเป็นต้นไม้ และทางจาก v ไป 1 บนต้นไม้นี้คือทางที่ดีที่สุดพอดี เหตุผลเดียวกับเรื่องรถบรรทุกที่หนักที่สุด แค่กลับทิศของการเรียง เก็บต้นไม้นี้เป็น adjacency list แล้ว BFS จากเมือง 1 ครั้งเดียว ค่าของเมืองลูกคือค่าที่มากกว่าระหว่างค่าของเมืองพ่อกับวันเปิดของถนนที่เชื่อม ระวังต้นไม้ที่เป็นสายยาวแสนเมือง DFS แบบ recursion จะพังด้วย stack overflow ถ้า BFS จากเมือง 1 ใหม่ทุกวันที่มีถนนเปิด จะช้าเกินเมื่อมีถนนสองแสนเส้น</p>'''
