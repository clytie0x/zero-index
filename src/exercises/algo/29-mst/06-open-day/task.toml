source = "แนวเดียวกับโจทย์หาเวลาแรกที่กราฟต่อถึงกัน ซึ่งใช้ฝึกเรียงเส้นตามเวลาแล้วรวมด้วย union-find"
hint = '''<p>เรียงถนนตามวันเปิด แล้วรวมกลุ่มทีละเส้นแบบหน้า 29.5 จนเหลือกลุ่มเดียว วันของเส้นที่ทำให้เหลือกลุ่มเดียวคือคำตอบบรรทัดแรก ระวังบรรทัดที่สอง ถนนที่เปิดวันเดียวกับคำตอบแต่อยู่หลังเส้นนั้นในลำดับที่เรียงก็เปิดแล้วเหมือนกัน ต้องนับทุกเส้นที่วันเปิดไม่เกินคำตอบ ถ้าตรวจด้วย BFS ทุกครั้งที่มีถนนเปิด จะช้าเกินเมื่อมีถนนสองแสนเส้น</p>'''
