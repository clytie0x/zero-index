title = "รถบรรทุกข้ามสะพาน"
level = 3
time_limit = 1
source = "แนวเดียวกับโจทย์ตอบคำถามบนกราฟแบบออฟไลน์ โดยเรียงคำถามตามเกณฑ์แล้วเพิ่มเส้นด้วย union-find"
hint = '''<p>รถหนัก t ผ่านได้เฉพาะถนนที่รับได้อย่างน้อย t ถ้าเรียงคำถามจากรถหนักไปเบา ถนนที่ใช้ได้มีแต่เพิ่มขึ้น ไม่เคยหายไป จึงเปิดถนนจากรับได้มากไปน้อยแบบรถบรรทุกในหน้า 29.5 ก่อนตอบคำถามที่หนัก t ให้เปิดถนนทุกเส้นที่รับได้ตั้งแต่ t ขึ้นไป แล้วดูว่า a กับ b อยู่กลุ่มเดียวกันไหม เก็บคำตอบตามหมายเลขคำถามแล้วพิมพ์ตามลำดับเดิม ถนนที่รับได้เท่ากับ t พอดีก็ผ่านได้ ถ้า BFS ใหม่ทุกคำถาม จะเป็น O(Q(N + M)) ซึ่งไม่ทัน</p>'''
