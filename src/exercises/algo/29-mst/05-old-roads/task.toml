title = "ถนนเก่ากับถนนใหม่"
level = 2
time_limit = 1
hint = '''<p>ถนนเก่าคือเส้นราคา 0 ที่ต้องใช้แน่นอน รวมกลุ่มตามถนนเก่าให้หมดก่อน แล้วทำ Kruskal กับแนวถนนใหม่ ตรวจว่าครบด้วยจำนวนกลุ่ม เพราะถนนเก่าอาจเป็นวงจรกันเอง ส่วนผู้สนับสนุน ถ้าบริษัทจ่ายแนว e ก็เหมือน e ราคา 0 ลองทุกแนวแล้วทำ Kruskal ใหม่ทุกครั้งได้คำตอบถูก แต่เป็น O(M(N + M)) ไม่ทันเมื่อมีสองแสนแนว ลองคิดว่าเมื่อ e ราคา 0 แล้ว ต้นไม้ที่ถูกที่สุดเปลี่ยนจากเดิมได้อย่างไร ใช้การแลกเส้นแบบในข้อพิสูจน์ของ Kruskal แล้วจะเห็นว่าราคาลดได้ไม่เกินราคาของแนวที่แพงที่สุดในบรรดาแนวที่ Kruskal หยิบ ระวังกรณีไม่ต้องสร้างแนวใหม่เลย และราคารวมถึงราว 10<sup>14</sup> ต้องใช้ <code>long long</code></p>'''
