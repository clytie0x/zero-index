hint = '''<p>ใครอยู่ห้องเดียวกับใครเป็นงานของ union-find ขนาดห้องอ่านได้จาก <code>group_size</code> ที่หัวหน้า แต่หมายเลขห้องไม่ใช่หมายเลขของหัวหน้าเสมอไป union by size อาจเลือกหัวหน้าจากฝั่งของ b เพราะห้องของ b ใหญ่กว่า ให้เก็บหมายเลขห้องไว้อีกอาเรย์หนึ่งที่ตำแหน่งหัวหน้า ก่อนรวมจำหมายเลขห้องของ a ไว้ รวมเสร็จแล้วค่อยเขียนลงที่หัวหน้าคนใหม่ ถ้ารวมห้องโดยไล่เปลี่ยนหมายเลขห้องของผู้ใช้ทุกคน จะเป็น O(NQ) ไม่ทันเมื่อรวมห้องเป็นแสนครั้ง และ find แบบ recursion ที่ไม่มี union by size อาจพังด้วย stack overflow</p>'''
