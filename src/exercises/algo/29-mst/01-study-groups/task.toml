title = "กลุ่มติวหนังสือ"
level = 1
time_limit = 1
hint = '''<p>สองกลุ่มขนาด s<sub>a</sub> กับ s<sub>b</sub> รวมกัน คู่ใหม่ที่เกิดขึ้นคือคนหนึ่งจากกลุ่มแรกจับกับคนหนึ่งจากกลุ่มที่สอง มี s<sub>a</sub> × s<sub>b</sub> คู่ คู่เดิมในแต่ละกลุ่มยังอยู่ครบ จึงบวกเพิ่มแค่นี้ ถ้าสองคนอยู่กลุ่มเดียวกันอยู่แล้ว จำนวนคู่ไม่เปลี่ยน union-find ที่เก็บขนาดกลุ่มไว้ที่หัวหน้าบอก s<sub>a</sub> กับ s<sub>b</sub> ได้ทันที แต่ต้องอ่านก่อนรวม เพราะรวมแล้วขนาดที่หัวหน้าเปลี่ยน นักเรียนสองแสนคนอยู่กลุ่มเดียวกันมีราว 2 × 10<sup>10</sup> คู่ เกิน <code>int</code> ถ้าทุกครั้งที่รวมไล่เปลี่ยนหมายเลขกลุ่มของทั้งห้อง จะเป็น O(NM) ไม่ทันเมื่อ N กับ M เป็นแสน</p>'''
