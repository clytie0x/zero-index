source = "แนวเดียวกับโจทย์เลือกสร้างแหล่งพลังงานที่จุดเองหรือเดินสายไปจุดอื่น ซึ่งใช้ฝึกโหนดสมมติกับ Prim ที่ไม่เก็บเส้นเชื่อม"
hint = '''<p>สร้างโหนดสมมติแทนแสงแดดแบบหน้า 29.5 ติดแผงที่บ้าน i คือเส้นจากโหนดสมมติไปบ้าน i ราคา s<sub>i</sub> ทุกคู่บ้านเดินสายถึงกันได้ กราฟมีเส้นราว 24.5 ล้านเส้นเมื่อ N = 7000 ใช้ Prim แบบ O(N<sup>2</sup>) ในหน้า 29.4 ที่ไม่เก็บเส้นเชื่อม เริ่มจากต้นไม้ที่มีแค่โหนดสมมติ ค่าเริ่มต้นของ <code>best[i]</code> จึงเป็น s<sub>i</sub> ราคาสายเส้นเดียวสูงสุด 2 × 10<sup>9</sup> ยังอยู่ใน <code>int</code> แต่ราคารวมถึงราว 7 × 10<sup>12</sup> เกิน <code>int</code> ต้องเก็บด้วย <code>long long</code> ถ้าสร้างเส้นทุกคู่แล้วทำ Kruskal จะทั้งช้าและกินหน่วยความจำหลายร้อย MB</p>'''
