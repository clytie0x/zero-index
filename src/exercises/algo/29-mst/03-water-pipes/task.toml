hint = '''<p>ทำ Kruskal ตามหน้า 29.3 เก็บแนวท่อเป็น tuple ที่ราคาอยู่ช่องแรก เรียง แล้วหยิบแนวที่สองปลายอยู่คนละกลุ่มของ union-find ถ้าหยิบได้ไม่ครบ N - 1 แนว แปลว่าต่อไม่ครบ ให้พิมพ์ -1 ราคารวมถึงราว 10<sup>14</sup> ต้องใช้ <code>long long</code> ถ้าตรวจว่าสองหมู่บ้านถึงกันแล้วหรือยังด้วย BFS ทุกแนว จะเป็น O(NM) ซึ่งไม่ทันเมื่อ N เป็นแสน</p>'''
