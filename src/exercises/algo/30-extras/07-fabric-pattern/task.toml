source = "แนวเดียวกับโจทย์หาคาบที่สั้นที่สุดของสตริง"
hint = '''<p>ถ้าแม่แบบยาว p ผ้า N - p ตัวแรกต้องเหมือนกับผ้า N - p ตัวสุดท้ายพอดี เพราะเลื่อนไป p ตัวแล้วต้องได้สีเดิม ส่วนต้นที่เป็นส่วนท้ายด้วยและยาวที่สุดคือค่าสุดท้ายของ prefix function ในหน้า 30.4 คำตอบจึงเป็น N ลบค่านั้น คำตอบไม่จำเป็นต้องหาร N ลงตัว เพราะผ้าจบกลางแม่แบบได้ การลองทุกความยาวแล้วเทียบทั้งผืนใช้ได้กับผ้าสั้น แต่ผ้าที่เป็น a ทั้งผืนแล้วจบด้วย b ทำให้ต้องเทียบราว N<sup>2</sup>/2 ครั้ง</p>'''
