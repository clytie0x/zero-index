hint = '''<p>ต้องทั้งปรับค่าและถามผลรวมช่วงสลับกันเป็นแสนครั้ง Fenwick tree ทำได้ทั้งสองอย่างใน O(log N) ยอดรวมสาขา l ถึง r คือ <code>prefix_sum(r) - prefix_sum(l - 1)</code> เหตุการณ์แบบ 1 ไม่ได้บอกว่าเพิ่มเท่าไร แต่บอกค่าใหม่ ต้องเก็บยอดปัจจุบันของทุกสาขาไว้อีกอาเรย์ แล้วบวกส่วนต่าง <code>v - sales[i]</code> เข้าไปในต้นไม้ ยอดรวมถึง 2 × 10<sup>14</sup> ใช้ <code>long long</code> การบวกทีละสาขาทุกคำถามเป็น O(NQ) ไม่ทัน</p>'''
