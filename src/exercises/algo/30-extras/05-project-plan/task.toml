source = "แนวเดียวกับโจทย์ critical path ของการวางแผนโครงการ"
hint = '''<p>งาน b เริ่มได้เมื่องานก่อนหน้าทุกงานเสร็จแล้ว วันเริ่มของ b จึงเป็นค่ามากสุดของวันเสร็จของงานก่อนหน้า เป็น DP บน DAG แบบเส้นทางยาวสุดในหน้า 30.1 ต้องคำนวณตามลำดับ topological ใช้ Kahn ได้ลำดับไปพร้อมกัน คำตอบคือวันเสร็จที่มากที่สุดของทุกงาน ไม่ใช่ของงานสุดท้ายในลำดับ ผลรวมถึง 2 × 10<sup>14</sup> ใช้ <code>long long</code> การวนปรับค่าทุกเงื่อนไขซ้ำจนไม่มีอะไรเปลี่ยน ใช้ได้ผลแต่อาจต้องวนถึง N รอบ</p>'''
