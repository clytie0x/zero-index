title = "สถานีที่หนาวที่สุด"
level = 1
time_limit = 1
hint = '''<p>ค่าต่ำสุดถอนกลับไม่ได้ จึงใช้ prefix sum หรือ Fenwick tree แบบผลรวมไม่ได้ segment tree ปรับค่าจุดเดียวกับถามช่วงได้ใน O(log N) ทั้งคู่ ส่วนที่ต้องคิดเพิ่มคือต้องตอบหมายเลขสถานีด้วย ให้แต่ละโหนดเก็บคู่ (อุณหภูมิ, หมายเลขสถานี) แล้วรวมด้วย <code>min</code> ของ pair ซึ่งเทียบอุณหภูมิก่อน ถ้าเท่ากันก็เทียบหมายเลข จึงได้สถานีหมายเลขน้อยสุดเองโดยไม่ต้องเขียนเงื่อนไขเพิ่ม โหนดที่อยู่นอกช่วงที่ถามต้องคืนคู่ที่ไม่มีผลกับ <code>min</code> เช่น <code>{INT_MAX, INT_MAX}</code> อุณหภูมิติดลบได้และใหญ่ได้ถึง 10<sup>9</sup> อย่าใช้ 0 หรือ 1000000 การไล่หาค่าต่ำสุดทุกคำถามเป็น O(NQ) ไม่ทัน</p>'''
