hint = '''<p>ค่าต่ำสุดถอนกลับไม่ได้ จึงใช้ prefix sum หรือ Fenwick tree แบบผลรวมไม่ได้ ใช้ segment tree แบบค่าต่ำสุดตามหน้า 30.3 ปรับค่าจุดเดียวกับถามช่วงเป็น O(log N) ทั้งคู่ โหนดที่อยู่นอกช่วงที่ถามต้องคืนค่าที่ไม่มีผลกับ <code>min</code> เช่น <code>INT_MAX</code> อุณหภูมิติดลบได้และใหญ่ได้ถึง 10<sup>9</sup> อย่าใช้ 0 หรือ 1000000 การไล่หาค่าต่ำสุดทุกคำถามเป็น O(NQ) ไม่ทัน</p>'''
