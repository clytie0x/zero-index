title = "จองห้องพักออนไลน์"
level = 3
time_limit = 1
hint = '''<p>เริ่มจาก difference array เก็บการเปลี่ยนแปลง c ไว้ใน Fenwick tree การจองหนึ่งครั้งบวก g ที่คืน l และลบ g ที่คืน r + 1 จำนวนแขกคืนที่ i คือ c<sub>1</sub> + ... + c<sub>i</sub> ส่วนที่ต้องคิดเพิ่มคือคำถามถามผลรวมของจำนวนแขกหลายคืน ผลรวมคืนที่ 1 ถึง x คือผลรวมของ c<sub>j</sub> × (x - j + 1) ทุก j ไม่เกิน x กระจายได้เป็น (x + 1) × (ผลรวมของ c<sub>j</sub>) - (ผลรวมของ j × c<sub>j</sub>) จึงใช้ Fenwick tree สองต้น ต้นแรกเก็บ c<sub>j</sub> ต้นที่สองเก็บ j × c<sub>j</sub> แล้วตอบช่วง l ถึง r ด้วยผลรวมถึง r ลบผลรวมถึง l - 1 ระวังการจองที่จบคืนสุดท้าย ช่อง r + 1 อยู่นอกต้นไม้ ผลรวมถึงราว 4 × 10<sup>14</sup> ใช้ <code>long long</code> ทุกที่ รวมถึงตอนคูณ j × c<sub>j</sub></p>'''
