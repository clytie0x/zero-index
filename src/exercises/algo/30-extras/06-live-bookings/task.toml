hint = '''<p>ใช้ความคิดของ difference array ในหน้า 19.5 การจองหนึ่งครั้งเปลี่ยนแค่สองจุด คือบวก g ที่คืน l และลบ g ที่คืน r + 1 จำนวนแขกคืนที่ i คือผลรวมของการเปลี่ยนแปลงตั้งแต่คืนแรกถึงคืนที่ i ข้อนี้ถามสลับกับจอง จึงเก็บการเปลี่ยนแปลงไว้ใน Fenwick tree แทนอาเรย์ธรรมดา แบบหัวข้อบวกทั้งช่วงในหน้า 30.2 ระวังการจองที่จบคืนสุดท้าย ช่อง r + 1 อยู่นอกต้นไม้ จำนวนแขกถึง 2 × 10<sup>14</sup></p>'''
