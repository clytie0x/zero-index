source = "แนวเดียวกับโจทย์ topological sort ที่เลือกเลขน้อยสุดก่อน"
hint = '''<p>ใช้ Kahn ตามหน้า 30.1 นับว่าแต่ละขั้นยังรออีกกี่ขั้น แต่เปลี่ยน queue ธรรมดาเป็น <code>priority_queue</code> แบบน้อยสุดก่อนจากหน้า 20.5 จะได้หยิบขั้นเลขน้อยที่สุดที่พร้อมทำเสมอ ถ้าหยิบออกมาได้ไม่ครบ N ขั้น แปลว่ามีวง ตอบ -1 การไล่หาขั้นที่พร้อมตั้งแต่ขั้น 1 ใหม่ทุกครั้งเป็น O(N<sup>2</sup>) ไม่ทันเมื่อ N เป็นสองแสน</p>'''
