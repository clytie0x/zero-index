source = "แนวเดียวกับโจทย์ first fit บน segment tree"
hint = '''<p>เก็บที่ว่างของทุกชั้นใน segment tree แบบค่ามากสุดตามหน้า 30.3 ถ้ารากมีค่าน้อยกว่าขนาดกล่อง ไม่มีชั้นไหนรับได้ ตอบ 0 ถ้ารับได้ ให้เดินลงจากรากทีละชั้น ถ้าลูกซ้ายมีค่ามากสุดอย่างน้อยเท่ากล่อง ชั้นแรกที่รับได้อยู่ฝั่งซ้ายแน่ ไปทางซ้าย ไม่อย่างนั้นไปทางขวา จนถึงใบ คิดแบบเดียวกับรอยต่อของ binary search ในหน้า 19.1 แต่ค้นบนต้นไม้ วางกล่องแล้วปรับค่าใบนั้นและพ่อทุกชั้น ทั้งหมดเป็น O(log N) ต่อกล่อง การเดินหาจากชั้นแรกทุกครั้งไม่ทันเมื่อชั้นหน้าโกดังเต็มหมด</p>'''
