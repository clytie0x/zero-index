hint = '''<p>ต่อท่ากับบันทึกเป็น <code>combo + "#" + presses</code> แล้วหา prefix function ตามหน้า 30.4 ตำแหน่ง i ที่ได้ค่าเท่ากับ M คือช่วงที่ตรงท่าพอดี และช่วงนั้นจบที่ตัว i ของข้อความที่ต่อแล้ว ลองไล่ตัวอย่างเล็กๆ ด้วยมือเพื่อหาว่าต้องลบเท่าไรถึงได้ครั้งที่เริ่มกด จำนวนช่วงมีได้เกือบล้าน การเทียบทีละตำแหน่งแบบหน้า 13.5 ใช้ได้กับชุดเล็ก แต่บันทึกที่เป็น a ทั้งหมดทำให้ต้องเทียบถึง N × M ครั้ง</p>'''
