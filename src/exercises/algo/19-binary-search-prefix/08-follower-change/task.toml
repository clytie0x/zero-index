source = "แนวเดียวกับโจทย์นับ subarray ที่ผลรวมเท่ากับ k"
hint = '''<p>ช่วงวันที่ l ถึง r เปลี่ยนรวม K พอดีเมื่อ <code>prefix[l - 1] = prefix[r] - K</code> ตามหน้า 19.5 ค่าในแต่ละวันกว้างถึง ±10<sup>9</sup> ใช้อาเรย์นับไม่ได้ ให้เรียงคู่ (prefix, index) แล้วใช้ <code>lower_bound</code> สองครั้งต่อหนึ่งวัน r อย่าลืมใส่ <code>prefix[0]</code> และจำนวนช่วงถึง N(N + 1)/2 ซึ่งเกิน <code>int</code> ลองทุกคู่ l กับ r ต้องทำราว 2 × 10<sup>10</sup> คู่เมื่อ N เป็นสองแสน</p>'''
