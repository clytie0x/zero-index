source = "แนวเดียวกับโจทย์หาจุดนัดพบบนเส้นตรงที่ใช้ฝึก binary search บนจำนวนจริง"
hint = '''<p>ถามว่า "ภายใน T วินาที ทุกคนไปเจอกันได้ไหม" ภายใน T วินาที คนที่ i ไปได้ทุกจุดตั้งแต่ x<sub>i</sub> - v<sub>i</sub>T ถึง x<sub>i</sub> + v<sub>i</sub>T ทุกคนเจอกันได้เมื่อช่วงทั้งหมดมีจุดร่วม คือขอบซ้ายที่มากที่สุดไม่เกินขอบขวาที่น้อยที่สุด ถ้า T ทำได้ เวลาที่มากกว่าก็ทำได้ ใช้ binary search บนจำนวนจริงแบบหน้า 19.4 วน 100 รอบ ช่วงเริ่มที่ 0 ถึง 10<sup>9</sup> พิมพ์ด้วย <code>fixed</code> กับ <code>setprecision(4)</code> ถ้าลองทุกคู่ของคน จะมีห้าพันล้านคู่เมื่อ N เป็นแสน</p>'''
