hint = '''<p>ถ้าวนทาทีละแผ่นทุกกลุ่ม เมื่อ N กับ Q เป็นสองแสนและทุกกลุ่มทาเกือบทั้งรั้ว ต้องบวกถึง 4 × 10<sup>10</sup> ครั้ง ใช้ difference array ในหน้า 19.5 แต่ละกลุ่มจดแค่สองช่อง แล้วสะสมครั้งเดียวก็ได้จำนวนชั้นของทุกแผ่น จำนวนชั้นรวมได้ถึง 2 × 10<sup>14</sup> และ K ก็เกิน <code>int</code> ได้ ใช้ <code>long long</code> ทั้งคู่ ระวังกลุ่มที่ทาถึงแผ่นที่ N ซึ่งต้องลบที่ช่อง N + 1</p>'''
