hint = '''<p>ภายใน T นาที เตาที่ i อบได้ T / t<sub>i</sub> ถาดแบบปัดเศษทิ้ง ถ้า T นาทีพอ T + 1 นาทีก็พอ จึงหา T แรกที่พอด้วยลูปแบบหน้า 19.3 คำตอบไม่เกิน M คูณเวลาของเตาที่เร็วที่สุด ซึ่งถึง 10<sup>18</sup> ต้องใช้ <code>long long</code> ทั้ง <code>lo</code> <code>hi</code> <code>mid</code> และตัวนับถาด ถ้าตั้ง <code>hi</code> ใหญ่กว่านั้น ตัวนับถาดอาจล้นแม้เป็น <code>long long</code> ให้หยุดนับทันทีที่ได้ครบ M ถาด</p>'''
