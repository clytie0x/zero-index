title = "แผนรดน้ำต้นไม้"
level = 3
time_limit = 1
hint = '''<p>ถ้ารดครบ k ครั้งแรกแล้วทุกต้นได้น้ำพอ รดเพิ่มอีกครั้งก็ยังพอ เพราะน้ำมีแต่เพิ่ม คำตอบจึงเป็น k แรกที่ตอบ "ใช่" แบบหน้า 19.3 ส่วนการตรวจว่า k ครั้งแรกพอไหม ใช้ difference array ในหน้า 19.5 กับ k รายการแรก แล้วสะสมเทียบกับที่แต่ละต้นต้องการ ตรวจหนึ่งครั้งเป็น O(N + Q) และตรวจราว 18 ครั้ง ถ้ารดครบ Q ครั้งแล้วยังไม่พอ ตอบ -1 ถ้าทุกต้นต้องการ 0 ลิตร ตอบ 0 ปริมาณน้ำและความต้องการเกิน <code>int</code></p>'''
