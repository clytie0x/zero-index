hint = '''<p>ทำตามหัวข้อระยะห่างมากที่สุดในหน้า 19.3 เรียงตำแหน่งก่อน แล้วถามว่า "ตั้ง C ต้นให้ทุกคู่ห่างกันอย่างน้อย D ได้ไหม" ตอบด้วย greedy ตั้งต้นแรกที่จุดซ้ายสุด ไล่ไปทางขวา ตั้งต้นถัดไปที่จุดแรกที่ห่างจากต้นล่าสุดอย่างน้อย D ถ้า D ทำได้ D - 1 ก็ทำได้ จึงหา "ใช่" ตัวสุดท้าย ปัดจุดกลางขึ้น ถ้าลองทุกคู่ของจุดเป็นค่า D ที่เป็นไปได้ จะมีถึง 5 × 10<sup>9</sup> ค่าเมื่อ N เป็นแสน</p>'''
