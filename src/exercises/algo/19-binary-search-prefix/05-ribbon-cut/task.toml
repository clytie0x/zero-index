hint = '''<p>ถ้าตัดยาว x ซม. ได้จำนวนเส้นรวมเท่ากับผลรวมของ L<sub>i</sub> / x แบบปัดเศษทิ้ง ยิ่งยาวยิ่งได้น้อย ถ้า x ใช้ได้ x - 1 ก็ใช้ได้ คำตอบคือ "ใช่" ตัวสุดท้ายแบบโจทย์ตัดไม้ในหน้า 19.3 ให้ <code>lo</code> เริ่มที่ 0 <code>hi</code> เริ่มที่ม้วนที่ยาวที่สุด และปัดจุดกลางขึ้น ซึ่งทำให้ไม่ต้องหารด้วย 0 ด้วย ตอนตัดยาว 1 ซม. จำนวนเส้นรวมถึง 10<sup>14</sup> ต้องนับด้วย <code>long long</code> ถ้าลองทุกความยาวจากยาวไปสั้น เมื่อคำตอบสั้นแต่ริบบิ้นยาวพันล้าน ต้องลองเกือบพันล้านค่า</p>'''
