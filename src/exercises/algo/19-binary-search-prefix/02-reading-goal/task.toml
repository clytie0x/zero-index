hint = '''<p>สร้าง <code>prefix</code> ของจำนวนหน้าก่อน ถ้าเริ่มวันที่ s จำนวนหน้าที่อ่านถึงวันที่ d คือ <code>prefix[d] - prefix[s - 1]</code> ต้องการให้ค่านี้อย่างน้อย t ก็คือ <code>prefix[d] &gt;= prefix[s - 1] + t</code> ตัวเลขทางขวาเป็นค่าคงที่ของคำถามนั้น จำนวนหน้าไม่ติดลบ <code>prefix</code> จึงเรียงอยู่แล้ว ใช้ <code>lower_bound</code> ค้นตั้งแต่ <code>prefix.begin() + s</code> ตามหน้า 19.2 วันที่ไม่ได้อ่านทำให้มีค่าซ้ำ ต้องได้วันแรก</p>'''
