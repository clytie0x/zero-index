title = "ส่งน้ำแข็งถึงกี่บ้าน"
level = 1
time_limit = 1
hint = '''<p>เรียงตำแหน่งบ้านครั้งเดียว แล้วแต่ละวันนับบ้านที่ตำแหน่งอยู่ตั้งแต่ p - d ถึง p + d ด้วย <code>upper_bound(p + d)</code> ลบ <code>lower_bound(p - d)</code> ตามหน้า 19.2 ระวังบ้านที่อยู่ตรงขอบช่วงพอดี และบ้านหลายหลังที่อยู่ตำแหน่งเดียวกัน วิธีไล่ดูทุกบ้านทุกวันต้องเทียบถึง 4 × 10<sup>10</sup> ครั้ง ไม่ทันเวลา</p>'''
