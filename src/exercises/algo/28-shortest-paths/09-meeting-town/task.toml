hint = '''<p>N ไม่เกิน 300 ใช้ Floyd-Warshall ในหน้า 28.5 หาระยะทุกคู่ได้ใน 2.7 × 10<sup>7</sup> ขั้น แล้วลองทุกเมืองเป็นเมืองนัดพบ รวมระยะจากเมืองของเพื่อนทุกคน ข้ามเมืองที่มีเพื่อนคนใดไปไม่ถึง เริ่มตารางด้วยถนนที่สั้นที่สุดของแต่ละคู่ เพราะคู่เดียวกันอาจมีถนนหลายเส้น ลูป k ต้องอยู่นอกสุด ผลรวมเกิน <code>int</code> และอนันต์ต้องบวกกันแล้วไม่ล้น</p>'''
