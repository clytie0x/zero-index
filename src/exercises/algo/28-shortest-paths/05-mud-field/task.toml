hint = '''<p>ให้ช่อง (r, c) เป็นจุดหมายเลข <code>r * C + c</code> แล้วใช้ Dijkstra แบบตารางในหน้า 28.3 ระยะเริ่มของช่องแรกคือค่าของช่องแรก ไม่ใช่ 0 และน้ำหนักของการก้าวคือค่าของช่องที่ก้าวเข้าไป ข้ามช่องที่เป็น -1 ถ้าช่องเริ่มหรือช่องปลายเป็น -1 ตอบ -1 ได้ทันที ผลรวมเกิน <code>int</code> ได้ และตารางมีถึงสองแสนห้าหมื่นช่อง Dijkstra แบบอาเรย์ไม่ทัน</p>'''
