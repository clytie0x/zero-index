hint = '''<p>มีค่าติดลบ Dijkstra ใช้ไม่ได้ ใช้ Bellman-Ford ในหน้า 28.4 N × M ไม่เกิน 10<sup>7</sup> ผ่อน V - 1 รอบแล้วตรวจต่ออีก V รอบ จุดที่ยังผ่อนได้และทุกจุดที่เดินต่อจากจุดพวกนั้นได้คือจุดที่ลดได้ไม่สิ้นสุด ถ้าจุด N อยู่ในพวกนี้ตอบ <code>-inf</code> ระวังวงติดลบที่ไปไม่ถึงจุด N หรือที่ไปจากจุด 1 ไม่ถึง สองแบบนี้ไม่มีผลกับคำตอบ ผ่อนเฉพาะถนนที่ต้นทางไปถึงแล้ว และคำตอบต่ำกว่าค่าน้อยสุดของ <code>int</code> ได้</p>'''
