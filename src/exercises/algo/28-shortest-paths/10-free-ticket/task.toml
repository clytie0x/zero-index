title = "ตั๋วผ่านทางฟรีหนึ่งใบ"
level = 3
time_limit = 1
source = "แนวเดียวกับโจทย์เส้นทางสั้นสุดที่ลดราคาได้หนึ่งเส้น ซึ่งใช้ฝึก Dijkstra บนสถานะ"
hint = '''<p>ลองทุกถนนเป็นถนนที่ใช้ตั๋วแล้วรัน Dijkstra ใหม่ทุกครั้ง ช้าไป M เท่า มีสองวิธีที่เร็ว วิธีแรก รัน Dijkstra จากจุด 1 ได้ <code>from1</code> และจากจุด N ได้ <code>fromN</code> ถ้าใช้ตั๋วกับถนน u v คำตอบคือ <code>from1[u] + fromN[v]</code> ลองทุกถนนทั้งสองทิศแล้วเอาค่าน้อยสุด วิธีที่สอง ให้สถานะเป็น (จุด, ใช้ตั๋วไปแล้วหรือยัง) มี 2N สถานะ จากสถานะที่ยังไม่ใช้ตั๋ว เดินถนนแบบจ่ายเต็มหรือแบบใช้ตั๋วก็ได้ ส่วนสถานะที่ใช้ไปแล้วจ่ายเต็มอย่างเดียว แล้วรัน Dijkstra บนสถานะ ทั้งสองวิธีเป็น O((N + M) log N) ระวังอย่าให้ใช้ตั๋วได้สองครั้ง และระยะเกิน <code>int</code></p>'''
