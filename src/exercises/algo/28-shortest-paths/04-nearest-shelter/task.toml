hint = '''<p>รัน Dijkstra จากศูนย์ทีละแห่งแล้วเก็บค่าน้อยสุด ใช้เวลา K เท่าของ Dijkstra หนึ่งครั้ง ซึ่งไม่ทันเมื่อ K เป็นพัน ให้ใส่ทุกศูนย์ลงคิวด้วยระยะ 0 ตั้งแต่แรก แบบหลายจุดเริ่มในหน้า 28.3 แล้วรันครั้งเดียว จบแล้วไล่ดูทุกหมู่บ้าน หาค่ามากสุดในบรรดาที่ไม่ใช่อนันต์ และนับตัวที่เป็นอนันต์ ระยะเกิน <code>int</code> ได้ และหมายเลขศูนย์อาจซ้ำ</p>'''
