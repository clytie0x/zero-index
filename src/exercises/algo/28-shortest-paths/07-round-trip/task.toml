title = "ไปส่งแล้ววนกลับ"
level = 2
time_limit = 1
source = "แนวเดียวกับโจทย์ระยะไปกลับบนกราฟมีทิศทาง ที่ใช้กราฟกลับทิศ"
hint = '''<p>ขาไปคือระยะจากจุด 1 ไปทุกบ้าน ได้จาก Dijkstra ครั้งเดียว ขากลับคือระยะจากทุกบ้านมาจุด 1 ซึ่งถ้ารัน Dijkstra จากทุกบ้านจะช้า N เท่า ให้สร้างกราฟอีกชุดที่กลับทิศถนนทุกเส้น ระยะจาก v มา 1 ในกราฟเดิมเท่ากับระยะจาก 1 ไป v ในกราฟกลับทิศ จึงรัน Dijkstra จากจุด 1 บนกราฟกลับทิศอีกครั้งเดียวก็ได้ขากลับของทุกบ้าน ผลรวมเกิน <code>int</code> และถ้าบ้านไหนไปไม่ถึงหรือกลับไม่ได้ ให้ตอบ -1</p>'''
