hint = '''<p>กดสวิตช์เดิมสองครั้งเท่ากับไม่ได้กด และลำดับการกดไม่มีผล แต่ละสวิตช์จึงมีแค่สองทาง กดหรือไม่กด N ไม่เกิน 20 ลองทุกเซตย่อยด้วย bitmask แบบหน้า 21.2 ได้ เก็บสวิตช์แต่ละตัวเป็นตัวเลขที่ bit ที่ j - 1 เป็น 1 ถ้าสวิตช์นั้นสลับหลอดที่ j สถานะหลอดหลังกดคือ XOR (<code>^</code> ในหน้า 12.3) ของทุกสวิตช์ที่เลือก ไม่ใช่ OR เพราะหลอดที่โดนสลับสองครั้งจะดับ เทียบกับ <code>(1 &lt;&lt; M) - 1</code> แล้วนับจำนวนสวิตช์ด้วย <code>__builtin_popcount</code></p>'''
