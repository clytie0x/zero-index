hint = '''<p>ใช้โครงซูโดกุ 4 × 4 ในหน้า 21.3 เติมช่องว่างทีละช่องจากซ้ายไปขวา บนลงล่าง ลองเลข 1 ถึง 6 จากน้อยไปมาก แล้วหยุดทันทีที่เติมครบ คำตอบแรกที่เจอจะเป็นแบบที่โจทย์ต้องการเอง กล่องสูง 2 แถว กว้าง 3 คอลัมน์ มุมซ้ายบนของกล่องคือแถว <code>r / 2 * 2</code> คอลัมน์ <code>c / 3 * 3</code> ระวังเลขที่ให้มาตั้งแต่ต้นอาจขัดกฎกันเอง ตัวค้นหาตรวจเฉพาะเลขที่เราเติม จึงต้องตรวจเลขที่ให้มาก่อนเริ่มค้น ทั้งแถว คอลัมน์ และกล่อง</p>'''
