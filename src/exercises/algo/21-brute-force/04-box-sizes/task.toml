hint = '''<p>นับก่อนลอง วนกว้าง ยาว สูงครบสามชั้นถึง V ไม่มีทางทัน แต่พอเลือก a กับ b แล้ว c ถูกบังคับให้เป็น V / (a × b) ไม่ต้องวนหา แค่ตรวจว่าหารลงตัว แบบตัดลูปชั้นในในหน้า 21.1 ถึงอย่างนั้น ถ้าวน a ไปถึง V และวน b ไปจน a × b เกิน V ก็ยังต้องทำราว 10<sup>11</sup> รอบเมื่อ V = 10<sup>10</sup> ไม่ทัน ให้ใช้เงื่อนไข a ≤ b ≤ c จำกัดลูป a ≤ b ≤ c แปลว่า a × a × a ≤ V จึงวน a แค่ถึง 2154 และ a × b × b ≤ V จึงวน b แค่ถึงราว √(V / a) เหลือไม่ถึง 10<sup>7</sup> รอบ และได้ c ≥ b มาเองโดยไม่ต้องตรวจ V ใหญ่เกิน <code>int</code> และพื้นที่ผิวของกล่อง 1 × 1 × V ได้ถึงราว 4 × 10<sup>10</sup> ใช้ <code>long long</code> ทุกตัว</p>'''
