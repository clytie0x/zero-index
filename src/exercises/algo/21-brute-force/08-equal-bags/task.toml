title = "แบ่งขนมใส่ถุงให้หนักเท่ากัน"
level = 3
time_limit = 1
source = "แนวเดียวกับโจทย์แบ่งของเป็น K กลุ่มที่ผลรวมเท่ากัน"
hint = '''<p>ทุกถุงต้องหนักเท่ากับผลรวมหาร K ถ้าหารไม่ลงตัว หรือห่อที่หนักที่สุดหนักเกินนั้น ตอบ <code>NO</code> ได้เลย ลองใส่ทุกห่อลงทุกถุงมี K<sup>N</sup> แบบ 5<sup>20</sup> เกินไปมาก แม้จะตัดเมื่อถุงหนักเกินก็ยังช้าเมื่อคำตอบเป็น <code>NO</code> ต้องตัดกิ่งเพิ่ม วิธีหนึ่งคือเติมทีละถุงให้ได้น้ำหนักพอดี เรียงห่อจากหนักไปเบา ถุงใหม่ทุกถุงเริ่มด้วยห่อที่หนักที่สุดที่ยังเหลือ เพราะห่อนั้นต้องอยู่ในถุงใดถุงหนึ่งอยู่แล้ว ถ้าเริ่มแบบนั้นแล้วไม่สำเร็จ ก็ไม่ต้องลองแบบอื่น ภายในถุงเดียวกันเลือกห่อตามลำดับจากหน้าไปหลังเหมือนเลือกเซตย่อย และถ้าห่อน้ำหนักเท่านี้เพิ่งลองแล้วไม่สำเร็จ ห่อถัดไปที่หนักเท่ากันก็ข้ามได้ เติมครบ K - 1 ถุงแล้ว ห่อที่เหลือหนักพอดีถุงสุดท้ายเอง</p>'''
