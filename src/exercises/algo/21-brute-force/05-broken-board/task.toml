hint = '''<p>วางทีละแถวแบบ N-Queens ในหน้า 21.3 ใช้อาเรย์จำคอลัมน์และแนวทแยงทั้งสองทิศที่ถูกใช้แล้ว เพิ่มเงื่อนไขเดียวคือช่อง <code>#</code> วางไม่ได้ ถ้าลองทุกการเรียงสับเปลี่ยนของคอลัมน์ด้วย <code>next_permutation</code> แล้วค่อยตรวจทีหลัง เมื่อ N = 12 ต้องตรวจ 12! ราว 4.8 × 10<sup>8</sup> แบบ ไม่ทันเวลา ต้องตัดตั้งแต่แถวแรกที่ขัดกฎ คำตอบที่ N = 12 ไม่เกิน 14200 จึงใช้ <code>int</code> ได้</p>'''
