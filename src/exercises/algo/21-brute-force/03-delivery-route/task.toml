hint = '''<p>ลำดับการไปบ้านคือการเรียงสับเปลี่ยนของ 1 ถึง N มี N! แบบ 9! = 362880 แบบ แต่ละแบบบวกระยะ N ครั้ง ไม่ถึงสี่ล้านครั้ง ลองทุกลำดับด้วย <code>next_permutation</code> แบบหน้า 21.2 ได้ เริ่มจาก vector ที่เรียงแล้วคือ 1 2 ... N อย่าใส่ร้าน (จุด 0) ลงไปในลำดับ เพราะร้านต้องเป็นจุดเริ่มเสมอ ระยะของลำดับหนึ่งคือ d[0][ลำดับแรก] บวกระยะระหว่างบ้านที่ติดกันในลำดับ ระวังว่า d[i][j] กับ d[j][i] อาจไม่เท่ากันเพราะถนนเดินรถทางเดียว</p>'''
