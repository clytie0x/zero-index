title = "ขนมสามชิ้น"
level = 1
hint = '''<p>N ไม่เกิน 100 จำนวนแบบของการเลือกสามชิ้นคือ C(N, 3) ไม่ถึงสองแสน ลองทุกแบบได้สบายด้วยลูปซ้อนสามชั้นแบบหน้า 21.1 ให้ <code>j</code> เริ่มที่ <code>i + 1</code> และ <code>k</code> เริ่มที่ <code>j + 1</code> จะได้ชิ้นที่ต่างกันเสมอ ถ้าเริ่มทุกลูปที่ 0 จะหยิบชิ้นเดิมซ้ำได้ เก็บคำตอบเริ่มต้นเป็น -1 แล้วอัปเดตเมื่อเจอผลรวมที่ไม่เกินงบและมากกว่าเดิม</p>'''
