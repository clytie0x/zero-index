title = "นับตะกร้าที่ไม่เกินงบ"
level = 3
time_limit = 1
source = "แนวเดียวกับโจทย์นับเซตย่อยที่ผลรวมไม่เกิน S ด้วย meet in the middle"
hint = '''<p>N ถึง 40 ลองครบ 2<sup>40</sup> แบบไม่ทัน และตัดกิ่งก็ไม่ช่วย เพราะเมื่อ S ใหญ่ คำตอบเองก็ใหญ่ระดับ 10<sup>12</sup> นับทีละแบบไม่ไหว ใช้ meet in the middle แบบหน้า 21.5 แบ่งของเป็นสองครึ่ง หาผลรวมทุกแบบของแต่ละครึ่ง ครึ่งละไม่เกิน 2<sup>20</sup> ค่า เรียงฝั่งขวา แล้วสำหรับผลรวม x ของฝั่งซ้ายแต่ละค่าที่ไม่เกิน S ให้นับว่าฝั่งขวามีกี่ค่าที่ไม่เกิน S - x ด้วย <code>upper_bound</code> ผลรวมกับคำตอบต้องเป็น <code>long long</code> ระวัง N เป็นเลขคี่ และอย่าลืมว่าตะกร้าว่างก็นับด้วย</p>'''
