hint = '''<p>สถานะคือปริมาณน้ำในสามขวด น้ำไม่หายไปไหน ถ้ารู้ปริมาณในขวด A กับ B ก็รู้ขวด C เอง จึงใช้ <code>visited[a][b]</code> ขนาด 101 × 101 แบบตัวอย่างข้ามแม่น้ำในหน้า 21.5 จากสถานะหนึ่งลองเททั้ง 6 แบบ คือจากขวด x ไปขวด y ที่ x ≠ y ปริมาณที่เทคือค่าน้อยกว่าระหว่างน้ำในขวด x กับที่ว่างในขวด y แล้ว DFS ไปทุกสถานะใหม่ที่ยังไม่เคยไป นับจำนวนสถานะที่ไปถึง และจดว่าขวด A เคยมีน้ำเท่าไรบ้าง ลืมเช็ก <code>visited</code> แล้วจะเทกลับไปกลับมาไม่รู้จบจน stack เต็ม</p>'''
