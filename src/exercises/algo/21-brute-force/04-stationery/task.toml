hint = '''<p>นับก่อนลอง ถ้าวนจำนวนดินสอ ปากกา และสมุดครบสามชั้น เมื่อราคาเป็น 1 บาททุกอย่างและ M = 10000 ต้องลองราว 10<sup>12</sup> แบบ ไม่ทันแน่ แต่พอเลือกจำนวนดินสอ x กับปากกา y แล้ว เงินที่เหลือคือ M - Ax - By ซึ่งต้องซื้อสมุดได้พอดี จำนวนสมุดจึงถูกกำหนดแล้ว ไม่ต้องวนหา แค่ตรวจว่าเงินที่เหลือหารด้วย C ลงตัว แบบตัดลูปชั้นในทิ้งในหน้า 21.1 และให้ลูป y หยุดเมื่อเงินที่เหลือติดลบ จะเหลือราว 5 × 10<sup>7</sup> รอบในกรณีแย่สุด</p>'''
