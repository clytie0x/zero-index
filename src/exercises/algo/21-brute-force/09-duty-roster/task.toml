title = "จัดเวรครู"
level = 3
time_limit = 1
source = "แนวเดียวกับปัญหาการมอบหมายงาน (assignment problem) ที่ใช้ฝึก branch and bound"
hint = '''<p>ลองทุกการจับคู่คือ N! แบบ 13! เกินหกพันล้าน ไม่ทัน ใช้ branch and bound แบบหน้า 21.4 จัดเวรให้ครูทีละคน จำว่าเวรไหนมีคนรับแล้ว และเก็บผลรวมที่ดีที่สุดที่เจอ ก่อนลงไปต่อ ให้ประมาณแบบมองโลกในแง่ดีว่าครูที่เหลือแต่ละคนจะได้เวรที่ตัวเองเหนื่อยน้อยที่สุดในบรรดาเวรที่ยังว่าง (ไม่สนว่าจะชนกัน) ถ้าผลรวมตอนนี้บวกค่าประมาณนี้ไม่น้อยกว่าคำตอบที่ดีที่สุด ตัดกิ่งได้ อีกเรื่องที่ช่วยมากคือให้ครูแต่ละคนลองเวรที่เหนื่อยน้อยไปมาก จะได้คำตอบดีๆ เร็ว แล้วกิ่งที่เหลือถูกตัดง่ายขึ้น เรียงลำดับเวรของครูแต่ละคนไว้ก่อนครั้งเดียว</p>'''
