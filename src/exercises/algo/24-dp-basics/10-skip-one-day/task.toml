title = "ตัดวันแย่ทิ้งได้หนึ่งวัน"
level = 3
time_limit = 1
source = "แนวเดียวกับโจทย์ maximum subarray sum with one deletion"
hint = '''<p>เพิ่มข้อมูลลงในสถานะว่าตัดไปแล้วหรือยัง <code>keep[i]</code> คือผลรวมมากสุดของช่วงที่จบวันที่ i โดยยังไม่ตัด ซึ่งก็คือ Kadane ในหน้า 24.4 ส่วน <code>cut[i]</code> คือผลรวมมากสุดของช่วงที่จบวันที่ i และตัดไปแล้วหนึ่งวัน มาได้สองทาง คือตัดวันที่ i เอง ได้ <code>keep[i - 1]</code> หรือตัดวันก่อนหน้าไปแล้ว ได้ <code>cut[i - 1] + a[i]</code> คำตอบคือค่ามากสุดของทั้งสองตาราง ระวัง <code>cut[1]</code> ซึ่งตัดแล้วไม่เหลือวันไหนเลย</p>'''
