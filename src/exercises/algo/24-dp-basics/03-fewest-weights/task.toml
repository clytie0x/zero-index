hint = '''<p>ทำตามหน้า 24.3 ให้ <code>fewest[x]</code> คือจำนวนตุ้มน้อยที่สุดที่รวมได้ x กรัม ตุ้มลูกสุดท้ายหนักเท่าไรก็ได้ที่ไม่เกิน x กรณีฐานคือ <code>fewest[0] = 0</code> ช่องอื่นเริ่มที่ INF ที่บวกหนึ่งแล้วไม่ล้น เช่น 10<sup>9</sup> ถ้าจบแล้ว <code>fewest[X]</code> ยังเป็น INF ให้พิมพ์ -1 หยิบตุ้มหนักสุดก่อนแบบ greedy ผิดกับตัวอย่างที่สาม งานทั้งหมดคือ X × N ไม่เกิน 10<sup>7</sup></p>'''
