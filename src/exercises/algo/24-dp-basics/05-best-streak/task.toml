hint = '''<p>ใช้ Kadane ในหน้า 24.4 คู่กับการจดวันเริ่มในหน้า 24.5 ให้ <code>ending[i]</code> คือผลรวมมากสุดของช่วงที่จบวันที่ i พอดี ถ้า <code>ending[i - 1]</code> ไม่ติดลบให้ต่อจากช่วงเดิม (ต่อเมื่อเป็น 0 ด้วย เพื่อให้เริ่มเร็วที่สุด) ไม่งั้นเริ่มใหม่ จดวันเริ่มไว้ทุกช่อง แล้วเปลี่ยนคำตอบเมื่อได้ผลรวมมากกว่า หรือได้เท่ากันแต่เริ่มเร็วกว่า ลองทุกคู่วันเริ่มวันจบเป็น 2 × 10<sup>10</sup> คู่ ไม่ทัน</p>'''
