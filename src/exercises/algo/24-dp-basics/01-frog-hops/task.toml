title = "กบกระโดดข้ามหิน"
level = 1
time_limit = 1
hint = '''<p>ให้ <code>ways[i]</code> คือจำนวนวิธีไปหยุดที่ก้อน i ครั้งสุดท้ายกบกระโดดมาจากก้อน i - 1 i - 2 หรือ i - 3 จึงบวกสามช่องนั้น กรณีฐานคือ <code>ways[0] = 1</code> และระวังอย่าอ่านช่องติดลบ สามค่ารวมกันเกิน <code>int</code> ได้ ให้ mod ทุกครั้งที่บวก ส่วนที่ต้องคิดเพิ่มคือคำถามมีถึงแสนข้อ แต่ทุกข้อใช้ตารางเดียวกัน ถ้าเติมตารางใหม่ทุกคำถาม งานรวมคือ Q × N ถึง 10<sup>11</sup> ไม่ทัน ให้เติมตารางครั้งเดียวถึงก้อนที่ไกลที่สุดที่ถูกถาม แล้วตอบทุกคำถามด้วยการเปิดตาราง อ่านและพิมพ์เป็นแสนบรรทัด ใช้ <code>ios::sync_with_stdio(false)</code> กับ <code>'\n'</code></p>'''
