hint = '''<p>รู้แค่ว่าอยู่ขั้นไหนยังไม่พอ ต้องรู้ด้วยว่าก้าวล่าสุดยาวเท่าไร จึงจะรู้ว่าก้าวต่อไปห้ามยาวเท่าไร ให้สถานะเป็นสองค่า <code>ways[i][j]</code> คือจำนวนวิธีไปหยุดที่ขั้น i โดยก้าวสุดท้ายยาว j ขั้น ก้าวก่อนหน้าต้องไม่ยาว j จึงบวก <code>ways[i - j][k]</code> ทุก k ที่ไม่เท่ากับ j ส่วนก้าวแรกจากพื้นไม่มีก้าวก่อนหน้า ให้นับเป็นกรณีฐาน สถานะมี 3N ตัว งานต่อสถานะไม่เกิน 3</p>'''
