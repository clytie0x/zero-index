hint = '''<p>ให้ <code>tired[i]</code> คือความเหนื่อยรวมน้อยที่สุดที่ไปหยุดที่ขั้น i ได้ ก้าวสุดท้ายมาจากขั้น i - 1 หรือ i - 2 จึงได้ <code>c[i] + min(tired[i - 1], tired[i - 2])</code> กรณีฐานคือพื้นซึ่งไม่เหนื่อยเลย การเลือกก้าวไปขั้นที่เหนื่อยน้อยกว่าทีละก้าวแบบ greedy ผิดได้ ลองกับตัวอย่างที่สอง และผลรวมถึง 2 × 10<sup>14</sup> ต้องใช้ <code>long long</code></p>'''
