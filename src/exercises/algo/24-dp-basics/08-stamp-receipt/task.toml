hint = '''<p>เติม <code>fewest[x]</code> แบบข้อตุ้มน้ำหนักก่อน แล้วเดินย้อนจาก X ตามหน้า 24.5 ที่ x บาท ลองแสตมป์จากราคาแพงไปถูก เลือกดวงแรกที่ <code>fewest[x - p]</code> เท่ากับ <code>fewest[x] - 1</code> แบบนี้ได้ดวงแพงที่สุดเท่าที่ยังใช้จำนวนดวงน้อยสุดได้ และดวงที่ได้ทีหลังไม่มีทางแพงกว่าดวงก่อน รายการจึงเรียงจากมากไปน้อยเองและตรงกับกติกาในโจทย์ ถ้าเก็บรายการทั้งชุดไว้ทุกช่องจะช้าและเปลืองหน่วยความจำเกินไป</p>'''
