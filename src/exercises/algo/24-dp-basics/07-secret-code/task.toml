source = "แนวเดียวกับโจทย์ decode ways"
hint = '''<p>ให้ <code>ways[i]</code> คือจำนวนวิธีถอดรหัสตัวเลข i ตัวแรก ตัวอักษรสุดท้ายมาจากตัวเลขหนึ่งหลัก (ตัวที่ i ต้องไม่ใช่ 0) หรือสองหลัก (ตัวที่ i - 1 กับ i ต้องเป็น 10 ถึง 26) จึงบวก <code>ways[i - 1]</code> กับ <code>ways[i - 2]</code> เฉพาะกรณีที่ใช้ได้ กรณีฐาน <code>ways[0] = 1</code> ระวังเลข 0 เช่น 06 ไม่ใช่ตัว F และ 30 ถอดไม่ได้เลย</p>'''
