hint = '''<p>เริ่มจากโปรแกรม brackets ในหน้า 14.4 แต่ให้ stack เก็บ<strong>ตำแหน่ง</strong>ของวงเล็บเปิดแทนตัววงเล็บ จะรู้ทั้งชนิดของมัน (ดูจากสูตรที่ตำแหน่งนั้น) และรู้ว่ามันอยู่ตรงไหน ถ้าจบแล้วยังมีของค้าง วงเล็บเปิดตัวซ้ายสุดที่ค้างอยู่คือตัวที่อยู่ก้น stack ซึ่งก็คือช่อง 0 ตัวอักษรที่ไม่ใช่วงเล็บข้ามไปได้เลย สูตรยาวได้แสนตัว อาเรย์ของสูตรกับ stack ต้องมีอย่างน้อย 100001 ช่อง และอย่าลืมเริ่ม stack ว่างใหม่ทุกสูตร</p>'''
