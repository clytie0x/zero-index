title = "ตึกที่สูงกว่าหลังแรก"
level = 3
time_limit = 1
source = "แนวเดียวกับโจทย์ next greater element ที่ใช้สอน stack ในค่าย"
hint = '''<p>ไล่หาไปทางขวาจากทุกตึก ถ้าตึกเรียงจากสูงไปเตี้ย ทุกหลังต้องไล่จนสุดถนน ห้าแสนหลังเป็นงานราว 10<sup>11</sup> ก้าว ไม่ทัน ลองกลับมุมมอง เดินจากซ้ายไปขวา แล้วเก็บ stack ของ<strong>ตึกที่ยังหาคำตอบไม่เจอ</strong> สังเกตว่าตึกพวกนี้ในเวลาใดก็ตาม เรียงจากก้น stack ขึ้นมาไม่เคยสูงขึ้น เมื่อเจอตึกหลังใหม่ ตราบใดที่ตึกบนสุดของ stack เตี้ยกว่าตึกหลังใหม่ คำตอบของตึกบนสุดคือหลังใหม่นี้ ให้ pop ออก แล้วค่อย push หลังใหม่ ตึกที่เหลือใน stack ตอนจบไม่มีคำตอบ ตอบ 0 ตึกแต่ละหลังถูก push และ pop อย่างละไม่เกินหนึ่งครั้ง ให้ stack เก็บหมายเลขตึก ไม่ใช่ความสูง</p>'''
