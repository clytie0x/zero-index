hint = '''<p>ใช้ stack ด้วยอาเรย์กับตัวแปร <code>size</code> แบบหน้า 14.4 อาเรย์ต้องมีอย่างน้อยแสนช่อง เพราะอาจเป็นคำสั่ง <code>PUSH</code> ทั้งหมด อ่านชื่อคำสั่งด้วย <code>%s</code> แล้วเทียบด้วย <code>strcmp</code> จากหน้า 6.4 อ่าน x เฉพาะเมื่อเป็น <code>PUSH</code> และก่อน <code>POP</code> หรือ <code>TOP</code> ต้องเช็กว่า <code>size</code> เป็น 0 หรือไม่ก่อนทุกครั้ง</p>'''
