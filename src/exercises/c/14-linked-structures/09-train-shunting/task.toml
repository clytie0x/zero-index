hint = '''<p>ถ้าเก็บขบวนในอาเรย์ แต่ละคำสั่งต้องหาตำแหน่งของตู้ x แล้วเลื่อนตู้ครึ่งขบวน คำสั่งสองแสนครั้งกับขบวนแสนตู้ไม่ทันแน่นอน หมายเลขตู้ไม่ซ้ำกันและไม่เกินสามแสน จึงใช้หมายเลขตู้เป็น index ของ node ได้เลย ทำลิสต์สองทางด้วย <code>prev[]</code> กับ <code>next[]</code> ขนาด 300001 ช่อง ให้ node 0 เป็นหัวขบวนปลอมแบบโปรแกรม line-up ในหน้า 14.3 คำสั่ง <code>I 0 y</code> ก็คือแทรกหลัง node 0 พอดี ไม่ต้องเขียนกรณีพิเศษ ส่วนตู้ที่เคยถูกปลดแล้วกลับมา <code>prev</code> กับ <code>next</code> ของมันถูกตั้งใหม่ตอนแทรกอยู่แล้ว</p>'''
