title = "สำรับไพ่ของนักมายากล"
level = 1
hint = '''<p>สำรับที่เพิ่มและหยิบได้ทั้งสองด้านคือ deque ในหน้า 14.5 ให้ด้านบนเป็นหัวคิว ด้านล่างเป็นท้ายคิว ไพ่ในสำรับพร้อมกันมีไม่เกินแสนใบ จึงใช้ circular queue ขนาดแสนช่องได้ ระวังสูตรถอยหลัง ต้องเป็น <code>(head - 1 + capacity) % capacity</code> ส่วนบรรทัดสุดท้ายให้เดินจาก <code>head</code> ไป <code>count</code> ใบ โดยใช้ <code>(head + i) % capacity</code></p>'''
