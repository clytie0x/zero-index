title = "ส่งลูกบอล"
level = 2
time_limit = 1
source = "แนวเดียวกับปัญหา Josephus ที่ใช้ฝึก queue"
hint = '''<p>ให้วงเป็น queue หัวคิวคือคนที่ถือลูกบอล การส่งลูกบอลหนึ่งครั้งคือเอาหัวคิวไปต่อท้าย ส่วนคนที่ออกคือ dequeue ทิ้ง แต่ถ้าส่งครบ K - 1 ครั้งจริงๆ เมื่อ K เป็นพันล้านจะไม่ทันเวลา สังเกตว่าวงที่มี m คน ส่งครบ m ครั้งลูกบอลกลับมาที่เดิม จึงส่งแค่ <code>(K - 1) % m</code> ครั้งก็พอ คนเข้าคิวรวมกันได้หลายล้านครั้ง แต่ในคิวมีพร้อมกันไม่เกิน N คน ใช้ circular queue ขนาด N ช่องตามหน้า 14.5</p>'''
