hint = '''<p>ใช้ queue ด้วยอาเรย์แบบแรกของหน้า 14.5 คนเข้าแถวรวมกันไม่เกินแสนคน อาเรย์แสนช่องจึงพอโดยไม่ต้องวนกลับ คำสั่ง <code>RIDE k</code> ให้เอาคนออกทีละคนจนกว่าจะครบ k คน <strong>หรือ</strong>แถวว่าง อย่าวนครบ k รอบโดยไม่ดูว่าแถวหมดหรือยัง และระวังช่องว่างเกินท้ายบรรทัด</p>'''
