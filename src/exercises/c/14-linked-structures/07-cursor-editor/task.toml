title = "เคอร์เซอร์"
level = 2
time_limit = 1
source = "แนวเดียวกับโจทย์ keylogger ที่ใช้ฝึก stack สองตัว"
hint = '''<p>ถ้าเก็บข้อความในอาเรย์เดียวแล้วแทรกหรือลบด้วยการเลื่อนแบบหน้า 5.5 บันทึกอย่าง <code>a&lt;b&lt;c&lt;...</code> ที่พิมพ์หน้าสุดทุกครั้ง จะต้องเลื่อนรวมกันราว 5 × 10<sup>11</sup> ครั้ง ไม่ทัน ให้มองว่าเคอร์เซอร์แบ่งข้อความเป็นสองส่วน แล้วเก็บแต่ละส่วนใน stack ของตัวเอง ส่วนซ้ายมีตัวบนสุดเป็นตัวที่ติดเคอร์เซอร์ทางซ้าย ส่วนขวามีตัวบนสุดเป็นตัวที่ติดเคอร์เซอร์ทางขวา พิมพ์คือ push ลง stack ซ้าย ลบคือ pop จาก stack ซ้าย เลื่อนเคอร์เซอร์คือย้ายตัวบนสุดข้าม stack ตอนพิมพ์ผล stack ซ้ายพิมพ์จากก้นขึ้นบน stack ขวาพิมพ์จากบนลงก้น ทั้งบันทึกและ stack ยาวได้สองล้านตัว ต้องประกาศไว้นอก <code>main</code></p>'''
