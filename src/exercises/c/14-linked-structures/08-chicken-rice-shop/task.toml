title = "ร้านข้าวมันไก่"
level = 3
time_limit = 1
hint = '''<p>เก็บเวลาที่แม่ครัวจะทำจานปัจจุบันเสร็จไว้ในตัวแปร <code>finish</code> และเก็บลูกค้าที่นั่งรอเป็น queue ของหมายเลขลูกค้า เมื่อลูกค้าคนใหม่มาถึงที่เวลา t ให้วนก่อนว่า ถ้ามีคนรอและ <code>finish</code> ไม่เกิน t คนหัวแถวได้เริ่มทำจานที่เวลา <code>finish</code> เขาจึงได้จานที่เวลา <code>finish + s</code> ทำซ้ำจนแถวว่างหรือ <code>finish</code> เกิน t จากนั้นค่อยตัดสินคนใหม่ตามกฎ จบวันแล้วอย่าลืมทำจานให้คนที่ยังรออยู่ให้ครบ เวลารวมเกิน <code>int</code> ได้ เพราะทำต่อกันแสนจาน จานละแสนนาที ใช้ <code>long long</code> คิวมีคนรอพร้อมกันไม่เกิน K คน จะใช้ circular queue ขนาด K แบบร้านชานมในหน้า 14.5 ก็ได้</p>'''
