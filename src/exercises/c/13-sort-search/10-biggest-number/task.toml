title = "ต่อบัตรให้ได้เลขมากที่สุด"
level = 3
time_limit = 1
hint = '''<p>ผลยาวได้ถึงล้านหลัก เก็บเป็นตัวเลขไม่ได้ ให้รับบัตรแต่ละใบเป็นสตริง แล้วคิดว่าบัตร a ควรวางก่อนบัตร b เมื่อไร การเรียงตามค่าตัวเลขผิด เพราะ 9 ต้องมาก่อน 30 ส่วนการเรียงตาม <code>strcmp</code> อย่างเดียวก็ผิด ลองบัตร <code>3</code> กับ <code>30</code> ดู ให้ลองต่อทั้งสองแบบ คือ a ตามด้วย b และ b ตามด้วย a แบบไหนได้มากกว่าก็เลือกแบบนั้น สองแบบยาวเท่ากันจึงเทียบด้วย <code>strcmp</code> ได้เลย เขียนเป็นฟังก์ชันเปรียบเทียบของ <code>qsort</code> ตามหน้า 13.4 แล้วอย่าลืมกรณีที่บัตรเป็น 0 ทุกใบ</p>'''
