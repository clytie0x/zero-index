hint = '''<p>เก็บแต่ละคนเป็น struct แล้วเรียงด้วย <code>qsort</code> ตามสามเงื่อนไขแบบหน้า 13.4 เงื่อนไขแรกที่ต่างกันเป็นตัวตัดสิน ห้ามลบกันในฟังก์ชันเปรียบเทียบ หลังเรียงแล้วไล่คำนวณอันดับ คนแรกได้อันดับ 1 คนต่อไปถ้าจำนวนข้อและเวลาปรับเท่ากับคนก่อนหน้าให้ได้อันดับเดียวกับคนก่อนหน้า ไม่อย่างนั้นได้อันดับเท่ากับตำแหน่งของตัวเองในตาราง (เริ่มนับจาก 1) N ถึงห้าหมื่น bubble sort ไม่ทัน</p>'''
