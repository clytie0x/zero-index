hint = '''<p>สองคำเป็นคู่สลับอักษรกันก็ต่อเมื่อเรียงตัวอักษรในคำแล้วได้คำเดียวกัน เช่น <code>listen</code> และ <code>silent</code> เรียงแล้วได้ <code>eilnst</code> ทั้งคู่ คำยาวไม่เกิน 8 ตัว เรียงตัวอักษรด้วย insertion sort ได้สบาย จากนั้นเรียงคำที่ได้ทั้งหมดด้วย <code>qsort</code> กับ <code>strcmp</code> แบบหน้า 13.4 คำที่เหมือนกันจะอยู่ติดกัน กลุ่มที่มี c คำจับคู่ได้ c × (c - 1) / 2 คู่ ผลรวมอาจเกิน <code>int</code></p>'''
