hint = '''<p>เทียบทุกคู่ต้องทำราว 5 × 10<sup>9</sup> ครั้ง ไม่ทัน ถ้าเรียงแล้ว คู่ที่ใกล้กันที่สุดต้องอยู่ติดกันเสมอ ดูแค่ N - 1 คู่ที่ติดกันพอ มีสามจุดที่ต้องระวัง หนึ่ง ค่าถึง ±2 × 10<sup>9</sup> ฟังก์ชันเปรียบเทียบของ <code>qsort</code> ห้ามใช้ <code>return x - y</code> ตามหน้า 13.4 สอง ผลต่างอาจถึง 4 × 10<sup>9</sup> ต้องคำนวณเป็น <code>long long</code> และสาม ถ้าระยะน้อยสุดเป็น 0 สถานีที่เวลาเท่ากัน c สถานีจับคู่กันได้ c × (c - 1) / 2 คู่ ไม่ใช่แค่คู่ที่ติดกัน และจำนวนคู่อาจเกิน <code>int</code></p>'''
