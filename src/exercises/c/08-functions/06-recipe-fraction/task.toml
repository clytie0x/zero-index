title = "รวมสูตรขนม"
level = 2
hint = '''<p>รับเศษส่วนด้วย <code>scanf("%d/%d", ...)</code> แบบตัวคั่นในหน้า 2.3 เก็บผลรวมไว้เป็น p/q เริ่มที่ 0/1 แล้วบวกทีละตัวด้วยสูตร p/q + a/b = (p × b + a × q)/(q × b) <strong>หลังบวกทุกครั้ง</strong> ให้หารทั้ง p และ q ด้วย <code>gcd(p, q)</code> ของหน้า 8.5 ถ้ารอทำอย่างต่ำตอนท้ายทีเดียว ส่วนจะเป็นผลคูณของตัวส่วนทั้ง 20 ตัว ซึ่งล้น <code>long long</code> ได้ ระหว่างทาง p × b และ q × b ก็เกิน <code>int</code> ได้ จึงต้องใช้ <code>long long</code> ทั้ง p q และพารามิเตอร์ของ <code>gcd</code></p>'''
