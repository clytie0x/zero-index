hint = '''<p>เขียน <code>int digit_sum(int n)</code> ที่ใช้ <code>% 10</code> กับ <code>/= 10</code> แบบหน้า 4.5 แล้ว <code>main</code> ทำแค่หาค่ามากสุดแบบหน้า 5.2 โดยเก็บทั้งเลขตั๋วและผลบวกของใบที่ดีที่สุดไว้ ตอนผลบวกเท่ากัน ต้องเทียบเลขตั๋วด้วย ใบที่มาก่อนไม่ได้ชนะเสมอไป และอย่าลืมตั๋วเลข 0 ซึ่งผลบวกเป็น 0</p>'''
