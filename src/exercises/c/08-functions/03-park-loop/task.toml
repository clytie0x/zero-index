hint = '''<p>เก็บพิกัดไว้ในอาเรย์ แล้วเขียน <code>double distance(int x1, int y1, int x2, int y2)</code> แบบหน้า 8.5 จุดถัดจากจุดที่ i คือจุดที่ i + 1 ยกเว้นจุดสุดท้ายที่ต้องกลับไปจุดแรก ใช้ <code>(i + 1) % n</code> จะได้ตำแหน่งถัดไปแบบวนรอบโดยไม่ต้องแยกกรณี อย่าลืมช่วงขากลับ ตัวอย่างแรกมีช่วงขากลับยาว 4 เมตร และพิมพ์ด้วย <code>%.2f</code></p>'''
