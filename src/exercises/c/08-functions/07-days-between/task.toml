title = "นับวันระหว่างสองวันที่"
level = 3
time_limit = 1
hint = '''<p>เดินทีละวันแบบข้อวันพรุ่งนี้ในบทที่ 3 ถูกต้อง แต่คำถามหนึ่งข้ออาจห่างกันถึงสองแสนกว่าวัน คูณกับแสนคำถามแล้วช้าเกินไป ให้เปลี่ยนวันที่ทุกวันเป็นเลขลำดับวันนับจากวันที่ 1 มกราคม 1900 แทน แล้วคำตอบคือเลขลำดับของวันจบลบเลขลำดับของวันเริ่ม แบ่งเป็นสามฟังก์ชัน <code>is_leap(year)</code> <code>days_in_month(month, year)</code> และ <code>day_number(day, month, year)</code> ที่บวกจำนวนวันของทุกปีก่อนหน้า ทุกเดือนก่อนหน้าในปีนั้น แล้วบวก day ทดสอบกับ 28 กุมภาพันธ์ถึง 1 มีนาคมของปี 1900 2000 และ 2024</p>'''
