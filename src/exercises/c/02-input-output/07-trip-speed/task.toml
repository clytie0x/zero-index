title = "ความเร็วเฉลี่ย"
level = 3
hint = '''<p>แปลงเวลาทั้งสองเป็นนาทีนับจากเที่ยงคืน ผลต่างคือเวลาที่ใช้เป็นนาที บรรทัดแรกพิมพ์ด้วย <code>"%d:%02d"</code> ส่วนความเร็ว ระวังกับดักหารจำนวนเต็ม ถ้าคิดชั่วโมงด้วย <code>minutes / 60</code> การเดินทาง 45 นาทีจะกลายเป็น 0 ชั่วโมง ให้ใช้ <code>distance * 60 / minutes</code> ซึ่ง <code>distance</code> เป็น <code>double</code> อยู่แล้ว</p>'''
