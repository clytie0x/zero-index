hint = '''<p>ราคามีทศนิยม จึงรับด้วย <code>%lf</code> ใส่ <code>double</code> ใบเสร็จทุกบรรทัดใช้ความกว้างชุดเดียวกัน หัวตารางใช้ <code>"%-10s%5s%12s\n"</code> แถวสินค้าใช้ <code>%-10s</code> <code>%5d</code> <code>%12.2f</code> ส่วนบรรทัด Total คือ <code>%-15s</code> เพราะต้องกินที่ของสองคอลัมน์แรกรวมกัน 10 + 5 ตัว</p>'''
