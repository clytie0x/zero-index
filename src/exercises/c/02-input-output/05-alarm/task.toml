title = "ตั้งปลุก"
level = 2
hint = '''<p>รับเวลาด้วย <code>"%d:%d"</code> แล้วแปลงเป็นนาทีนับจากเที่ยงคืน บวก K เข้าไป หนึ่งวันมี 1440 นาที เศษจากการหารด้วย 1440 คือนาทีนับจากเที่ยงคืนของวันที่นาฬิกาปลุก ไม่ต้องใช้ <code>if</code> สุดท้ายแปลงกลับเป็นชั่วโมงกับนาที แล้วพิมพ์ด้วย <code>%02d</code></p>'''
