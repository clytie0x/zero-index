title = "เวลารวมสามรอบ"
level = 3
hint = '''<p>รับแต่ละรอบด้วย <code>"%d:%d.%d"</code> <code>%d</code> อ่าน <code>070</code> เป็น 70 ได้ถูกต้อง แปลงทุกรอบเป็นมิลลิวินาที (1 นาทีมี 60000 มิลลิวินาที) แล้วรวมกัน จากนั้นแยกกลับด้วย <code>/</code> กับ <code>%</code> แบบแปลงวินาทีในบทที่ 1 ตอนพิมพ์ วินาทีใช้ <code>%02d</code> มิลลิวินาทีใช้ <code>%03d</code> ไม่อย่างนั้น 70 มิลลิวินาทีจะออกมาเป็น <code>.70</code></p>'''
