title = "วันที่แบบไทย"
level = 1
hint = '''<p>ใส่เครื่องหมาย <code>-</code> ไว้ในข้อความแม่แบบของ <code>scanf</code> ให้ตรงกับข้อมูลเข้า แบบเดียวกับ <code>"%d/%d/%d"</code> ในหน้า 2.3 ถ้าเขียน <code>"%d %d %d"</code> เดือนกับวันจะติดลบ เพราะ <code>%d</code> อ่าน <code>-10</code> เป็นเลขลบได้ ส่วนผลลัพธ์ใช้ <code>%02d</code> กับวันและเดือน</p>'''
