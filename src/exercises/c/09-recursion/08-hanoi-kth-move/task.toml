title = "ฮานอยครั้งที่ K"
level = 3
time_limit = 1
hint = '''<p>ไล่ย้ายจริงไปจนถึงครั้งที่ K ไม่ทัน เพราะ K ถึงราว 10<sup>18</sup> ให้ใช้โครงของวิธีย้ายแทน การย้าย n แผ่นมีสามช่วง ช่วงแรกคือย้าย n - 1 แผ่นซึ่งใช้ 2<sup>n-1</sup> - 1 ครั้ง ครั้งถัดมาคือครั้งที่ 2<sup>n-1</sup> ซึ่งย้ายแผ่นที่ n และช่วงสุดท้ายคือย้าย n - 1 แผ่นอีกรอบ ดูว่า K ตกช่วงไหน ถ้าตกช่วงแรกหรือช่วงสุดท้าย ปัญหาเล็กลงเหลือ n - 1 แผ่น โดยหลักสลับบทบาทแบบในหน้า 9.5 และช่วงสุดท้ายต้องลบ 2<sup>n-1</sup> ออกจาก K ก่อน เก็บ 2<sup>i</sup> ไว้ในอาเรย์ <code>long long</code> ด้วยลูปคูณสองตั้งแต่ต้น แล้วรับ K ด้วย <code>%lld</code></p>'''
