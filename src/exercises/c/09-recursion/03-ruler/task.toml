title = "ขีดบนไม้บรรทัด"
level = 1
hint = '''<p>นิยามในโจทย์เป็น recursion อยู่แล้ว แปลงเป็นฟังก์ชัน <code>ruler(k)</code> ที่เรียก <code>ruler(k - 1)</code> พิมพ์ขีด k ตัว แล้วเรียก <code>ruler(k - 1)</code> อีกครั้ง ถ้าให้กรณีฐานเป็น k = 0 ที่ไม่พิมพ์อะไรเลย ไม่ต้องเขียนระดับ 1 แยก เพราะระดับ 1 จะกลายเป็นว่างหนึ่งรอบ ขีดหนึ่งตัว ว่างอีกหนึ่งรอบ ลองเทียบกับโครงของหอคอยฮานอยในหน้า 9.5</p>'''
