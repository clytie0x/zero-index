hint = '''<p>ให้ <code>ways(i)</code> คือจำนวนวิธีเดินจากพื้นไปถึงขั้น i พอดี ก้าวสุดท้ายมาจากขั้น i - 1 i - 2 หรือ i - 3 จึงได้ <code>ways(i - 1) + ways(i - 2) + ways(i - 3)</code> กรณีฐานคือ i ติดลบได้ 0 วิธี ขั้นที่ชำรุดได้ 0 วิธี และพื้นคือขั้น 0 ได้ 1 วิธี เขียนตรงๆ จะเรียกตัวเองซ้ำแบบฟีโบนัชชีในหน้า 9.3 และช้าเกินเมื่อ n ถึง 70 ต้องจดคำตอบลงอาเรย์ <code>long long</code> ระวังให้ดี คำตอบของขั้นหนึ่งเป็น 0 ได้บ่อย ถ้าใช้ 0 แทนคำว่ายังไม่ได้คำนวณ ขั้นที่คำตอบเป็น 0 จะถูกคำนวณใหม่ทุกครั้ง ใช้ -1 แบบในหน้า 9.3</p>'''
