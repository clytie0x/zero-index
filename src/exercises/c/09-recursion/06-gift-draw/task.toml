hint = '''<p>ใช้โครงการเรียงสับเปลี่ยนในหน้า 9.5 ทั้งหมด ตำแหน่ง pos คือคนที่ pos + 1 และค่า v ที่เลือกคือเจ้าของของขวัญที่เขาได้ เพิ่มเงื่อนไขเดียว คือห้ามเลือก v ที่เท่ากับ pos + 1 ลูปลอง v จากน้อยไปมาก ผลจะเรียงตามโจทย์เอง นับจำนวนแบบที่พิมพ์ไว้ด้วย ถ้าจบแล้วยังเป็น 0 ค่อยพิมพ์ <code>none</code> ลองคิดว่า n = 1 ได้กี่แบบ</p>'''
