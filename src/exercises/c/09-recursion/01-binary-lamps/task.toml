title = "ป้ายไฟเลขฐานสอง"
level = 1
hint = '''<p>หลักขวาสุดของเลขฐานสองคือ <code>n % 2</code> ส่วนหลักที่เหลือทางซ้ายทั้งหมดคือเลขฐานสองของ <code>n / 2</code> ปัญหาคือหลักขวาสุดหาได้ก่อน แต่ต้องพิมพ์ทีหลัง ใช้วิธีพิมพ์ตอนขากลับแบบ <code>dive</code> ในหน้า 9.1 คือเรียกตัวเองกับ <code>n / 2</code> ก่อน แล้วค่อยพิมพ์ <code>n % 2</code> ระวังสองเรื่อง N ถึง 10<sup>18</sup> ต้องใช้ <code>long long</code> และ N = 0 ต้องพิมพ์ <code>0</code> ไม่ใช่บรรทัดว่าง ลองให้กรณีฐานคือ n น้อยกว่า 2</p>'''
