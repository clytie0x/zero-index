hint = '''<p>ความยาวของชิ้นต้องหารความยาวของทุกม้วนลงตัว และยาวที่สุด นั่นคือ ห.ร.ม. ของทุกม้วน ใช้ <code>gcd</code> แบบยุคลิดในหน้า 9.2 กับสองม้วนแรก แล้วเอาผลไปหา ห.ร.ม. กับม้วนที่สาม ไล่ไปเรื่อยๆ ด้วยลูป อย่าเขียนการไล่ทั้งอาเรย์เป็น recursion เพราะ N ถึงแสนจะลึกเกินที่ stack รับได้ตามหน้า 9.4 จำนวนชิ้นรวมใหญ่ได้ถึง 10<sup>14</sup> ต้องใช้ <code>long long</code> ส่วนวิธีไล่ลองทุกความยาวจากม้วนที่สั้นที่สุดลงมา ต้องลองเกือบพันล้านความยาวเมื่อทุกม้วนยาวเกือบพันล้าน ไม่ทันเวลา</p>'''
