<p>ป้ายทะเบียนเลขสามหลักสะท้อนในกระจกแล้วอ่านกลับหลัง ให้กลับลำดับหลักของเลขสามหลัก N แล้วพิมพ์ออกมาเป็นตัวเลข ถ้าผลมีเลข 0 นำหน้า ให้ตัดทิ้ง เช่น 120 กลับแล้วได้ 021 ต้องพิมพ์เป็น 21</p>

<h3>ข้อมูลเข้า</h3>
<p>จำนวนเต็ม N หนึ่งตัว โดยที่ 100 ≤ N ≤ 999</p>

<h3>ข้อมูลออก</h3>
<p>ตัวเลขที่กลับหลักแล้ว ไม่มีเลข 0 นำหน้า</p>
