title = "ผลรวมตั้งแต่ A ถึง B"
level = 3
hint = '''<p>จับคู่ตัวแรกกับตัวสุดท้าย ตัวที่สองกับตัวรองสุดท้าย ทุกคู่มีผลรวมเท่ากันคือ A + B และมีตัวเลขทั้งหมด B - A + 1 ตัว ผลรวมจึงเป็น (A + B) × (B - A + 1) / 2 ผลนี้ใหญ่ถึงประมาณ 5 × 10<sup>17</sup> ต้องใช้ <code>long long</code> และต้องคูณก่อนหาร</p>'''
