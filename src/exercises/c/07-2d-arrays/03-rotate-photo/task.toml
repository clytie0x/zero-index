title = "หมุนรูปภาพ"
level = 1
hint = '''<p>รูปใหม่มี C แถว แถว R คอลัมน์ ลองหมุนรูป 2 × 3 ด้วยมือบนกระดาษ แล้วดูว่าแถวแรกของรูปใหม่มาจากส่วนไหนของรูปเดิม จะเห็นว่ามันคือคอลัมน์แรกของรูปเดิม อ่านจากล่างขึ้นบน ไม่ต้องสร้างตารางใหม่ก็ได้ ใช้ลูปนอกเดินคอลัมน์ ลูปในเดินแถวถอยหลัง แล้วพิมพ์ทีละตัวด้วย <code>%c</code></p>'''
