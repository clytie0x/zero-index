hint = '''<p>มีตำแหน่งให้วางสี่เหลี่ยมได้ (N - K + 1) × (M - K + 1) แบบ ถ้าบวกทีละช่องทุกแบบ เมื่อ N = M = 1000 และ K = 500 ต้องบวกราว 6 × 10<sup>10</sup> ครั้ง ไม่ทัน อ่านแต่ละแถวด้วย <code>%s</code> แล้วสร้างตาราง prefix ตามหน้า 7.5 แต่ละตำแหน่งจะหาผลรวมได้ด้วยการบวกลบสี่ค่า ระวังขอบเขตของลูป มุมบนซ้ายของสี่เหลี่ยมไปได้ถึงแถว N - K + 1 และคอลัมน์ M - K + 1 พอดี และถ้าเสมอกันต้องได้ตำแหน่งที่เจอก่อน</p>'''
