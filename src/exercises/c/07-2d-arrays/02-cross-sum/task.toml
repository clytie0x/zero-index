hint = '''<p>เส้นทแยงหลักคือ <code>a[i][i]</code> เส้นทแยงรองคือ <code>a[i][N - 1 - i]</code> ตามหน้า 7.2 บรรทัดที่สามคือผลรวมของสองเส้นบวกกัน แต่ถ้า N เป็นเลขคี่ ช่องกลางถูกนับไปสองครั้ง ต้องลบออกหนึ่งครั้ง ลองกับ N = 1 ด้วย และดูขอบเขตของตัวเลขให้ดี ผลรวม 100 ตัวที่แต่ละตัวถึง 10<sup>9</sup> ใส่ <code>int</code> ไม่พอ</p>'''
