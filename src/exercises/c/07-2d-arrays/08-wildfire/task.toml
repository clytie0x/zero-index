title = "ไฟป่า"
level = 2
hint = '''<p>ทุกช่องเปลี่ยนพร้อมกัน ต้นไม้จะติดไฟเพราะช่องที่ไหม้อยู่ตอนต้นนาที ไม่ใช่ช่องที่เพิ่งติดไฟในนาทีเดียวกัน ถ้าเขียนผลลงตารางเดิม ไฟจะลามไปหลายช่องในนาทีเดียว เหมือนแบบที่ 2 ในส่วนลองทำให้พังของหน้า 7.4 ให้คิดจากตารางเดิมแล้วเขียนผลลงตารางใหม่ พอคิดครบทุกช่องแล้วค่อยคัดลอกกลับ ทำซ้ำ K รอบ</p>'''
