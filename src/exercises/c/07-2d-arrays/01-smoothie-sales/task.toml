title = "ยอดขายร้านน้ำปั่น"
level = 1
hint = '''<p>ยอดรวมของแต่ละวันคือผลรวมตามแถว ยอดรวมของแต่ละเมนูคือผลรวมตามคอลัมน์ แบบในหน้า 7.2 ระหว่างที่รวมได้ทีละตัว ให้เทียบกับค่ามากสุดที่เจอมาแล้วไปเลย ใช้ <code>&gt;</code> ไม่ใช่ <code>&gt;=</code> ถ้าเสมอกันจะได้หมายเลขที่น้อยกว่า และลองคิดว่าถ้าทุกช่องเป็น 0 โปรแกรมของน้องจะตอบวันที่เท่าไร</p>'''
