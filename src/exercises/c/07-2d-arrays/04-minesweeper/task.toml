hint = '''<p>ใช้ <code>dr</code> <code>dc</code> แบบ 8 ทิศในหน้า 7.4 นับ <code>*</code> รอบแต่ละช่อง และเช็กขอบก่อนแตะช่องข้างเคียงทุกครั้ง ช่องที่ปลอดภัยพิมพ์จำนวนด้วย <code>%d</code> ช่องที่มีทุ่นระเบิดพิมพ์ <code>*</code> ทุกตัวในแถวพิมพ์ติดกันโดยไม่เว้นวรรค แล้วขึ้นบรรทัดใหม่เมื่อจบแถว</p>'''
