hint = '''<p>อ่านอุณหภูมิวันแรกก่อนเข้าลูป ให้เป็นทั้งค่ามากสุดและน้อยสุด และจำว่าเป็นวันที่ 1 แล้วค่อยวนวันที่ 2 ถึง N อย่าเริ่มค่ามากสุดที่ 0 เพราะอุณหภูมิติดลบได้ทุกวัน และถ้าเจอค่าเท่ากับค่ามากสุดเดิม ต้องไม่เปลี่ยนวัน จึงใช้ <code>&gt;</code> ไม่ใช่ <code>&gt;=</code></p>'''
