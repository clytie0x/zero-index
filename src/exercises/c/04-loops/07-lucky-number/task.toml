title = "เลขนำโชค"
level = 2
hint = '''<p>ลูปข้างนอกวนตราบที่เลขยังมีตั้งแต่สองหลักขึ้นไป (<code>n &gt;= 10</code>) ลูปข้างในหาผลรวมของหลักด้วย <code>% 10</code> กับ <code>/= 10</code> แล้วให้ผลรวมกลายเป็น n ตัวใหม่ N ใหญ่ถึง 10<sup>18</sup> ต้องใช้ <code>long long</code> และ <code>%lld</code> พิมพ์ N ตัวแรกก่อนเข้าลูป แล้วตัวถัดไปพิมพ์ช่องว่างนำหน้า</p>'''
