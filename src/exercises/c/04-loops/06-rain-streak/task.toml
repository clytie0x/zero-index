title = "ฝนตกติดกัน"
level = 2
hint = '''<p>ไม่รู้ว่ามีกี่วัน ให้อ่านด้วย <code>while (scanf("%d", &amp;rain) == 1)</code> ใช้ตัวแปร <code>streak</code> นับว่าตอนนี้ฝนตกติดกันมากี่วันแล้ว วันที่ฝนตกเพิ่ม 1 วันที่ไม่ตกตั้งกลับเป็น 0 และเทียบกับค่ามากสุด<strong>ทุกวันที่ฝนตก</strong> ไม่ใช่เฉพาะวันที่ช่วงฝนจบ ลองกับข้อมูลที่ฝนตกทุกวันดูว่าได้คำตอบถูกไหม</p>'''
