title = "เพชรกลวง"
level = 2
hint = '''<p>แบ่งเป็นครึ่งบน N แถวกับครึ่งล่าง N - 1 แถว เขียนตารางของครึ่งบนก่อน แถวที่ i มีช่องว่างนำหน้า N - i ช่อง ตามด้วยดาว แล้วถ้า i มากกว่า 1 มีช่องว่างตรงกลาง 2i - 3 ช่องและดาวอีกดวง ครึ่งล่างคือครึ่งบนกลับหัวโดยไม่มีแถวที่ N ซ้ำ ลองให้ลูปวนแถว r จาก 1 ถึง 2N - 1 แล้วคำนวณว่าแถว r ตรงกับแถว i ไหนของครึ่งบน</p>'''
