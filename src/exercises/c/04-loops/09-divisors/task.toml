title = "ตัวหารของเลขใหญ่"
level = 3
time_limit = 1
hint = '''<p>ลองหาร 1 ถึง N ต้องวนถึง 10<sup>12</sup> รอบ ไม่ทันแน่นอน ตัวหารมาเป็นคู่ i กับ N / i และตัวที่เล็กกว่าในคู่ไม่เกิน √N จึงวนแค่ <code>i * i &lt;= n</code> พอ เจอ i ที่หารลงตัวก็ได้ตัวหารสองตัวคือ i กับ N / i ยกเว้นตอนที่สองตัวนี้เท่ากัน ให้นับครั้งเดียว ผลรวมของตัวหารเกิน <code>int</code> ได้ ใช้ <code>long long</code> ทั้ง N ตัวนับ และผลรวม</p>'''
