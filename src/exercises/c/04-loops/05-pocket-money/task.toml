title = "บัญชีค่าขนม"
level = 1
hint = '''<p>ไม่รู้ว่ามีกี่รายการ จึงใช้ <code>while (1)</code> อ่านทีละตัว ถ้าเป็น 0 ให้ <code>break</code> ก่อนนำไปใช้ ถ้ามากกว่า 0 บวกเข้ารายรับ ถ้าน้อยกว่า 0 บวกเข้ารายจ่าย โดยเปลี่ยนเป็นค่าบวกก่อน เช่น <code>spent -= amount</code> ลองนึกด้วยว่าถ้าข้อมูลมีแค่ 0 ตัวเดียว ต้องพิมพ์อะไร</p>'''
