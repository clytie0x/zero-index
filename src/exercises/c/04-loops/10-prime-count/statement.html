<p>จำนวนเฉพาะคือจำนวนเต็มที่มากกว่า 1 และมีตัวหารที่เป็นจำนวนเต็มบวกแค่ 1 กับตัวมันเอง เช่น 2 3 5 7 11 ให้นับว่าตั้งแต่ A ถึง B (รวม A และ B) มีจำนวนเฉพาะทั้งหมดกี่ตัว</p>

<h3>ข้อมูลเข้า</h3>
<p>บรรทัดเดียว มีจำนวนเต็ม A และ B คั่นด้วยช่องว่าง (1 ≤ A ≤ B ≤ 10<sup>6</sup>)</p>

<h3>ข้อมูลออก</h3>
<p>จำนวนของจำนวนเฉพาะที่อยู่ในช่วง A ถึง B</p>
