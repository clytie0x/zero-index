title = "นับจำนวนเฉพาะในช่วง"
level = 3
time_limit = 1
hint = '''<p>ใช้ลูปข้างนอกไล่ทุกเลข x จาก A ถึง B แล้วลูปข้างในตรวจว่า x เป็นจำนวนเฉพาะไหม ถ้าลูปข้างในลองหารถึง x - 1 จำนวนเฉพาะแต่ละตัวต้องวนเกือบ x รอบ ช่วง 1 ถึง 10<sup>6</sup> มีจำนวนเฉพาะเกือบแปดหมื่นตัว รวมแล้วหลายหมื่นล้านรอบ ให้ลองหารแค่ <code>i * i &lt;= x</code> และ <code>break</code> ทันทีที่เจอตัวหาร อย่าลืมว่า 1 ไม่ใช่จำนวนเฉพาะ</p>'''
