hint = '''<p>หลัง N ชั่วโมงมีแบคทีเรีย A<sup>N</sup> ตัว ลูปคูณ N รอบไม่ทันเมื่อ N ถึง 10<sup>18</sup> ใช้ยกกำลังแบบเร็วในหน้า 12.1 หรือหน้า 12.3 ซึ่งวนแค่ราว 60 รอบต่อคำถาม A ใหญ่ถึง 10<sup>18</sup> ต้อง mod ก่อนเริ่มคูณ ไม่อย่างนั้นผลคูณจะล้น <code>long long</code> และ N = 0 ต้องได้ 1</p>'''
