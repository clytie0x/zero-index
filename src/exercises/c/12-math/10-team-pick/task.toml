title = "ทีมที่มีผู้หญิง"
level = 3
time_limit = 1
hint = '''<p>นับทีมที่ต้องการตรงๆ ยาก ให้นับกลับด้าน ทีมทั้งหมดคือ C(N + M, K) ทีมที่ไม่มีผู้หญิงเลยคือเลือกจากผู้ชายล้วน C(N, K) ซึ่งเป็น 0 ถ้า K &gt; N คำตอบคือผลต่างของสองค่านี้ สร้างสามเหลี่ยมปาสกาลแบบ mod ในหน้า 12.4 ถึงแถวที่ 2000 ครั้งเดียว แล้วตอบทุกคำถามจากตาราง อย่าลืมว่าผลต่างหลัง mod อาจติดลบ ต้องบวก MOD กลับตามหน้า 12.1</p>'''
