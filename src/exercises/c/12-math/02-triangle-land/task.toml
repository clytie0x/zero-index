title = "ที่ดินสามเหลี่ยม"
level = 1
hint = '''<p>ใช้สูตรสองเท่าของพื้นที่ในหน้า 12.5 <code>x1 * (y2 - y3) + x2 * (y3 - y1) + x3 * (y1 - y2)</code> ซึ่งเป็นจำนวนเต็มเสมอ แล้วพิมพ์ครึ่งหนึ่งของมันเองด้วย <code>/ 2</code> ตามด้วย <code>.0</code> หรือ <code>.5</code> ไม่ต้องใช้ <code>double</code> พิกัดถึง 10<sup>9</sup> ทำให้ผลคูณถึง 2 × 10<sup>18</sup> ทุกตัวแปรต้องเป็น <code>long long</code> และอย่าลืมกลับเครื่องหมายก่อนดูว่าเป็นเลขคู่หรือคี่</p>'''
