title = "แปลงฐาน"
level = 1
hint = '''<p>ทำสองขั้นตามหน้า 12.3 ขั้นแรกอ่าน N เป็นข้อความด้วย <code>%s</code> แล้วแปลงเป็นค่าตัวเลขด้วย <code>value = value * A + digit</code> ขั้นที่สองแปลงค่านั้นเป็นฐาน B ด้วย <code>% B</code> กับ <code>/ B</code> เก็บหลักไว้ในอาเรย์แล้วพิมพ์ย้อนกลับ เลข 0 ที่นำหน้าในข้อมูลเข้าไม่ทำให้ค่าเปลี่ยน และถ้าค่าเป็น 0 ต้องพิมพ์ <code>0</code> หนึ่งตัว ค่าถึง 10<sup>18</sup> ต้องใช้ <code>long long</code></p>'''
