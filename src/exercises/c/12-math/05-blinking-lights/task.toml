hint = '''<p>คำตอบคือ ค.ร.น. ของ T ทุกตัว หาทีละตัว <code>answer = lcm(answer, t)</code> โดย lcm ของสองตัวคือ <code>a / gcd(a, b) * b</code> ต้องหารก่อนคูณตามหน้า 12.2 เพราะ ค.ร.น. ที่สะสมมาอาจใหญ่ถึง 10<sup>18</sup> แล้ว ถ้าคูณกับ T ตัวถัดไปก่อนจะล้น <code>long long</code> แม้ T ตัวนั้นจะหาร ค.ร.น. ลงตัวจนคำตอบไม่เปลี่ยนก็ตาม</p>'''
