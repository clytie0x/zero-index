title = "วันไหนในสัปดาห์"
level = 1
hint = '''<p>วันที่ได้คือ D + K หารด้วย 7 เหลือเศษ แต่ K ติดลบได้ และ <code>%</code> ของเลขติดลบในภาษา C ได้เศษติดลบ ใช้ <code>((x % 7) + 7) % 7</code> ตามหน้า 12.1 ให้ได้ 0 ถึง 6 เสมอ K ใหญ่ถึง 10<sup>18</sup> จึงต้องเป็น <code>long long</code> ชื่อวันเก็บในอาเรย์สองมิติของ <code>char</code> แบบบทที่ 7 แล้วใช้เลขวันเป็น index</p>'''
