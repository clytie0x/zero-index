hint = '''<p>แยกตัวประกอบแบบหน้า 12.2 ลองหารตั้งแต่ 2 แค่ <code>p * p &lt;= n</code> ถ้า N เป็นจำนวนเฉพาะใกล้ 10<sup>12</sup> การลองหารไปจนถึง N ต้องวนเกือบ 10<sup>12</sup> รอบ พอลูปจบแล้ว n ยังเหลือมากกว่า 1 ที่เหลือคือจำนวนเฉพาะอีกตัวที่ต้องพิมพ์ด้วย เรื่องรูปแบบ ให้ใช้ตัวแปรจำว่าพิมพ์ตัวประกอบตัวแรกไปหรือยัง แล้วพิมพ์ <code> * </code> ก่อนตัวประกอบทุกตัวที่ไม่ใช่ตัวแรก</p>'''
