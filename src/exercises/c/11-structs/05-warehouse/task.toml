hint = '''<p>เก็บสินค้าเป็นอาเรย์ของ struct ที่มีรหัส จำนวน และราคา แล้วเขียนฟังก์ชันหาว่ารหัสนี้อยู่ช่องไหนด้วย <code>strcmp</code> แบบหน้า 11.2 อ่านชนิดคำสั่งด้วย <code>%s</code> แล้วเทียบกับ <code>"IN"</code> ระวังสองเรื่อง เบิกได้เมื่อของมีมากกว่าหรือเท่ากับที่ขอ และมูลค่าของสินค้าหนึ่งชนิดใหญ่ได้ถึงประมาณ 10<sup>15</sup> ต้องแปลงเป็น <code>long long</code> ก่อนคูณ</p>'''
