title = "นักวิ่งที่เร็วที่สุด"
level = 2
hint = '''<p>เก็บนักวิ่งเป็น struct ที่มีชื่อและ <code>Time</code> สองตัว แล้วใช้ <code>to_seconds</code> กับ <code>from_seconds</code> แบบหน้า 11.4 คนที่ชนะคือคนที่ใช้เวลาน้อยกว่า ถ้าใช้เวลาเท่ากันให้ดูว่าใครเข้าเส้นก่อน ซึ่งก็เทียบเวลาเข้าเส้นเป็นวินาทีได้เหมือนกัน ถ้าเท่ากันทั้งสองอย่าง ใช้ <code>&lt;</code> ไม่ใช่ <code>&lt;=</code> เพื่อให้ได้คนที่มาก่อน</p>'''
