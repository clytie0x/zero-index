title = "ตารางคะแนนลีก"
level = 3
hint = '''<p>เก็บทีมเป็น struct ที่มีชื่อ แต้ม ประตูได้ และประตูเสีย ทุกนัดหาว่าสองทีมอยู่ช่องไหนด้วย <code>strcmp</code> แล้วบวกค่าให้ทั้งสองทีม จากนั้นเขียนฟังก์ชัน <code>better</code> แบบหน้า 11.4 ที่ไล่ดูทีละเกณฑ์ ต้องการแค่สามอันดับแรก จึงไม่ต้องเรียงทั้งตาราง หาทีมที่ดีที่สุดในบรรดาทีมที่ยังไม่ถูกเลือก ทำสามรอบ และใช้อาเรย์ <code>used</code> จำว่าทีมไหนถูกเลือกไปแล้ว</p>'''
