title = "ร้านที่ใกล้บ้านที่สุด"
level = 1
hint = '''<p>เทียบระยะทางด้วยกำลังสองของระยะทางแบบตัวอย่าง <code>typedef</code> ในหน้า 11.1 ไม่ต้องถอดราก เพราะระยะที่น้อยกว่าก็มีกำลังสองน้อยกว่าเสมอ พิกัดไกลกันได้ถึง 2 × 10<sup>9</sup> ซึ่งแค่ผลต่างก็เกือบเต็ม <code>int</code> แล้ว และกำลังสองใหญ่ถึง 8 × 10<sup>18</sup> ให้เก็บพิกัดใน struct เป็น <code>long long</code> ตั้งแต่แรก</p>'''
