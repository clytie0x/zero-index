title = "หุ่นยนต์ส่งของ"
level = 3
hint = '''<p>เก็บทิศเป็นเลข 0 ถึง 3 แทน N E S W ตามลำดับตามเข็มนาฬิกา เลี้ยวขวาคือบวกหนึ่งแล้ว <code>% 4</code> เลี้ยวซ้ายคือบวกสามแล้ว <code>% 4</code> และเตรียมอาเรย์ <code>dx</code> กับ <code>dy</code> สี่ช่องไว้บอกว่าแต่ละทิศเดินแล้วพิกัดเปลี่ยนเท่าไร เขียนฟังก์ชันรับ <code>Robot *</code> แล้วแก้ผ่าน <code>-&gt;</code> ตามหน้า 11.4 พิกัดไปได้ไกลถึงประมาณ 10<sup>14</sup> ต้องใช้ <code>long long</code> ส่วนการนับคู่ที่อยู่ช่องเดียวกัน เทียบทุกคู่ได้เลย เพราะ N ไม่เกิน 1000</p>'''
