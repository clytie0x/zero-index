title = "พื้นที่ที่กล้องทุกตัวเห็น"
level = 2
hint = '''<p>เขียนฟังก์ชันรับมุมสองมุม แล้วคืน <code>Rect</code> ที่มี <code>low</code> เป็นมุมซ้ายล่างและ <code>high</code> เป็นมุมขวาบนจริงๆ ตามหน้า 11.4 จากนั้นใช้วิธีหาส่วนที่ทับกันในหน้า 11.3 กับกล้องทีละตัว ส่วนที่ทุกตัวเห็นมีขอบซ้ายเป็นค่ามากของขอบซ้ายทุกตัว และขอบขวาเป็นค่าน้อยของขอบขวาทุกตัว อย่าลืมกรณีที่ไม่ทับกันทั้งแนวนอนและแนวตั้งพร้อมกัน และพื้นที่ใหญ่ถึง 4 × 10<sup>18</sup></p>'''
