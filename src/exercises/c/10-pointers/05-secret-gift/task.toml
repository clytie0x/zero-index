hint = '''<p>ถ้านักเรียน i จับได้ชื่อ g แปลว่าคนที่ให้ของขวัญกับ g คือ i จึงเขียน <code>giver[g] = i</code> ได้ทันทีตอนอ่าน ไม่ต้องค้นหา ขนาดของแต่ละห้องรู้ตอนรันเท่านั้น ให้จองอาเรย์ด้วย <code>malloc</code> ตามขนาด n + 1 ของห้องนั้น ใช้เสร็จแล้ว <code>free</code> ก่อนไปห้องถัดไป ตามหน้า 10.5</p>'''
