title = "ชื่อไฟล์และนามสกุล"
level = 1
hint = '''<p>เขียน <code>char *find_last(char *s, char c)</code> ที่เดินด้วย pointer ไปจนถึง <code>'\0'</code> แล้วจำตำแหน่งล่าสุดที่เจอ <code>c</code> ไว้ ถ้าไม่เจอเลยให้คืน <code>NULL</code> หา <code>'/'</code> ตัวสุดท้ายในทั้ง path ก่อน ชื่อไฟล์เริ่มที่ตัวถัดจากนั้น แล้วค่อยหา <code>'.'</code> ตัวสุดท้าย<strong>ในชื่อไฟล์</strong> ไม่ใช่ในทั้ง path เขียน <code>'\0'</code> ทับจุดนั้นก็จะตัดชื่อกับนามสกุลออกจากกันได้ทันที</p>'''
