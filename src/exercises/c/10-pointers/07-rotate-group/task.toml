title = "หมุนกลุ่มในแถว"
level = 3
time_limit = 1
hint = '''<p>หมุนครบหนึ่งรอบของกลุ่มได้แถวเดิม จึงลด k เหลือ <code>k % len</code> ก่อน แต่หมุนทีละคนก็ยังช้าเมื่อกลุ่มยาว ให้ใช้ฟังก์ชัน <code>void reverse(int *first, int *last)</code> ที่กลับลำดับตั้งแต่ <code>first</code> ถึง <code>last</code> ด้วย pointer สองตัวเดินเข้าหากันแบบหน้า 10.3 แล้วลองกลับลำดับ k คนแรกของกลุ่ม กลับลำดับคนที่เหลือ แล้วกลับลำดับทั้งกลุ่ม ลองทำด้วยมือกับ <code>1 2 3 4 5</code> และ k = 2 ดูว่าได้อะไร</p>'''
