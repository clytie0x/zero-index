hint = '''<p>ถ้าสลับแถวด้วยการคัดลอกค่าทีละช่อง หนึ่งครั้งต้องคัดลอก C ช่อง เมื่อ C ใหญ่และ Q ใหญ่จะไม่ทัน ให้เก็บตารางแบบหน้า 10.5 คือ <code>int **table</code> ที่แต่ละแถวจองแยกกัน แล้วสลับแค่ pointer ของสองแถว <code>table[a]</code> กับ <code>table[b]</code> ซึ่งเป็นค่าเดียวต่อแถว ไม่ว่าแถวจะยาวเท่าไร ฟังก์ชันสลับจึงรับ <code>int **</code> สองตัว</p>'''
