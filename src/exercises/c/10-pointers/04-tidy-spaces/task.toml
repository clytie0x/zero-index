title = "เก็บช่องว่าง"
level = 1
hint = '''<p>ใช้ pointer สองตัวเดินบนสตริงเดียวกัน <code>read</code> เดินอ่านทุกตัว <code>write</code> ชี้ช่องถัดไปที่จะเขียน ตัวอักษรที่ไม่ใช่ช่องว่างคัดลอกเสมอ ส่วนช่องว่างให้คัดลอกเฉพาะเมื่อตัวที่เขียนไปล่าสุดไม่ใช่ช่องว่างและไม่ได้อยู่หัวบรรทัด <code>write</code> ไม่มีทางแซง <code>read</code> จึงเขียนทับในอาเรย์เดิมได้ จบแล้วอย่าลืมตัดช่องว่างตัวท้ายที่อาจเหลืออยู่ และเขียน <code>'\0'</code> ปิด</p>'''
