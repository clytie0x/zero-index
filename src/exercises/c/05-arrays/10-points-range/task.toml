hint = '''<p>เริ่มจากอาเรย์นับว่าแต่ละแต้มมีกี่คน แล้วทำผลรวมสะสมบนอาเรย์นับนั้น จะได้ว่ามีกี่คนที่แต้มน้อยกว่าค่าหนึ่งๆ แต่ละคำถามจึงตอบได้ด้วยการลบครั้งเดียว ระวังคำถามที่ A เป็น 0 ซึ่งทำให้ A - 1 ติดลบ ลองให้ <code>prefix[v]</code> คือจำนวนคนที่แต้มน้อยกว่า v แบบเดียวกับที่ <code>prefix[0]</code> ในหน้า 5.4 เป็นผลรวมของศูนย์ตัว อาเรย์ขนาดล้านช่องต้องอยู่นอก <code>main</code></p>'''
