hint = '''<p>กำไรรวมของวันที่ s ถึงวันที่ s + K - 1 หาได้จากผลรวมสะสมด้วยการลบครั้งเดียว ลองทุกวันเริ่ม s ตั้งแต่ 1 ถึง N - K + 1 แล้วหาค่ามากสุดแบบหน้า 5.2 กำไรอาจติดลบทุกช่วง จึงห้ามเริ่มค่ามากสุดที่ 0 และกำไรรวมเกิน <code>int</code> ได้</p>'''
