hint = '''<p>หมุนครบ N ครั้ง ม้าทุกตัวกลับที่เดิม จึงหมุนแค่ <code>K % N</code> ครั้งก็พอ แต่หมุนทีละครั้งแบบหน้า 5.5 ยังช้าอยู่ดีเมื่อ N ใหญ่ ให้คิดตรงๆ ว่าหลังหมุน ช่อง index <code>j</code> ได้ม้ามาจากช่อง index ไหนของอาเรย์เดิม แล้วระวัง <code>%</code> กับเลขติดลบตามหน้า 1.2</p>'''
