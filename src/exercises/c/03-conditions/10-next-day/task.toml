title = "วันพรุ่งนี้"
level = 3
hint = '''<p>แบ่งเป็นสองขั้น ขั้นแรกหาว่าเดือนนี้มีกี่วัน แบบเดียวกับข้อจำนวนวันในเดือน ขั้นที่สองถ้าวันนี้ยังไม่ใช่วันสุดท้ายของเดือน แค่เพิ่มวันหนึ่งวัน ถ้าเป็นวันสุดท้าย วันกลับเป็น 1 แล้วเลื่อนเดือน และถ้าเดือนเป็น 12 ต้องเลื่อนปีด้วย ทดสอบกับ 28 และ 29 กุมภาพันธ์ทั้งปีปกติและปีอธิกสุรทิน และ 31 ธันวาคม</p>'''
