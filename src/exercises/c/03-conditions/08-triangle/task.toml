title = "ชนิดของสามเหลี่ยม"
level = 2
hint = '''<p>ตรวจก่อนว่าเป็นสามเหลี่ยมได้ไหม ต้องเช็กครบทั้งสามคู่ เพราะด้านที่ยาวที่สุดอาจอยู่ตำแหน่งไหนก็ได้ ถ้าเป็นไม่ได้ให้ตอบทันที อย่าดูด้านเท่ากันก่อน เพราะ <code>1 1 3</code> มีด้านเท่ากันแต่ไม่ใช่สามเหลี่ยม เวลาเช็กด้านเท่ากันสองด้าน ต้องดูให้ครบทั้งสามคู่เช่นกัน ผลบวกสองด้านมากสุด 2 × 10<sup>9</sup> ยังเก็บใน <code>int</code> ได้ตามตารางในหน้า 1.3</p>'''
