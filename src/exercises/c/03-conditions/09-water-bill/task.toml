hint = '''<p>คิดแบบเดียวกับค่าไฟในหน้า 3.2 แต่ละขั้นคิดด้วยราคาของขั้นนั้นเท่านั้น ขั้นที่ใช้เต็มแล้วเป็นค่าคงที่ คือ 10 × 8 และ 20 × 12 คิดค่าน้ำเสร็จแล้ว ค่อยใช้ <code>if</code> อีกตัวตรวจขั้นต่ำ 50 บาท ลองป้อน 6 7 10 11 30 31 แล้วดูว่าค่าน้ำเพิ่มทีละเท่าราคาของขั้นนั้นจริง</p>'''
