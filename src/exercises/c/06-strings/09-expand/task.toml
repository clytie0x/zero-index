hint = '''<p>ใช้ตัวชี้ตำแหน่ง <code>i</code> เดินไปทีละกลุ่ม อ่านตัวอักษรหนึ่งตัว แล้วอ่านตัวเลขที่ตามมาทุกหลักด้วย <code>count = count * 10 + (c - '0')</code> แบบในหน้า 6.1 จนเจอตัวที่ไม่ใช่ตัวเลข ระวังตัวเลขหลายหลักอย่าง 12 หรือ 100000 และตัวเลขที่มี 0 อยู่ข้างในอย่าง 10</p>'''
