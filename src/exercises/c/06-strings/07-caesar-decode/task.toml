hint = '''<p>มีกับดักสามจุด จุดแรก บรรทัดแรกเป็นตัวเลข บรรทัดที่สองเป็นข้อความที่มีช่องว่าง ต้องอ่านทิ้งให้ถึง <code>'\n'</code> ก่อนเรียก <code>fgets</code> ตามหน้า 6.3 จุดที่สอง K ใหญ่ถึง 10<sup>9</sup> ให้ <code>% 26</code> ก่อน จุดที่สาม การถอยหลัง K ตัวเท่ากับเดินหน้า 26 - K % 26 ตัว ใช้สูตร <code>(c - 'a' + shift) % 26 + 'a'</code> ใน <code>int</code> อย่าบวกลบใน <code>char</code> ตรงๆ</p>'''
