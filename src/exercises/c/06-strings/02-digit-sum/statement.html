<p>ครูเขียนตัวเลขยาวมากเต็มกระดาน แล้วถามว่าถ้าเอาเลขโดดทุกหลักมาบวกกันจะได้เท่าไร เช่น 2569 ได้ 2 + 5 + 6 + 9 = 22 ให้เขียนโปรแกรมตอบคำถามนี้</p>

<h3>ข้อมูลเข้า</h3>
<p>จำนวนเต็มบวก N หนึ่งตัว ไม่มีเลข 0 นำหน้า N มีจำนวนหลักตั้งแต่ 1 ถึง 1000 หลัก</p>

<h3>ข้อมูลออก</h3>
<p>ผลบวกของเลขโดดทุกหลักของ N</p>
