title = "สลับอักษร"
level = 3
hint = '''<p>วิธีตรงไปตรงมาคือไล่ตัวอักษรของคำแรกทีละตัว แล้วค้นหาตัวเดียวกันในคำที่สองที่ยังไม่ถูกใช้ ซึ่งต้องค้นทั้งคำทุกครั้ง คำยาวหนึ่งแสนตัวจึงเป็นงานราว 10<sup>10</sup> ก้าว ช้าเกินไปมาก ลองนับแทน ใช้อาเรย์ 26 ช่องนับตัวอักษรของแต่ละคำแบบในหน้า 6.5 แล้วเทียบอาเรย์ทั้งสองทีละช่อง</p>'''
