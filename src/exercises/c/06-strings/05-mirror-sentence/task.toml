hint = '''<p>ทำสองขั้น ขั้นแรกเดินทั้งบรรทัด เก็บเฉพาะตัวอักษรที่ผ่าน <code>isalpha</code> แปลงเป็นตัวพิมพ์เล็กด้วย <code>tolower</code> ลงอีกอาเรย์หนึ่ง ขั้นที่สองเช็ก palindrome กับอาเรย์ใหม่นั้นแบบในหน้า 6.5 บรรทัดยาวได้หนึ่งแสนตัว ประกาศอาเรย์ทั้งสองไว้นอก <code>main</code></p>'''
