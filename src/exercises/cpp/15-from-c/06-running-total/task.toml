hint = '''<p>วิธีคิดง่ายมาก บวกสะสมไปแล้วพิมพ์ทุกรอบ ไม่ต้องเก็บอาเรย์ ยอดสะสมได้ถึง 10<sup>6</sup> × 10<sup>9</sup> = 10<sup>15</sup> ต้องเป็น <code>long long</code> ส่วนที่ยากคือเวลา หน้า 15.3 วัดไว้ว่า <code>cin</code> <code>cout</code> แบบปกติกับข้อมูลขนาดนี้ใช้กว่า 3 วินาที ต้องใส่ <code>ios::sync_with_stdio(false);</code> กับ <code>cin.tie(nullptr);</code> ไว้ต้น <code>main</code> และขึ้นบรรทัดด้วย <code>'\n'</code> ไม่ใช่ <code>endl</code></p>'''
