hint = '''<p>เก็บชื่อผู้สมัครในอาเรย์ <code>string name[10]</code> และคะแนนใน <code>int votes[10]</code> เขียนฟังก์ชัน <code>void make_lower(string &amp;word)</code> ที่รับ reference แล้วเปลี่ยนทุกตัวเป็นตัวพิมพ์เล็กด้วย <code>for (char &amp;c : word)</code> พออ่านบัตรมาแล้วเรียกฟังก์ชันนี้ก่อน แล้วค่อยเทียบกับชื่อผู้สมัครทีละคนด้วย <code>==</code> ไม่ตรงใครเลยคือบัตรเสีย ตอนหาผู้ชนะ ให้หาคะแนนสูงสุดก่อน แล้วนับว่ามีกี่คนที่ได้คะแนนเท่านั้น บัตรมีได้ถึงล้านใบ อย่าลืมสองบรรทัดจากหน้า 15.3</p>'''
