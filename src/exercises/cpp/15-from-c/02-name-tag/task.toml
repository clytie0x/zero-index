title = "ป้ายชื่อ"
level = 1
hint = '''<p>อ่านชื่อกับนามสกุลเป็น <code>string</code> สองตัว เปลี่ยนชื่อทั้งคำเป็นตัวพิมพ์เล็กก่อนด้วย <code>for (char &amp;c : first)</code> กับ <code>tolower</code> แล้วค่อยเปลี่ยน <code>first[0]</code> เป็นตัวพิมพ์ใหญ่ ส่วนนามสกุลใช้แค่ <code>toupper(last[0])</code> ระวังว่า <code>toupper</code> คืนค่าเป็น <code>int</code> ถ้าส่งให้ <code>cout</code> ตรงๆ จะได้ตัวเลข ต้องเก็บใส่ตัวแปร <code>char</code> ก่อน หรือเขียน <code>(char)toupper(last[0])</code></p>'''
