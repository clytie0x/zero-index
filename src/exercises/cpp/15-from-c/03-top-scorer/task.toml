title = "คนที่ได้คะแนนสูงสุด"
level = 1
hint = '''<p>เก็บคะแนนสูงสุดที่เจอไว้ใน <code>int</code> และชื่อของคนนั้นไว้ใน <code>string</code> เจอคนที่คะแนน<strong>มากกว่า</strong>ค่าเดิมเมื่อไรค่อยเปลี่ยน ใช้ <code>=</code> คัดลอกชื่อได้เลย ไม่ต้องใช้ <code>strcpy</code> ถ้าใช้ <code>&gt;=</code> จะได้คนสุดท้ายที่ได้คะแนนเท่ากัน ค่าเฉลี่ยต้องหารแบบทศนิยม แล้วพิมพ์ด้วย <code>fixed</code> กับ <code>setprecision(2)</code> ตามหน้า 15.2</p>'''
