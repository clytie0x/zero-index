title = "กันสปอยล์"
level = 3
hint = '''<p>ข้อความมีช่องว่าง ต้องรับด้วย <code>getline</code> และเพราะบรรทัดก่อนหน้าอ่านด้วย <code>cin &gt;&gt;</code> ต้องมี <code>cin.ignore(1000000, '\n');</code> ก่อน ไม่อย่างนั้นจะได้ข้อความว่าง เก็บคำต้องห้ามไว้ในอาเรย์ <code>string banned[100]</code> แล้วเดินในข้อความด้วย <code>i</code> เจอตัวอักษรที่ช่อง <code>i</code> ให้เดินต่อด้วย <code>j</code> จนสุดคำ ตัดคำออกมาด้วย <code>substr(i, j - i)</code> ถ้าเท่ากับคำต้องห้ามสักคำ ให้เปลี่ยนช่อง <code>i</code> ถึง <code>j - 1</code> เป็น <code>'*'</code> แล้วไปต่อที่ <code>j</code> อย่าใช้ <code>find</code> หาคำต้องห้ามในข้อความตรงๆ เพราะจะไปเจอข้างในคำที่ยาวกว่า</p>'''
