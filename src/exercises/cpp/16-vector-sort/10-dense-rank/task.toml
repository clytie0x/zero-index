title = "อันดับไม่ข้ามเลข"
level = 3
hint = '''<p>อันดับของผู้เล่นคือ 1 บวกจำนวนแต้ม<strong>ที่ไม่ซ้ำกัน</strong>ที่มากกว่าแต้มของเขา สร้างรายการแต้มที่ไม่ซ้ำโดยคัดลอก vector ไปอีกตัว <code>sort</code> แล้ว <code>erase</code> คู่กับ <code>unique</code> จากนั้นแต่ละคนหาตำแหน่งแต้มของตัวเองในรายการนั้นด้วย <code>lower_bound</code> ถ้ารายการเรียงจากน้อยไปมากและมี D ค่า แต้มที่ตำแหน่ง p มีค่าที่มากกว่าอยู่ D - 1 - p ค่า ถ้าไล่นับทุกคู่จะใช้ราว 4 × 10<sup>10</sup> ครั้ง ไม่ทัน</p>'''
