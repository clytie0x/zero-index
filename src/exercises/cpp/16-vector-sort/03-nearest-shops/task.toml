hint = '''<p>เก็บแต่ละร้านเป็น <code>pair&lt;int, int&gt;</code> ของ (ระยะทาง, หมายเลขร้าน) โดยเอาระยะทางไว้ใน <code>first</code> เพราะ pair เทียบ <code>first</code> ก่อน ถ้าเท่ากันค่อยเทียบ <code>second</code> ซึ่งตรงกับกติกาของโจทย์พอดี เรียงด้วย <code>sort</code> ได้เลยโดยไม่ต้องเขียน lambda แล้วพิมพ์ <code>second</code> ของ K ตัวแรก ระวังหมายเลขร้านเริ่มจาก 1 ไม่ใช่ 0</p>'''
