title = "บ้านที่ใกล้จุดพบลูกน้ำ"
level = 2
hint = '''<p>ไล่ดูทุกบ้านในทุกครั้งต้องทำ N × Q ถึง 4 × 10<sup>10</sup> ครั้ง ไม่ทัน เรียงตำแหน่งบ้านครั้งเดียว แล้วบ้านที่ใกล้ p ที่สุดมีแค่สองหลังที่เป็นไปได้ คือหลังแรกที่ตำแหน่งไม่น้อยกว่า p ซึ่งได้จาก <code>lower_bound</code> ตามหน้า 16.5 กับหลังที่อยู่ก่อนหน้ามันหนึ่งช่อง ให้เก็บเป็นเลขช่อง k แบบตัวอย่างในหน้านั้น ระวังสองกรณี ถ้า k เท่ากับ N แปลว่าทุกหลังอยู่ก่อน p ไม่มีหลังที่ k และถ้า k เป็น 0 ก็ไม่มีหลังก่อนหน้า อ่านช่องที่ไม่มีอยู่จริงไม่มี error เตือน อาจได้ค่าขยะหรือโปรแกรมพัง ถ้าสองหลังห่างเท่ากันให้เลือกหลังก่อนหน้า เพราะตำแหน่งน้อยกว่า อย่าลืมเปิด <code>ios::sync_with_stdio(false)</code> เพราะข้อมูลเข้ามีหกแสนตัวเลข</p>'''
