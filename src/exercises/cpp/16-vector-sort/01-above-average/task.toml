title = "สูงกว่าค่าเฉลี่ย"
level = 1
hint = '''<p>ต้องรู้ค่าเฉลี่ยก่อนถึงจะตัดสินได้ว่าใครสูงกว่า จึงต้องเก็บคะแนนทุกตัวไว้แล้ววนรอบที่สอง ไม่รู้ว่ามีกี่คน ใช้ <code>vector</code> แล้ว <code>push_back</code> ไปเรื่อยๆ จนเจอ -1 ส่วนการเทียบกับค่าเฉลี่ย ไม่ต้องใช้ทศนิยมเลย คะแนน x สูงกว่าค่าเฉลี่ยเมื่อ x × จำนวนคน &gt; ผลรวม</p>'''
