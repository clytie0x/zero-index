hint = '''<p>ชิ้นที่แพงที่สุดไม่มีทางได้ฟรี เพราะในกลุ่มของมันต้องมีชิ้นที่ถูกกว่าหรือเท่ากัน ทางที่ดีที่สุดคือให้สองชิ้นที่แพงที่สุดพาชิ้นที่แพงอันดับสามไปฟรีด้วย แล้วทำแบบเดิมกับที่เหลือ เรียงราคาจากมากไปน้อยด้วย <code>sort</code> กับ <code>greater&lt;int&gt;()</code> แล้วรวมทุกชิ้นยกเว้นชิ้นที่ index เป็น 2, 5, 8, ... ราคารวมถึง 2 × 10<sup>11</sup> ต้องใช้ <code>long long</code> และ N ถึงสองแสน เรียงด้วยลูปซ้อนไม่ทัน</p>'''
