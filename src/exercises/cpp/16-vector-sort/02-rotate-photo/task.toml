hint = '''<p>อาเรย์สองมิติขนาดตายตัวต้องจองไว้ 200000 × 200000 ช่องถึงจะรับได้ทั้งรูปผอมแนวนอนและแนวตั้ง ซึ่งใหญ่เกินไปมาก ใช้ <code>vector&lt;vector&lt;int&gt;&gt;</code> ที่สร้างตามขนาดจริงหลังอ่าน R กับ C แล้ว ลองหมุนตัวอย่างด้วยมือก่อน แถวที่ i ของรูปใหม่คือคอลัมน์ที่ i ของรูปเดิม อ่านจากล่างขึ้นบน</p>'''
