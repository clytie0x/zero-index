hint = '''<p>เทียบทุกคู่ต้องทำราว 2 × 10<sup>10</sup> ครั้ง ไม่ทัน ให้เรียงขนาดจากน้อยไปมากก่อน แล้วสำหรับไฟล์ที่ i ไฟล์ที่จับคู่ได้คือไฟล์หลังจากมันที่ขนาดไม่เกิน B - s<sub>i</sub> ซึ่งอยู่ติดกันเป็นช่วงในข้อมูลที่เรียงแล้ว นับได้ด้วย <code>upper_bound</code> ที่เริ่มค้นจาก <code>v.begin() + i + 1</code> มีสามจุดที่ต้องใช้ <code>long long</code> คือ B ขนาดรวมของสองไฟล์ และคำตอบ ซึ่งอาจถึงราว 2 × 10<sup>10</sup></p>'''
