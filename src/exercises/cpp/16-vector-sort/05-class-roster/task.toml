title = "รายชื่อหน้าห้อง"
level = 2
hint = '''<p>เก็บแต่ละคนเป็น struct แล้วเขียน lambda ที่เทียบเลขห้องก่อน ถ้าห้องต่างกันห้องน้อยมาก่อน ถ้าห้องเท่ากันคะแนนมากมาก่อน เงื่อนไขที่สามคือลำดับที่ส่งใบสมัคร มีสองทาง ใช้ <code>stable_sort</code> ซึ่งรักษาลำดับเดิมของคนที่เทียบแล้วเท่ากันให้เอง หรือเก็บลำดับที่รับเข้ามาไว้ใน struct แล้วใช้เป็นเงื่อนไขสุดท้ายของ <code>sort</code> ถ้าใช้ <code>sort</code> เฉยๆ ตัวอย่างเล็กๆ อาจบังเอิญผ่าน แต่ชุดทดสอบที่มีคนคะแนนเท่ากันเยอะจะผิด</p>'''
