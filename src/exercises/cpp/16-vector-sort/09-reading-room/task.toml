title = "ห้องอ่านหนังสือ"
level = 3
hint = '''<p>แยกแต่ละรายการเป็นสองเหตุการณ์ คือ (s, +1) ตอนมีคนเข้า และ (e, -1) ตอนมีคนออก เก็บเป็น <code>pair&lt;int, int&gt;</code> ใน vector เดียวกัน แล้ว <code>sort</code> ตามเวลา จากนั้นไล่เหตุการณ์ทีละตัว บวก second เข้าไปในตัวนับจำนวนคนในห้อง ค่ามากสุดของตัวนับคือคำตอบแรก ส่วนเวลาที่ห้องมีคนออกกับมีคนเข้าพร้อมกัน ต้องให้คนออกก่อน ไม่อย่างนั้นจะนับเกิน ลองคิดดูว่า pair เรียง (t, -1) กับ (t, +1) แบบไหน เวลาแรกที่ตัวนับขึ้นไปถึงค่ามากสุดคือคำตอบที่สอง ถ้าเทียบทุกคู่จะใช้ราว 2 × 10<sup>10</sup> ครั้ง ไม่ทัน</p>'''
