title = "ไฟดับกี่หลัง"
level = 2
hint = '''<p>ไล่นับทุกบ้านในทุกคำถามต้องทำ N × Q ถึง 4 × 10<sup>10</sup> ครั้ง ไม่ทัน เรียงตำแหน่งบ้านครั้งเดียว แล้วบ้านที่อยู่ในช่วง L ถึง R จะติดกันเป็นช่วงเดียว <code>lower_bound(L)</code> ชี้บ้านหลังแรกที่ตำแหน่งไม่น้อยกว่า L ส่วน <code>upper_bound(R)</code> ชี้บ้านหลังแรกที่อยู่เลย R ไปแล้ว ผลต่างของสองตำแหน่งนี้คือคำตอบ ระวังว่าถ้าใช้ <code>lower_bound(R)</code> แทน บ้านที่อยู่ตรง R พอดีจะหายไป และอย่าลืมเปิด <code>ios::sync_with_stdio(false)</code> เพราะข้อมูลเข้ามีหกแสนตัวเลข</p>'''
