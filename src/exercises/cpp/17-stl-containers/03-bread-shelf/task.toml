title = "ชั้นวางขนมปัง"
level = 1
time_limit = 1
hint = '''<p>ชั้นที่เพิ่มและหยิบได้ทั้งซ้ายและขวา แถมต้องดูชิ้นตรงกลางได้ คือ <code>deque</code> ในหน้า 17.2 ให้ซ้ายสุดเป็นหัว ขวาสุดเป็นท้าย ชิ้นที่ i นับจาก 1 คือ <code>shelf[i - 1]</code> เพราะ deque นับจาก 0 ก่อนดูต้องเช็กว่ามีถึง i ชิ้นไหม เพราะวงเล็บเหลี่ยมไม่ตรวจขอบให้ และเทียบ i กับ <code>(int)shelf.size()</code> ตามแบบที่ 1 ของการลองทำให้พังในหน้า 17.2 ถ้าใช้ <code>vector</code> แทน การเพิ่มหรือลบชิ้นซ้ายสุดทุกครั้งต้องเลื่อนทุกชิ้น ช้าลงตามจำนวนชิ้นกำลังสองแบบตารางในหน้า 17.2</p>'''
