title = "เครื่องพิมพ์ผลัดกันพิมพ์"
level = 3
time_limit = 1
hint = '''<p>เริ่มจากโปรแกรม game-turns ในหน้า 17.4 แต่ให้ queue เก็บ<strong>หมายเลขงาน</strong> ส่วนหน้าที่เหลือเก็บในอาเรย์แยก จะได้เขียนเวลาเสร็จลงช่องของงานนั้นได้ เพิ่มตัวแปร <code>next</code> ชี้งานถัดไปที่ยังไม่มาถึง ทุกครั้งที่เวลาเดินไป ให้วนเอางานที่ <code>arrive[next] &lt;= now</code> ต่อท้ายคิว ลำดับในกฎข้อสามสำคัญ งานที่มาถึงต้องต่อคิว<strong>ก่อน</strong>งานที่เพิ่งพิมพ์ไม่จบ ถ้าคิวว่างแต่ยังมีงานไม่เสร็จ ให้กระโดดเวลาไปที่งานถัดไปมาถึงเลย อย่าเดินทีละวินาที เวลาเกิน <code>int</code> ได้เพราะงานยาวพันล้านหน้าเรียงกันได้แสนงาน ใช้ <code>long long</code> แต่ละรอบใช้คำสั่งของ queue ไม่กี่ตัว งานรวมจึงโตตามจำนวนรอบซึ่งไม่เกินสองล้าน</p>'''
