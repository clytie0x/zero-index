title = "ภาพวาดบนรั้วไม้"
level = 3
time_limit = 1
source = "แนวเดียวกับโจทย์ largest rectangle in histogram ที่ใช้ฝึก monotonic stack"
hint = '''<p>ภาพที่ใหญ่ที่สุดต้องสูงเท่ากับแผ่นที่เตี้ยที่สุดที่มันทับพอดี ไม่อย่างนั้นยืดให้สูงขึ้นได้อีก จึงลองให้แผ่น i แต่ละแผ่นเป็นแผ่นที่เตี้ยที่สุดของภาพ แล้วขยายภาพไปทางซ้ายและขวาจนชนแผ่นแรกที่<strong>เตี้ยกว่า</strong>แผ่น i ถ้าเดินขยายทีละแผ่น รั้วที่สูงเท่ากันทั้งล้านแผ่นต้องเดินราว 10<sup>12</sup> ก้าว ไม่ทัน แผ่นแรกทางซ้ายที่เตี้ยกว่า กับแผ่นแรกทางขวาที่เตี้ยกว่า คือโจทย์แบบเดียวกับวันแรกที่ร้อนกว่าในหน้า 17.3 แต่กลับเป็นหาตัวที่น้อยกว่า ใช้ monotonic stack สองรอบ รอบแรกเดินจากซ้ายไปขวาได้แผ่นที่เตี้ยกว่าทางซ้าย รอบสองเดินจากขวาไปซ้ายได้แผ่นที่เตี้ยกว่าทางขวา ถ้าทางซ้ายเป็นแผ่น L และทางขวาเป็นแผ่น R ภาพกว้าง R - L - 1 ถ้าไม่มีให้ถือว่า L เป็น -1 และ R เป็น N พื้นที่ใหญ่ถึง 10<sup>6</sup> × 10<sup>9</sup> ต้องคูณเป็น <code>long long</code></p>'''
