title = "สะพานแกว่ง"
level = 3
time_limit = 1
source = "แนวเดียวกับโจทย์ sliding window maximum ที่ใช้ฝึก deque"
hint = '''<p>ไล่หาค่ามากสุดและน้อยสุดใหม่ทุกช่วง เมื่อ N เป็นล้านและ K เป็นห้าแสน ต้องดูราว 2.5 × 10<sup>11</sup> ค่า ไม่ทัน ใช้ monotonic deque แบบโปรแกรม window-deque ในหน้า 17.4 <strong>สองตัว</strong> ตัวหนึ่งหาค่ามากสุด ค่าเรียงจากหัวไปท้ายไม่เพิ่มขึ้น อีกตัวหาค่าน้อยสุด ค่าเรียงจากหัวไปท้ายไม่ลดลง ตัวหลังเขียนเหมือนตัวแรกทุกอย่าง แค่กลับเครื่องหมายเทียบตอนทิ้งท้าย ทั้งสองตัวต้องทิ้งหัวที่หลุดหน้าต่างด้วย ระวังคำตอบ ค่ามากสุด 2 × 10<sup>9</sup> ลบค่าน้อยสุด -2 × 10<sup>9</sup> ได้ 4 × 10<sup>9</sup> เกิน <code>int</code> ต้องแปลงเป็น <code>long long</code> ก่อนลบ</p>'''
