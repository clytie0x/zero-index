title = "ลูกแก้วสีเดียวกัน"
level = 2
time_limit = 1
hint = '''<p>ถ้าวนหาคู่ที่ติดกันตั้งแต่ซ้ายสุด ลบด้วย <code>erase</code> แล้วเริ่มหาใหม่ แถวแบบ <code>abc...cba</code> ที่ยาวล้านลูกจะแตกจากตรงกลางทีละคู่ ทุกคู่ต้องเดินหาจากซ้ายสุดไปถึงกลางแถวแล้วเลื่อนครึ่งหลัง รวมราว 2.5 × 10<sup>11</sup> ก้าว ไม่ทัน ให้คิดว่าวางลูกแก้วลงรางใหม่ทีละลูกจากซ้ายไปขวา ลูกที่วางแล้วและยังไม่แตกเป็น stack ลูกใหม่แตกได้กับลูกขวาสุดที่วางไว้เท่านั้น ซึ่งก็คือตัวบนสุด ถ้าสีเดียวกันให้ pop ไม่อย่างนั้นให้ push ทุกลูกถูก push และ pop อย่างละไม่เกินหนึ่งครั้ง ตอนจบต้องพิมพ์จากก้น stack ขึ้นมา ซึ่ง <code>stack</code> ทำไม่ได้ ให้ใช้ <code>string</code> เป็น stack แทนด้วย <code>push_back</code> <code>pop_back</code> และ <code>back</code> แบบเดียวกับที่หน้า 17.1 บอกว่า vector ใช้เป็น stack ได้</p>'''
