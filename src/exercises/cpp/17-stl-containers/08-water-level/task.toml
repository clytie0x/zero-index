title = "สูงสุดในรอบกี่วัน"
level = 3
time_limit = 1
source = "แนวเดียวกับโจทย์ stock span ที่ใช้ฝึก monotonic stack"
hint = '''<p>ถ้าทุกวันเดินย้อนกลับไปจนเจอวันที่สูงกว่า เมื่อระดับน้ำสูงขึ้นทุกวัน วันสุดท้ายต้องย้อนเกือบล้านวัน รวมราว 5 × 10<sup>11</sup> ก้าว ไม่ทัน สิ่งที่ต้องหาจริงๆ คือ<strong>วันล่าสุดก่อนหน้าที่สูงกว่าวันนี้อย่างเคร่งครัด</strong> ถ้าวันนั้นคือวันที่ j คำตอบคือ i - j และถ้าไม่มีเลย คำตอบคือ i + 1 เมื่อนับวันจาก 0 นี่คือโจทย์วันแรกที่ร้อนกว่าในหน้า 17.3 แต่มองย้อนไปทางซ้าย ใช้ monotonic stack เก็บเลขวัน เดินจากซ้ายไปขวา ก่อนตอบวันที่ i ให้ pop วันที่<strong>ไม่สูงกว่า</strong>วันที่ i ทิ้งให้หมด เพราะวันพวกนี้ไม่มีวันเป็นวันที่สูงกว่าของวันหลังจากนี้อีก ตัวบนสุดที่เหลือคือวันที่ต้องการ แล้วค่อย push i วันที่ระดับน้ำเท่ากันนับรวมในช่วงด้วย ระวังเครื่องหมาย <code>&lt;</code> กับ <code>&lt;=</code> ให้ตรงกับข้อนี้</p>'''
